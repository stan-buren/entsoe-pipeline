  # ===========================================================================
  # 🚀 Discovering a monster - OfferedTransferCapacitiesContinuousEvolution_11.1
  # The most shocking discovery of the day. I had thought the entire ENTSO-E platform amounted to a modest ~300 GB. 
  # That was the figure shown in an old report from May 28th. 
  # But that old report performed only a shallow scan—covering just the top-level folders without recursing into the `daily/TSO` subdirectories.
  # 
  # A new, deep recursive scan (the one that ran in tmux) revealed the reality:
  # 
  # PROD Transmission = 9.3 TB. Not gigabytes. Terabytes.
  # 
  # Specifically:
  # 
  # OfferedTransferCapacitiesContinuousEvolution_11.1_r3:
  # Files: 203,549
  # Original: 9,706,461 MB = 9.25 TB
  # Compressed: 191,125 MB = 186.6 GB
  # Structure: every day of every month × ~40 TSOs
  # Each file: a tiny CSV (~262 bytes)
  # This is just one data item. 
  # It accounts for 96.5% of all ENTSOE-FMS PROD
  # 205 043 diles only for this domain.
  # 
  # The overall PROD picture:
  # 
  # 218,000 files
  # 9.4 TB original volume (I thought it was 300 GB—I was off by a factor of 30)
  # 195 GB compressed
  # 25,488 API requests (with 20,374 of those—80%—going to Transmission alone)
  # ===========================================================================
    OfferedTransferCapacitiesContinuousEvolution_11.1:
      name: "Continuous Allocations - OC Evolution"
      fms_name: OfferedTransferCapacitiesContinuousEvolution_11.1_r3
    EnergyPrices_12.1.D:
      name: "Energy Prices [12.1.D]"
      fms_name: EnergyPrices_12.1.D_r3

