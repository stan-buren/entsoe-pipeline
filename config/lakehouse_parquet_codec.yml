lakehouse:
  purge_raw_after_transform: false
  write_properties:
    compression_codec: "zstd"
    compression_level: 3
    target_parquet_size_bytes: 268435456
  publication_overrides:
    OfferedTransferCapacitiesContinuousEvolution_11.1_r3:
      compression_codec: "zstd"
      compression_level: 21


metadata:
  purge_raw_after_transform:
    description: |
      Flag to determine whether raw CSV/unstructured files in the landing zone should be deleted
      immediately after they are successfully processed and transformed into the Lakehouse (Iceberg tables).
      This helps conserve local disk space or cloud storage costs, functioning as an ephemeral landing zone,
      but means raw archives are not persisted.
    examples:
      - true
      - false
    default: true
    type: "integer"
    data_engineering_meaning: |
      Implements an ephemeral landing zone model. In traditional data warehousing (ELT),
      raw files are stored permanently as WORM (Write Once Read Many) archives.
      However, for this pipeline, if disk space is critical and the source system (ENTSO-E)
      already acts as a permanent historical archive, we can purge raw files after
      they are committed to the transaction-safe Iceberg layer.
  write_properties:
    description: |
      Dictionary mapping of S3 Lakehouse and Iceberg table write configurations.
      Controls how files are compressed, formatted, and optimized when they are
      committed and appended to the Apache Iceberg Silver layer.
    type: "object"
    examples:
      - compression_codec: "zstd"
        compression_level: 3
        target_parquet_size_bytes: 268435456
    default:
      compression_codec: "zstd"
      compression_level: 3
      target_parquet_size_bytes: 268435456
    data_engineering_meaning: |
      ZSTD is the modern industry standard for columnar formats (Parquet). It provides
      compression rates similar to Gzip but is significantly faster during read/write operations.
      Level 3 is the recommended baseline. In the future, we propose an adaptive compaction tiering
      system (described in docs/proposals/0001-adaptive-iceberg-compression-tiering.md) to dynamically
      adjust these parameters for cold storage.
      The target_parquet_size_bytes defines the target size for output Parquet files (e.g. 268435456 bytes for 256 MB)
      which prevents the small files problem in Spark/Iceberg tables, optimizing read operations on cloud object stores.
  publication_overrides:
    description: |
      Per-publication overrides for Parquet write properties. Keys must exactly match
      the publication folder name as defined in entsoe_domains_classifier.yml (fms_name).
      Any field specified here takes precedence over the global write_properties defaults
      for that specific publication's Iceberg table.
    type: "object"
    examples:
      - OfferedTransferCapacitiesContinuousEvolution_11.1_r3:
          compression_codec: "zstd"
          compression_level: 21
    default: {}
    data_engineering_meaning: |
      Enables adaptive compression tiering per publication. Hot (frequently updated) datasets
      use low compression levels (fast write, moderate ratio). Cold (write-once, rarely read)
      historical archives use maximum compression levels to minimize long-term storage cost.
      Pattern: Write Once, Read Rarely → maximize compression level.
      Example: OfferedTransferCapacitiesContinuousEvolution_11.1_r3 accounts for ~80%
      of all PROD files (~9.4 TB raw). ZSTD level 21 is justified here as data is written
      once during the initial historical backfill and rarely touched afterward.

