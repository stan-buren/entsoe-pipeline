# Centralized Schema Overrides Configuration
# This file defines global pattern overrides and endpoint-specific type definitions.
# Types should use standard PySpark type names (e.g. string, integer, timestamp, double, decimal(precision, scale))

global:
  # General string-based patterns
  "*_code": "string"
  "*_mrid": "string"
  "*_name": "string"
  "*_type": "string"
  "*_status": "string"
  "status": "string"
  "*direction": "string"
  "category": "string"
  "currency": "string"
  "time_zone": "string"
  "sequence": "integer"

  # Precision measurements mapped globally to prevent precision drift
  "actual_consumption": "decimal(18, 4)"
  "actual_generation_output": "decimal(18, 4)"
  "aggregated_installed_capacity": "decimal(18, 4)"
  "allocated_capacity": "decimal(18, 4)"
  "capacity": "decimal(18, 4)"
  "current_generation_forecast": "decimal(18, 4)"
  "day_ahead_capacity": "decimal(18, 4)"
  "day_ahead_generation_forecast": "decimal(18, 4)"
  "flow": "decimal(18, 4)"
  "forecast_transfer_capacity": "decimal(18, 4)"
  "installed_capacity(mw)": "decimal(18, 4)"
  "intraday_generation_forecast": "decimal(18, 4)"
  "maximum_load_forecast": "decimal(18, 4)"
  "minimum_load_forecast": "decimal(18, 4)"
  "net_position": "decimal(18, 4)"
  "requested_capacity": "decimal(18, 4)"
  "stored_energy[m_wh]": "decimal(18, 4)"
  "total_capacity": "decimal(18, 4)"
  "voltage_level(k_v)": "decimal(10, 2)"

endpoints:
  ActualTotalLoad_6.1.A_r3:
    total_load: "decimal(18, 4)"
  DayAheadTotalLoadForecast_6.1.B_r3:
    total_load: "decimal(18, 4)"
  UseOfTransferCapacity_12.1.A_r3:
    "capacity_price[_currency/m_wh]": "decimal(18, 4)"
