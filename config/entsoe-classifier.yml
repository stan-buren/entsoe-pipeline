# ENTSO-E FMS Active Folders Domain Classifier Configuration
# Specifies the domains order, fallback default domain, and priority classification patterns

domain_order:
  - Load
  - Generation
  - Transmission
  - Balancing
  - Market
  - Outages
  - Operations
  - OtherMarketInformation

fallback_domain: OtherMarketInformation

rules:
  # 1. Outages (takes precedence to avoid classification collisions)
  - domain: Outages
    patterns:
      - unavailability
      - outage

  # 2. Load
  - domain: Load
    patterns:
      - load
      - forecastmargin

  # 3. Generation
  - domain: Generation
    patterns:
      - generation
      - fillingrate
      - hydrostorage
      - productionandgeneration

  # 4. Balancing (with conditional redirection exclusions)
  - domain: Balancing
    patterns:
      - balancing
      - imbalance
      - nettedandexchanged
      - bidavailability
      - procuredbalancing
      - mfrr
      - afrr
    exclusions:
      - patterns:
          - marginalprice
          - activationoptimisation
        redirect_to: Operations

  # 5. Operations
  - domain: Operations
    patterns:
      - redispatching
      - countertrading
      - algorithm
      - methodology
      - methodologies
      - annualreport
      - criteriaapplication
      - sogl
      - fallback
      - elasticdemand
      - frequencycontainment
      - permanentallocation

  # 6. Market
  - domain: Market
    patterns:
      - auction
      - congestionmanagement
      - price
      - prices
      - dismantling

  # 7. Transmission (with conditional redirection exclusions)
  - domain: Transmission
    patterns:
      - transfercapacities
      - physicalflows
      - schedule
      - schedules
      - flowbased
      - implicitallocations
      - nominated
      - crossbordercapacity
      - transmissionassets
      - distributionfactors
      - useoftransfercapacity
    exclusions:
      - patterns:
          - generation
          - production
        redirect_to: Generation

  # 8. Special context checks for 'capacity' keyword
  - domain: Transmission
    patterns:
      - capacity
    exclusions:
      - patterns:
          - generation
          - production
        redirect_to: Generation

# 9. Legacy Publications Archives Specifications
legacy_rules:
  - archive: R3_Archives
    release_name: "Release 3 Archives (R3)"
    decommission_status: "Active Schema Deprecations (In-use but Schema Changed)"
    description: >
      Contains historical extracts of currently active data items that underwent
      critical structural changes in their schema, resolution, or definitions.
      New daily data continues to publish in 'TP_export' under active schemas,
      while old-structure historical publications are frozen here.
    patterns:
      - _r3

  - archive: R2_Archives
    release_name: "Release 2 Archives (R2)"
    decommission_status: "Fully Decommissioned on 2025-12-11"
    description: >
      Contains historical data for metrics that have been completely retired
      and replaced by newer specifications with fundamentally different methodologies
      (e.g., legacy single-file Redispatching replaced by separate Internal/CrossBorder files).
    patterns:
      - _r2

  - archive: R1_Archives_CSV_XML
    release_name: "Release 1 Archives (R1)"
    decommission_status: "Fully Decommissioned and Frozen on 2015-01-05"
    description: >
      The oldest historical data from the first generation of the ENTSO-E platform.
      All data items are strictly frozen and duplicate-published in both CSV and XML
      formats for backward compatibility.
    patterns:
      - _r1
      - _R1
      - Csv
      - Xml

