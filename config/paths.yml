# ENTSO-E Metadata Pipeline Path Configurations
# This file is the Single Source of Truth (SSOT) for all workspace paths.
# All path values are declared relative to the PROJECT_ROOT directory.

# =============================================================================
# 1. CORE SYSTEM DIRECTORIES
# =============================================================================
SRC_DIR: "src"
TESTS_DIR: "tests"
DATA_DIR: ".data"
MANUAL_DATA_DIR: ".data/manual_added_data"
ENV_FILE: ".env"

# =============================================================================
# 2. GLOBAL PIPELINE CONFIGURATIONS (YAML)
# =============================================================================
PATHS_YML: "config/paths.yml"
API_LIMITS_YML: "config/entsoe_api_limits.yml"
CLASSIFIER_YML: "config/entsoe_domains_classifier.yml"
LEGACY_CLASSIFIER_YML: "config/entsoe_legacy_classifier.yml"
SCHEMA_OVERRIDES_YML: "config/schema_overrides.yml"
LAKEHOUSE_PARQUET_CODEC_YML: "config/lakehouse_parquet_codec.yml"
FMS_EXTENSIONS_YML: "config/fms_extensions.yml"
DB_SCHEMA_YML: "config/entsoe_metadata_db_schema.yml"
FMS_CRAWLER_YML: "config/fms_crawler.yml"
ENTSOE_FMS_SCHEMAS_YML: "config/entsoe_fms_schemas.yml"

# =============================================================================
# 2A. PYTHON RUNNERS AND SCRIPTS
# =============================================================================
INIT_DB_SCHEMA_PY: "src/entsoe_pipeline/db/init_entsoe_metadata_db_schema.py"
OVERVIEW_INGEST_PY: "src/entsoe_pipeline/fms_metadata/ingestion/overview_ingest.py"
REFRESH_FMS_METADATA_PY: "jobs/refresh_fms_metadata.py"

# =============================================================================
# 3. ENVIRONMENT-SPECIFIC CONFIGURATIONS
# =============================================================================
CONFIG_DIR: "config_env"
CONFIG_EXAMPLE_DIR: "config_env_example"
MY_ENTSOE_DOMAINS_ENV_YML: "config_env/my_entsoe_domains.yml"
LAKEHOUSE_ENV_YML: "config_env/lakehouse.yml"

# =============================================================================
# 4. FMS REMOTE CRAWLER METADATA CATALOGS
# =============================================================================
FMS_METADATA_DIR: "fms_metadata"
FMS_CORE_DIR: "src/entsoe_pipeline/fms_metadata/core"
FMS_INGESTION_DIR: "src/entsoe_pipeline/fms_metadata/ingestion"
FMS_UTILS_DIR: "src/entsoe_pipeline/fms_metadata/utils"

OVERVIEW_YML: "fms_metadata/overview.yml"
EXPORT_LOG_YML: "fms_metadata/export_log.yml"
PHYSICAL_CATALOG_DIR: "fms_metadata/physical_catalog"
BUSINESS_CONTEXT_CATALOG_YML: "fms_metadata/business_context_catalog/entsoe_domains_overview_detailed.yml"
BUSINESS_CONTEXT_TEMPLATE_YML: "config/entsoe_domains_overview_detailed_template.yml"
SIZES_DIR: "fms_metadata/sizes"

# =============================================================================
# 4A. ACTIVE FMS METADATA CATALOGS (PRODUCTION RUNTIME)
# =============================================================================
ACTIVE_FMS_METADATA_DIR: ".data/fms_metadata"
ACTIVE_PHYSICAL_CATALOG_DIR: ".data/fms_metadata/physical_catalog"
ACTIVE_SIZES_DIR: ".data/fms_metadata/sizes"

# =============================================================================
# 5. DOMAINS INGESTION SCHEMAS & DICTIONARIES
# =============================================================================
ENTSOE_POPULAR_DOMAINS_YML: "config/entsoe_popular_domains.yml"
MY_ENTSOE_DOMAINS_DEFAULT_YML: "config/domains/my_entsoe_domains_default.yml"
MY_ENTSOE_DOMAINS_CUSTOM_YML: "config/domains/my_entsoe_domains_custom.yml"
MY_ENTSOE_DOMAINS_CUSTOM_EXTENDED_YML: "config/domains/my_entsoe_domains_custom_extended.yml"
MY_ENTSOE_DOMAINS_CUSTOM_DIR: "config/domains/custom"
MY_ENTSOE_DOMAINS_DEFAULT_TEMPLATE_YML: "config/domains/default/my_entsoe_default.yml"
MY_ENTSOE_DOMAINS_EXAMPLES_DIR: "config/domains/examples"

# =============================================================================
# 6. S3 LANDING & SILVER LAKEHOUSE REGISTRIES
# =============================================================================
LANDING_REGISTRY_YML: "config/landing_registry.yml"
ISEBERG_SCHEMAS_REGISTRY_JSON: ".data/iseberg_schemas_registry.json"
MY_ENTSOE_DOMAINS_YML: ".data/my_entsoe_domains.yml"

# =============================================================================
# 7. DOCUMENTATION, ADRS & PROPOSALS
# =============================================================================
DOCS_DIR: "docs"
REPORTS_DIR: "docs/reports"
FMS_REPORT_PATH: "docs/reports/fms_metadata_report.md"

ADR_DIR: "docs/adr"
ADR_TEMPLATE_PATH: "docs/adr/template/ADR_TEMPLATE.md"

PROPOSALS_DIR: "docs/proposals"
PROPOSAL_TEMPLATE_PATH: "docs/proposals/template/PROPOSAL_TEMPLATE.md"
