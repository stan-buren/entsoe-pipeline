domains:
  Load:
    ActualTotalLoad_6.1.A_r3:
      title: "Actual Total Load"
      description: |
        Actual total load on the power system. According to the official methodology (Detailed Data Descriptions), 
        is calculated as the sum of electricity generated by all power plants connected to the main (TSO) and 
        distribution (DSO) networks, minus the net cross-border flows (exports/imports) and the energy consumed 
        by energy storage systems (e.g., pumped-storage hydro). The value is averaged over the market time unit (MTU).