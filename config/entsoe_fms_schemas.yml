    columns:
      - csv_name: DateTime(UTC)
        db_name: date_time_utc
        type: timestamp
        required: true
        format: dd/MM/yyyy HH:mm
        example: 01/02/2025 00:00:00
        description: Timestamp of the recorded value in UTC.
      - csv_name: ResolutionCode
        db_name: resolution_code
        type: string
        required: true
        example: PT15M
