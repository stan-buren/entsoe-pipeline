services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped

    ports:
      - "${MASTER_HTTP_PORT:-9333}:9333" # Master HTTP (Admin UI)
      - "${MASTER_GRPC_PORT:-19333}:19333" # Master gRPC
      - "${VOLUME_HTTP_PORT:-8080}:8080" # Volume Server HTTP
      - "${FILER_HTTP_PORT:-8888}:8888" # Filer HTTP
      - "${FILER_GRPC_PORT:-18888}:18888" # Filer gRPC
      - "${S3_COMPATIBLE_PORT:-8333}:8333" # S3 API Gateway
      - "${ICEBERG_CATALOG_PORT:-8181}:8181" # Built-in Iceberg REST Catalog

    environment:
      - S3_LANDING_BUCKET=${S3_LANDING_BUCKET}
      - S3_LAKEHOUSE_BUCKET=${S3_LAKEHOUSE_BUCKET}
      - S3_TABLE_BUCKET=${S3_TABLE_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

    volumes:
      - ${S3_COMPATIBLE_VOLUME:-/mnt/seaweed_data}:/data

  kestra_postgres:
    image: postgres:18 # LTS
    container_name: kestra_postgres
    restart: unless-stopped

    volumes:
      - kestra_postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:v1.3 # LTS
    container_name: kestra
    restart: unless-stopped
    pull_policy: always
    # TODO [ISSUE]: Run Kestra container as non-root user (UID 1000) once Docker socket permissions are configured.
    user: "root"
    command: server standalone --config /app/confs/kestra.yml

    ports:
      - "${KESTRA_WEB_PORT:-8082}:8080"
      - "${KESTRA_API_PORT:-8083}:8081"

    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./kestra.yml:/app/confs/kestra.yml:ro

    environment:
      - KESTRA_DB_PASSWORD
      - KESTRA_USER
      - KESTRA_PASS
      - KESTRA_URL=${KESTRA_URL:-http://localhost:8082/}
      - PROJECT_ROOT
      - ENV_PROJECT_ROOT=${PROJECT_ROOT}

    depends_on:
      kestra_postgres:
        condition: service_healthy

  entsoe_postgres:
    image: postgres:18
    container_name: entsoe_postgres
    restart: unless-stopped

    ports:
      - "${DATABASE_PORT:-5432}:5432"

    volumes:
      - entsoe_postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_DB: entsoe_metadata
      POSTGRES_USER: entsoe
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kestra_postgres_data:
    driver: local
  kestra_data:
    driver: local
  entsoe_postgres_data:
    driver: local
