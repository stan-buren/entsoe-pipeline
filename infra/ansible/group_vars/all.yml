# Public constants — safe to commit.
# Infrastructure values (IPs, hosts, ports, buckets, secrets) come from the
# Python SSOT at runtime via export_config.py. No duplication.

# --- Spark packages (public Maven coordinates) ---
spark_packages:
  - "org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0"
  - "org.apache.iceberg:iceberg-aws-bundle:1.11.0"
  - "org.apache.hadoop:hadoop-aws:3.4.2"

# --- Iceberg extensions (public API) ---
iceberg_extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
