      compliance: |
        The index `11.3` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators to publish cross-border capacity limits for DC links.
      suffix: r3
      physical_meaning: |
        The dataset represents the maximum allowed power transfer limit (`Limit[MW]`) in megawatts over a DC interconnector from an outgoing area to an incoming area for the intraday market timeframe.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_CrossBorderCapacityForDcLinksIntradayTransferLimits_11.3.csv`.
        time_resolution: |
          Depending on the specific interconnector and market rules, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * 7 days (`P7D`)
          * 1 month (`P1M`)
          * 1 year (`P1Y`)
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, the zone name `OutAreaDisplayName`, the geographic zone type `OutAreaTypeCode` (BZN, CTA), the country map code `OutAreaMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, the zone name `InAreaDisplayName`, the geographic zone type `InAreaTypeCode` (BZN, CTA), the country map code `InAreaMapCode`,
          the intraday capacity limit `Limit[MW]`,
          the unique `InstanceCode`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `CrossBorderCapacityForDcLinksIntradayTransferLimits_11.3_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain two possible values:
          * BZN (Bidding Zone) — limit applied to a trading zone border.
          * CTA (Control Area) — limit applied to the dispatcher's control area border.
        parsing_technical_challenges: |
          When processing this data to find the limit across a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is mandatory to avoid processing duplicate records.
          When querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          DC link capacities are largely dictated by the physical cable thermal limits or specific operational constraints, meaning values might remain static for long periods but can be abruptly reduced during planned or forced outages.
        anomalies:
          Gaps_and_Directionality: |
            Users must ensure they query or filter for both directions of the DC link (Out to In, and In to Out) as limits can be asymmetric. Missing intervals may occur if the DC link is completely out of operation or due to TSO reporting failures. Unlike DC ramping restrictions (which lack automated API/FMS support), these intraday transfer limits are actively published and accessible.



    FlowBasedAllocationsCongestionIncome_12.1.E_r3:
      title: "Flow-Based Allocations - Congestion Income [12.1.E]"
      oneliner: "Congestion income generated from flow-based capacity allocation for
        daily and intraday markets."
      description: |
        This dataset contains the congestion income (revenue) generated during the flow-based capacity allocation process.
        Congestion income arises when there is a price differential between bidding zones due to limited cross-zonal transmission capacity.
        It provides transparency on the financial revenues collected by Transmission System Operators (TSOs) from capacity allocation in flow-based coordinated regions.
      compliance: |
        The index `12.1.E` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of information regarding congestion income from capacity allocation.
      suffix: r3
      physical_meaning: |
        The dataset represents the financial revenue (`Revenue`) generated by capacity allocation on a specific border (from the outgoing area to the incoming area), measured in a specific `Currency` (e.g., EUR).
        It is categorized by the `ContractType` (Daily or Intraday) and reflects the economic value of the transmission bottleneck under the flow-based market coupling mechanism.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_FlowBasedAllocationsCongestionIncome_12.1.E.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the contract type `ContractType` (Intraday, Daily),
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, the zone name `OutAreaDisplayName`, the geographic zone type `OutAreaTypeCode` (BZN), the country map code `OutAreaMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, the zone name `InAreaDisplayName`, the geographic zone type `InAreaTypeCode` (BZN), the country map code `InAreaMapCode`,
          the revenue value `Revenue`, the `Currency` (as per ISO 4217),
          the unique `InstanceCode`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          A notable feature of `FlowBasedAllocationsCongestionIncome_12.1.E_r3` compared to other physical or commercial flow datasets is the absence of geographic duplication.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns strictly contain the value `BZN` (Bidding Zone).
          You do not need to filter out Country (CTY) or Control Area (CTA) duplicates when calculating total flow-based revenues for a border.
        parsing_technical_challenges: |
          When querying this dataset via the REST API, there is a strict query size limit restricted to a maximum of 100 documents per request (unlike Net Positions, which allow a one-year date range).
          Furthermore, the query response will always return data for a whole day (or a multiple of days, depending on the length of the requested time interval), even if you request just a few hours.
        data_quality_issues: |
          Congestion income data relies on the complex recalculations of flow-based domains and market coupling clearing.
          In case of market decoupling, fallbacks, or ex-post corrections of the clearing results, the revenues might be updated.
        anomalies:
          API_Limitations_and_Rounding: |
            Data engineers must account for the 100 documents limit when designing automated API extraction scripts for this dataset, meaning bulk historical data is much safer to download via the FMS (File Library) monthly CSV extracts than through the REST API.
            Additionally, the revenues must be carefully aggregated by `ContractType` (Intraday vs. Daily) to avoid summing different market timeframes together.


    FlowBasedCapacityAllocation_11.1.B_r3:
      title: "Flow-based Allocations [11.1.B]"
      oneliner: "Flow-based capacity allocation parameters defining the available
        cross-zonal capacities and constraints."
      description: |
        This dataset provides the flow-based parameters used for capacity allocation in regions applying the flow-based market coupling approach (such as the Core and Nordic Capacity Calculation Regions).
        It defines the physical limits of the grid and how commercial exchanges impact critical network elements under different contingency scenarios. This data is essential for understanding the boundaries of the day-ahead and intraday market dispatch, ensuring operational security while maximizing market welfare.
      compliance: |
        The index `11.1.B` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of flow-based parameters for capacity allocation.
      suffix: r3
      physical_meaning: |
        The dataset details the capacity constraints of the transmission grid, specifically the Critical Network Elements and Contingencies (CNECs).
        Key physical metrics include the Maximum Allowable Power Flow (`MaximumAllowablePowerFlow[MW]`), Remaining Available Margin (`RemainingAvailableMargin[MW]`), Flow Reliability Margin (`FlowReliabilityMargin[MW]`), and Reference Flow (`ReferenceFlow[MW]`). Together, these metrics define the multi-dimensional flow-based domain available for electricity trading.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files using UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_FlowBasedCapacityAllocation_11.1.B.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          This dataset contains a massive set of columns detailing the constraints, including:
          `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`, `MarketTimeUnit(UTC)`,
          the region identifier `RegionCode`, `RegionDisplayName`, `RegionTypeCode` (REG), `RegionMapCode`,
          the time step `ResolutionCode`, the contract type `ContractType` (Day-ahead, Intraday),
          the `ConstraintID` and `ConstraintIsPreSolved` flag,
          various capacity and flow parameters such as `MaximumAllowablePowerFlow[MW]`, `RemainingAvailableMargin[MW]`, `FlowReliabilityMargin[MW]`,
          contingency asset details like `ContingencyAssetCode`, `ContingencyAssetType` (e.g., AC Link), and its connected zones `ContingencyAssetOutAreaTypeCode` (BZN),
          critical network element details like `CriticalNetworkElementCode` and its connected zones `CriticalNetworkElementOutAreaTypeCode` (BZN),
          and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike many other datasets, the primary geographic query relies on the `RegionCode` (with `RegionTypeCode` = `REG`, e.g., the Nordic region) rather than individual Country or Bidding Zone codes.
          The actual Bidding Zones are only referenced within the specific contingencies and critical network elements (`ContingencyAssetOutAreaTypeCode` = `BZN`).
          Another vital nuance is that an API query for this dataset returns results packed inside a ZIP file containing multiple XML files, rather than a single flat XML response.
        parsing_technical_challenges: |
          The sheer size and dimensionality of flow-based domains make this dataset extremely heavy (with potentially thousands of CNECs per market time unit).
          In the REST API, the query size limit is strictly 100 documents per request. Furthermore, the query response will always return data for a whole day (or a multiple of days), even if you request just a few hours.
          The capacity parameters depend heavily on the market timeframe, making it mandatory to filter by `ContractType` (Day-ahead vs. Intraday) to avoid mixing different allocation models.
        data_quality_issues: |
          The data relies on complex capacity calculation algorithms by regional Coordinated Capacity Calculators.
          Flow-based domains might occasionally contain very large or dummy limits (e.g., maximum allowable power flow set very high) if a constraint is structurally pre-solved or relaxed manually during the Remedial Action Optimization to ensure market feasibility.
        anomalies:
          API_Limitations_and_Empty_Fields: |
            Due to the complexity and volume of the data, processing this dataset requires significant computational resources. Users should heavily prefer monthly FMS CSV extracts over the REST API to avoid timeouts and pagination issues.
            Additionally, depending on the specific Capacity Calculation Region's methodology, many granular columns (e.g., `FlowWithoutCommercialExchanges[MW]` or `ExpectedFlowChangeDueToNonCostlyRemedialActions[MW]`) might be left completely empty or set to zero. Data engineers must build robust pipelines that do not fail on missing optional calculation components.



    ForecastedTransferCapacities_11.1_r3:
      title: "Forecasted Transfer Capacities [11.1]"
      oneliner: "Forecasted cross-zonal transfer capacities for various time horizons."
      description: |
        This dataset provides the forecasted cross-zonal transfer capacities between two geographical areas.
        It covers multiple forecasting horizons including Day-ahead, Week-ahead, Month-ahead, and Year-ahead.
        This data is essential for market participants and analysts to estimate the available transmission capacity
        across borders before explicit or implicit capacity allocations actually take place.
      compliance: |
        The index `11.1` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets,
        which obliges system operators (TSOs) to publish forecasted cross-zonal transfer capacities.
      suffix: r3
      physical_meaning: |
        The dataset represents the forecasted available capacity in megawatts (`ForecastTransferCapacity[MW]`)
        that can be used for commercial energy exchanges from an outgoing area to an incoming area,
        evaluated at different future prediction horizons (`ContractType`).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_ForecastedTransferCapacities_11.1.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country and the forecasting horizon,
          the time step (`ResolutionCode`) in the file may vary significantly:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * 1 day (`P1D`)
          * 1 month (`P1M`)
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, the zone name `OutAreaDisplayName`, the geographic zone type `OutAreaTypeCode` (BZN, CTA, CTY), the country map code `OutMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, the zone name `InAreaDisplayName`, the geographic zone type `InAreaTypeCode` (BZN, CTA, CTY), the country map code `InMapCode`,
          the forecasting horizon `ContractType` (Day-ahead, Week-ahead, Month-ahead, Year-ahead),
          the capacity value `ForecastTransferCapacity[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `ForecastedTransferCapacities_11.1_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * CTY (Country) — forecasted transfer capacity between countries.
          * BZN (Bidding Zone) — forecasted transfer capacity between trading zones.
          * CTA (Control Area) — forecasted transfer capacity between dispatchers' control areas.
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is mandatory.
          Furthermore, it is strictly required to filter by `ContractType` (e.g., 'Day-ahead' or 'Year-ahead') to avoid mixing completely different forecasting horizons in the same calculation.
          Additionally, when querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Forecasted capacities are subject to heavy recalculations and updates depending on expected grid conditions, weather forecasts, and outage planning.
          Historically, users have complained about ambiguous methodologies for defining these values prior to actual market coupling.
        anomalies:
          Methodological_Ambiguity: |
            Independent data quality reviews by market participants have highlighted that the definition of "Forecasted Day-ahead Transfer Capacities" (11.1.A) often refers to absolute minimum capacities in a certain timeframe.
            Some users find this specific definition inadequate and not particularly useful when trying to estimate true spot market outcomes or actual available capacity for trading.


    ImplicitAllocationsCongestionIncome_12.1.E_r3:
      title: "Implicit Allocations - Congestion Income [12.1.E]"
      oneliner: "Congestion income generated from implicit capacity allocation for
        daily and intraday markets."
      description: |
        This dataset contains the congestion income (revenue) generated during the implicit cross-zonal capacity allocation process (market coupling).
        Congestion income arises when there is a price differential between adjacent areas (such as Bidding Zones or Control Areas) due to limited transmission capacity during implicit market coupling. It provides transparency on the financial revenues collected by Transmission System Operators (TSOs) from the capacity allocation.
      compliance: |
        The index `12.1.E` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of information regarding congestion income from capacity allocation.
      suffix: r3
      physical_meaning: |
        The dataset represents the financial revenue (`Revenue`) generated by implicit capacity allocation mechanisms on a specific border (`BorderCode`), measured in a specific `Currency` (e.g., EUR).
        It reflects the economic value of the transmission bottleneck under implicit market coupling mechanisms, categorized by different market horizons such as the `ContractType` (Daily or Intraday).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder follow the standardized naming mask: `YYYY_MM_ImplicitAllocationsCongestionIncome_12.1.E.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file can vary significantly:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * Ranges up to daily (`P1D`), weekly (`P7D`), monthly (`P1M`), or yearly (`P1Y`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the contract type `ContractType` (e.g., Intraday, Daily),
          an optional `Sequence` number,
          the 16-digit EIC code of the border `BorderCode`, the border name `BorderDisplayName`, the border geographical type `BorderTypeCode` (BZN, CTA, BZA),
          the revenue value `Revenue`, the `Currency` (as per ISO 4217),
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike flow-based datasets or physical flows that use separated 'In' and 'Out' area columns, this dataset identifies the geography using a unified `BorderCode` and `BorderDisplayName`.
          The `BorderTypeCode` column contains three possible values:
          * BZN (Bidding Zone) — congestion income calculated between trading zones.
          * CTA (Control Area) — congestion income calculated between dispatchers' control areas.
          * BZA (Bidding Zone Aggregation) — congestion income calculated between aggregated zones.
        parsing_technical_challenges: |
          When calculating the total implicit congestion income, prior filtering by `BorderTypeCode` (e.g., `WHERE BorderTypeCode = 'BZN'`) is mandatory to avoid double or triple counting the same physical border represented under different geographical concepts.
          Furthermore, when querying this dataset via the REST API, the query size limit is strictly restricted to a maximum of 100 documents per request.
          Additionally, the API query response will always return data for a whole day (or a multiple of days, depending on the length of the requested time interval), even if you only requested a few hours.
        data_quality_issues: |
          Data accuracy relies on the results of the market coupling algorithms. In cases of market decoupling, fallbacks, or ex-post financial corrections, the previously published revenues might be updated by the operators.
        anomalies:
          API_Limitations_and_Contract_Types: |
            Due to the strict 100 documents limit on the REST API, data engineers are highly advised to use the bulk FMS (File Library) monthly CSV extracts for historical data ingestion instead of iterating through the API.
            Additionally, the revenues must be carefully grouped by `ContractType` (Intraday vs. Daily) to avoid summing overlapping but distinct market timeframes. Data engineers must also meticulously track the `UpdateTime(UTC)` to capture the most recent, accurate financial adjustments.


    ImplicitAllocationsNetPositions_12.1.E_r3:
      title: "Implicit Allocations - Net Positions [12.1.E]"
      oneliner: "Net positions resulting from implicit cross-zonal capacity allocation
        (market coupling)."
      description: |
        This dataset contains the net positions (import or export) resulting from implicit capacity allocation (market coupling) for a given geographical area.
        It reflects the commercial energy balance of a specific zone (such as a Bidding Zone or Control Area) established by the market clearing algorithms before physical delivery. This is a crucial metric for understanding market dynamics and the overall commercial position of a zone in the interconnected European network.
      compliance: |
        The index `12.1.E` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of net positions and congestion income from implicit capacity allocations.
      suffix: r3
      physical_meaning: |
        The dataset represents the netted commercial energy flow (`NetPosition[MW]`) for a specific area resulting from the market coupling process, along with its flow `Direction` (Import or Export).
        A net import position indicates that the area commercially buys more energy than it sells, whereas a net export indicates it sells more than it buys.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_ImplicitAllocationsNetPositions_12.1.E.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file can vary significantly:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * Macro horizons up to daily (`P1D`), weekly (`P7D`), monthly (`P1M`), quarterly (`P3M`), or yearly (`P1Y`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographic zone type `AreaTypeCode` (BZN, CTA),
          the country map code `MapCode`,
          the market horizon `ContractType` (Intraday, Daily, Total),
          the calculated value `NetPosition[MW]`,
          the `Direction` (Import, Export),
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `ImplicitAllocationsNetPositions_12.1.E_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * BZN (Bidding Zone) — net position calculated for a trading zone.
          * CTA (Control Area) — net position calculated for the dispatcher's control area.
        parsing_technical_challenges: |
          When aggregating or analysing the net positions, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'BZN'`) is mandatory to avoid artificially inflating values by double-counting the same geographic area.
          Additionally, you must filter by `ContractType` (e.g., 'Daily' vs 'Intraday' or 'Total') to avoid mixing different market horizons.
          When querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Net positions are the direct financial/commercial output of the market coupling algorithms (like EUPHEMIA). They reflect commercial schedules and not the actual physical flows of electricity.
        anomalies:
          Market_Updates_and_Decoupling: |
            In cases of market decoupling, fallbacks, or ex-post corrections of the clearing results, the net positions might be delayed or subsequently updated by the operators.
            Data engineers must carefully track the `UpdateTime(UTC)` to ensure they capture the latest, most accurate market clearing results.


    OfferedTransferCapacitiesContinuousEvolution_11.1_r3:
      title: "Offered Transfer Capacities Continuous Evolution [11.1]"
      oneliner: "Daily data detailing the evolution of offered cross-zonal transfer
        capacities for continuous intraday allocation."
      description: |
        This dataset tracks the continuous evolution of offered cross-zonal transfer capacities for the intraday market timeframe. Unlike static capacity datasets, it captures how the available transfer capacity between two geographical areas changes over time due to ongoing continuous intraday trading and capacity recalculations. It provides a highly granular view into the intraday market's liquidity and physical transmission boundaries.
      compliance: |
        The index `11.1` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish offered cross-zonal transfer capacities.
      suffix: r3
      physical_meaning: |
        The dataset represents the available cross-zonal transfer capacity in megawatts (`Capacity[MW]`) for a specific Market Time Unit (`MTU(UTC)`) on a specific border, flowing from the outgoing area to the incoming area. Crucially, it records the exact moment these capacity values evolve or are updated (`EvolutionDateTime(UTC)`) during the continuous intraday trading phase.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as daily extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          An important exception to the standardized naming convention applies to this specific dataset: the data is further grouped by border.
          The filenames follow the mask: `YYYY_MM_DD_OutArea_InArea_OfferedTransferCapacitiesContinuousEvolution_11.1_r3.csv` (e.g., `2024_06_18_IT-CNORTH_IT-CSOUTH_OfferedTransferCapacitiesContinuousEvolution_11.1_r3.csv`).
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for `InstanceCode`, `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`, `MTU(UTC)`, the time step `ResolutionCode`, the `ContractType` (Intraday),
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA, BZA), `OutMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA, BZA), `InMapCode`,
          the capacity value `Capacity[MW]`, the exact time of the capacity change `EvolutionDateTime(UTC)`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike standard capacity files, this dataset relies heavily on the `EvolutionDateTime(UTC)` and `MTU(UTC)` columns. For a single Delivery Period or MTU, there will be multiple rows reflecting how the capacity evolved over the day.
          Furthermore, geographic duplication exists: the `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values (BZN for Bidding Zone, CTA for Control Area, and BZA for Bidding Zone Aggregation).
        parsing_technical_challenges: |
          When analyzing the data, prior filtering by `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is mandatory to avoid duplicating values.
          Data engineers must construct their ETL pipelines to handle the border-specific prefixes in the CSV file names, which deviates from the standard ENTSO-E monthly extract naming conventions.
          To find the final available capacity for a specific MTU, analysts must group the data by `MTU(UTC)` and filter by the maximum (latest) `EvolutionDateTime(UTC)`.
        data_quality_issues: |
          Due to the high volume of capacity updates during continuous intraday trading, these daily files can be exceptionally large. Tracking the true capacity evolution requires careful sorting, as out-of-order updates or technical adjustments by TSOs can generate rapid successions of `EvolutionDateTime` stamps.
        anomalies:
          File_Naming_and_Volume: |
            Because the data is generated daily and split by individual borders, automated scrapers must dynamically discover file names rather than relying on a static YYYY_MM prefix. Missing borders on specific days usually indicate that no intraday capacity changes occurred or that the interconnector was entirely unavailable for trading.


