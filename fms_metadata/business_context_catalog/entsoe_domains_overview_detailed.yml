            Because the data is generated daily and split by individual borders, automated scrapers must dynamically discover file names rather than relying on a static YYYY_MM prefix. Missing borders on specific days usually indicate that no intraday capacity changes occurred or that the interconnector was entirely unavailable for trading.


    OfferedTransferCapacitiesContinuous_11.1_r3:
      title: "Offered Transfer Capacities Continuous [11.1]"
      oneliner: "Offered cross-zonal transfer capacities for continuous intraday market
        allocation."
      description: |
        This dataset contains the offered cross-zonal transfer capacities specifically provided for the continuous intraday market timeframe. It reflects the available transmission capacity between two geographical areas that market participants can utilize for continuous intraday trading, after day-ahead and other prior explicit/implicit allocations have been resolved.
      compliance: |
        The index `11.1` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators to publish offered cross-zonal transfer capacities.
      suffix: r3
      physical_meaning: |
        The dataset represents the available cross-zonal transfer capacity in megawatts (`Capacity[MW]`) for a specific Market Time Unit (`MTU(UTC)`) on a specific border, flowing from the outgoing area to the incoming area during the continuous intraday timeframe.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_OfferedTransferCapacitiesContinuous_11.1.csv`.
        time_resolution: |
          Depending on the specific market rules and interconnectors, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for `InstanceCode`, `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`, `MTU(UTC)`, the time step `ResolutionCode`, the `ContractType` (Intraday).
          It also includes the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA, BZA), `OutMapCode`.
          Similarly, it includes the 16-digit EIC code of the incoming zone `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA, BZA), `InMapCode`.
          Finally, it contains the capacity value `Capacity[MW]`, the exact time of the capacity change `EvolutionDateTime(UTC)`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `OfferedTransferCapacitiesContinuous_11.1_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * BZN (Bidding Zone)
          * CTA (Control Area)
          * BZA (Bidding Zone Aggregation).
          The `ContractType` strictly contains the value `Intraday`.
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is mandatory to avoid processing duplicate records.
          Unlike the 'Evolution' dataset (`OfferedTransferCapacitiesContinuousEvolution_11.1_r3`) which produces daily files grouped by border, this dataset provides consolidated monthly files for the continuous capacities.
          When querying via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Intraday capacities are subject to frequent adjustments as grid conditions change or following intraday capacity recalculation processes. Tracking these changes accurately requires observing the `EvolutionDateTime(UTC)` and `UpdateTime(UTC)` columns.
        anomalies:
          Differences_with_Evolution_Dataset: |
            Users should clearly distinguish this dataset from the `OfferedTransferCapacitiesContinuousEvolution_11.1_r3`. While the 'Continuous' dataset provides the standard monthly extracts of intraday capacities, the 'Evolution' dataset captures the highly granular, timestamped evolution of these capacities over the day and is uniquely split into daily, border-specific files. Data engineers must carefully use the `MTU(UTC)` column to identify the correct market time unit for the capacity value.



    OfferedTransferCapacitiesExplicit_11.1_r3:
      title: "Offered Transfer Capacities Explicit [11.1]"
      oneliner: "Offered cross-zonal transfer capacities for explicit market capacity
        allocation."
      description: |
        This dataset contains the offered cross-zonal transfer capacities specifically provided for explicit capacity allocation mechanisms.
        In explicit auctions, transmission capacity is auctioned and allocated separately from the electrical energy itself.
        The data covers various market time horizons (from intraday to yearly) and provides market participants with the limits of transmission capacity available for trading across specific borders.
      compliance: |
        The index `11.1` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish offered cross-zonal transfer capacities.
      suffix: r3
      physical_meaning: |
        The dataset represents the available cross-zonal transfer capacity in megawatts (`Capacity[MW]`) offered to the market for a specific timeframe (`ContractType`), flowing from the outgoing area to the incoming area.
        The capacities are further classified by delivery profile `Category` (e.g., Base, Peak, Off peak, Hourly).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_OfferedTransferCapacitiesExplicit_11.1.csv`.
        time_resolution: |
          Depending on the `ContractType` and specific market rules, the time step (`ResolutionCode`) in the file varies widely:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * 1 day (`P1D`)
          * 7 days (`P7D`)
          * 1 month (`P1M`)
          * 3 months (`P3M`)
          * 1 year (`P1Y`)
        required_columns: |
          The file contains columns for `InstanceCode`, the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`, the `ContractType` (Intraday, Daily, Weekly, Monthly, Yearly, Long term, Quarter-Yearly, Semestrial),
          the `Category` (Base, Hourly, Off peak, Peak), an optional `Sequence` number,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA, BZA), `OutMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA, BZA), `InMapCode`,
          the offered capacity value `Capacity[MW]`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `OfferedTransferCapacitiesExplicit_11.1_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * BZN (Bidding Zone) — offered capacity between trading zones.
          * CTA (Control Area) — offered capacity between dispatchers' control areas.
          * BZA (Bidding Zone Aggregation) — offered capacity between aggregated zones.
          Additionally, data is segmented by multiple `ContractType` and `Category` dimensions.
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is strictly mandatory to avoid double-counting.
          Furthermore, analytical queries must explicitly group or filter by `ContractType` (e.g., 'Daily' vs 'Yearly') and `Category` to avoid mixing different allocation horizons and load profiles.
          When querying this dataset via the REST API, the query size limit is severely restricted to a maximum of 100 documents per request.
        data_quality_issues: |
          Offered capacities are subject to revisions and updates depending on grid conditions, planned maintenance, and capacity recalculations. Values can be updated closer to the delivery time.
        anomalies:
          API_Limitations_and_Revisions: |
            Due to the strict 100 documents limit on the REST API for Offered Capacity (11.1.A), it is highly impractical to download large historical datasets via the API. Data engineers should heavily rely on the monthly CSV extracts from the File Library (FMS) for bulk ingestion.
            Additionally, users must carefully track the `UpdateTime(UTC)` to capture the most recent capacity values, as preliminary offered capacities might be revised by the operators before the actual explicit auction takes place.



    OfferedTransferCapacitiesImplicit_11.1_r3:
      title: "Offered Transfer Capacities Implicit [11.1]"
      oneliner: "Offered cross-zonal transfer capacities for implicit market capacity
        allocation."
      description: |
        This dataset contains the offered cross-zonal transfer capacities specifically provided for implicit capacity allocation mechanisms (market coupling).
        In implicit auctions, transmission capacity and electrical energy are allocated together by the market coupling algorithm.
        The data covers short-term market timeframes (Intraday and Daily) and provides market participants with the limits of transmission capacity available for trading across specific borders under implicit allocation rules.
      compliance: |
        The index `11.1` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish offered cross-zonal transfer capacities.
      suffix: r3
      physical_meaning: |
        The dataset represents the available cross-zonal transfer capacity in megawatts (`Capacity[MW]`) offered to the market for a specific timeframe (`ContractType`), flowing from the outgoing area to the incoming area for implicit market coupling.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_OfferedTransferCapacitiesImplicit_11.1.csv`.
        time_resolution: |
          Depending on the `ContractType` and specific market rules, the time step (`ResolutionCode`) in the file varies widely:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * Other macroscopic/microscopic steps such as `PT1M`, `P1D`, `P7D`, `P1M`, `P3M`, or `P1Y` may also appear depending on the data source.
        required_columns: |
          The file contains columns for `InstanceCode`, the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`, the `ContractType` (Intraday, Daily), an optional `Sequence` number,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA, BZA), `OutMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA, BZA), `InMapCode`,
          the offered capacity value `Capacity[MW]`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `OfferedTransferCapacitiesImplicit_11.1_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * BZN (Bidding Zone) — offered capacity between trading zones.
          * CTA (Control Area) — offered capacity between dispatchers' control areas.
          * BZA (Bidding Zone Aggregation) — offered capacity between aggregated zones.
          Additionally, data is segmented by `ContractType` dimensions (Intraday, Daily).
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is strictly mandatory to avoid double or triple counting.
          Furthermore, analytical queries must explicitly group or filter by `ContractType` (e.g., 'Daily' vs 'Intraday') to avoid mixing different allocation horizons.
          When querying this dataset via the REST API, the query response will always return data for a whole day (or a multiple of days), but the query size limit is severely restricted to a maximum of 100 documents per request.
        data_quality_issues: |
          Offered capacities are subject to revisions and updates depending on grid conditions, planned maintenance, and capacity recalculations. Values can be updated closer to the delivery time.
        anomalies:
          API_Limitations_and_Revisions: |
            Due to the strict 100 documents limit on the REST API for Offered Capacity (11.1.A), it is highly impractical to download large historical datasets via the API. Data engineers should heavily rely on the monthly CSV extracts from the File Library (FMS) for bulk ingestion.
            Additionally, users must carefully track the `UpdateTime(UTC)` to capture the most recent capacity values, as preliminary offered capacities might be revised by the operators before the actual implicit market coupling takes place.



    PhysicalFlows_12.1.G_r3:
      title: "Physical Flows [12.1.G]"
      oneliner: "Actual cross-border physical flows of electricity between different
        geographical areas."
      description: |
        This dataset contains the actual physical flows of active power between two geographical areas (such as Bidding Zones, Control Areas, or Countries).
        It reflects the real, measured physical transfer of electricity across tie lines, as opposed to the scheduled commercial exchanges.
      compliance: |
        The index `12.1.G` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of cross-border physical flows.
      suffix: r3
      physical_meaning: |
        The dataset represents the actual measured active power flow (`Flow[MW]`) in megawatts over interconnectors from an outgoing area to an incoming area, averaged over a specific market time unit.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files encoded in UTF-8.
          The files generally follow the standardized naming mask: `YYYY_MM_PhysicalFlows_12.1.G.csv`.
        time_resolution: |
          Depending on the specific border and national market rules, the time step (`ResolutionCode`) may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, the zone name `OutAreaDisplayName`, the geographic zone type `OutAreaTypeCode` (BZN, CTA, CTY), the country map code `OutAreaMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, the zone name `InAreaDisplayName`, the geographic zone type `InAreaTypeCode` (BZN, CTA, CTY), the country map code `InAreaMapCode`,
          the actual flow value `Flow[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `PhysicalFlows_12.1.G_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * CTY (Country) — physical flows between countries.
          * BZN (Bidding Zone) — physical flows between trading zones.
          * CTA (Control Area) — physical flows between dispatchers' control areas.
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is mandatory to avoid artificially inflating totals or processing duplicate records.
          When querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
          Additionally, the REST API exports data for only one direction (import or export) per request; to obtain the physical flow in the opposite direction, the `in_Domain` and `out_Domain` parameters must be swapped and sent in a new request.
        data_quality_issues: |
          Independent data quality reviews and user feedback indicate that cross-border physical flows (12.1.G) are often incomplete.
        anomalies:
          Gaps_and_Reporting_Exceptions: |
            Users frequently report missing intervals or complete gaps for certain borders in the physical flows dataset.
            Furthermore, while physical flows are generally reported for borders between neighbouring bidding zones and control areas, there are known exceptions where they are not reported at all, such as for intra-German control-area borders.



    TotalCapacityAlreadyAllocated_12.1.C_r3:
      title: "Total Capacity Already Allocated [12.1.C]"
      oneliner: "Information on the total cross-zonal transmission capacity that has
        already been allocated."
      description: |
        This dataset contains the total transmission capacity already allocated to market participants for a specific timeframe across a given bidding zone border or control area border. This information is crucial to determine how much capacity remains available for subsequent market allocation processes, representing what was already allocated in earlier timeframes like yearly or monthly auctions.
      compliance: |
        The index `12.1.C` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of total capacity already allocated.
      suffix: r3
      physical_meaning: |
        The dataset represents the volume of cross-zonal transmission capacity in megawatts (`Capacity[MW]`) that has already been allocated for energy exchanges from an outgoing area to an incoming area. These capacities are specified by delivery profile `Category` (e.g., Base, Peak) and `ContractType` (e.g., Yearly, Monthly).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library. Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding. The files generally follow the standardized naming mask: `YYYY_MM_TotalCapacityAlreadyAllocated_12.1.C.csv`.
        time_resolution: |
          Depending on the `ContractType` and specific market rules, the time step (`ResolutionCode`) in the file varies widely. It can range from short intervals like `PT1S`, `PT15M`, `PT30M`, and `PT60M` to macro horizons like `P1D`, `P7D`, `P1M`, `P3M`, or `P1Y`.
        required_columns: |
          The file contains columns for `InstanceCode`, the exact start time of the interval `DateTime(UTC)`, the time step `ResolutionCode`, the `ContractType` (Intraday, Daily, Weekly, Monthly, Yearly, Long term, Quarter-Yearly), and the `Category` (Base, Hourly, Off peak, Peak). It also includes the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA, BZA), and `OutAreaMapCode`. Similarly, it includes the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA, BZA), and `InAreaMapCode`. Finally, it contains the allocated value `Capacity[MW]`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `TotalCapacityAlreadyAllocated_12.1.C_r3` is that within a single CSV file, the data is duplicated for different geographic concepts. The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values: BZN (Bidding Zone), CTA (Control Area), and BZA (Bidding Zone Aggregation).
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is strictly mandatory to avoid double or triple counting duplicate geographical concepts. Furthermore, queries must explicitly group or filter by `ContractType` and `Category` to avoid mixing different allocation horizons and load profiles. When querying this dataset via the REST API, the query response will always return data for a whole day (or a multiple of days), even if only a few hours are requested. Additionally, the API query size limit is severely restricted to a maximum of 100 documents per request.
        data_quality_issues: |
          Allocated capacities depend on the results of prior explicit long-term auctions. Changes or resales in secondary markets might affect the final values before the day-ahead allocation.
        anomalies:
          API_Limitations_and_Whole_Day_Responses: |
            Due to the strict 100 documents limit on the REST API for Total Capacity Already Allocated (12.1.C), it is highly impractical to download large historical datasets via the API. Furthermore, because the API response for this specific dataset always returns data for a whole day or a multiple of days, pagination and specific hour extraction become complex. Data engineers should heavily rely the bulk FMS (File Library) monthly CSV extracts for historical data ingestion instead of iterating through the API.



    TotalCapacityNominated_12.1.B_r3:
