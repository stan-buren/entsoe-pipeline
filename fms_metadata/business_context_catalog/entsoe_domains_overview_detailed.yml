    Export_log_r3.csv:
      title: "Export Log [Export_log_r3.csv]"
      oneliner: "An inventory of the most recent creation or update times for each
        file available in the File Library."
      description: |
        Note: The provided official documentation specifically refers to the file as `Export_log_r3.csv` rather than `Export_oce_log_r3.csv`.
        This file acts as a central inventory and tracking log for the ENTSO-E Transparency Platform's File Library (FMS). Because the data in the File Library is typically refreshed every 60 minutes and only files containing newly added or updated data are regenerated, this log is provided to simplify the tracking process for market participants. It allows users and automated systems to easily identify which specific CSV data extracts have been recently generated or updated without having to check the modified timestamp of every single file manually.
      compliance: |
        This is an administrative and technical metadata file specific to the operation of the ENTSO-E Transparency Platform's File Management System (FMS), rather than a physical dataset mandated by a specific article of the EU Transparency Regulation No 543/2013.
      suffix: r3
      physical_meaning: |
        This item does not contain physical power system measurements or market telemetry. Instead, it provides technical metadata detailing the specific file names of the CSV extracts (e.g., `2021_06_ActualTotalLoad_6.1.A.csv`) and their corresponding latest creation or update timestamps within the `/TP_export/` directory.
      technical_specification:
        format_and_frequency_of_extracts: |
          The log is provided as a flat CSV file located at the path `/TP_export/Export_log_r3.csv` in the File Library. It is updated on an hourly basis alongside the regular data extraction processes.
        time_resolution: |
          Not applicable. This is not a continuous timeseries dataset but rather a point-in-time inventory log tracking file generation statuses.
        required_columns: |
          While the exact column schema is not fully detailed in the documentation, it fundamentally maps the specific File Library filenames to their most recent generation or update timestamps (e.g., showing that a specific file was last generated on "02 June 2021 at 10:03").
        parsing_key_feature: |
          The primary purpose of this file is to enable efficient "delta loading" for ETL (Extract, Transform, Load) pipelines. Instead of re-downloading all historical CSV files or iterating through folders to check individual file modification dates, a data pipeline can simply download and parse `Export_log_r3.csv` to determine exactly which files have changed since the last fetch.
        parsing_technical_challenges: |
          Data engineers should use this log as the trigger mechanism for their FMS download scripts. By comparing the timestamps in this log against the last successful run of their ingestion pipeline, they can selectively download only the updated files. This is highly recommended to avoid hitting the strict API rate limit of 100 requests per minute per user, which results in a 10-minute ban if exceeded.
        data_quality_issues: |
          Not applicable in the context of power system data quality. Its accuracy depends solely on the internal ENTSO-E file generation processes syncing correctly with the log.
        anomalies:
          Naming_Clarification: |
            The official ENTSO-E documentation specifically refers to this tracking file as `Export_log_r3.csv`. If `Export_oce_log_r3.csv` was expected, it may be a typo or an undocumented internal variation. All standard tracking of updated CSV files relies on the standard `Export_log_r3.csv`.
          Extraction_Pause_Windows: |
            Data engineers must account for the fact that the extraction process explicitly pauses during the 00:00 and 01:00 CET/CEST time slots. During these hours, the export log and corresponding data files will not show any updates, and pipelines should not expect new file generations.



    Export_oce_log_r3.csv:
      title: "Offered Capacity Evolution Export Log [Export_oce_log_r3.csv]"
      oneliner: "An inventory tracking log specifically for the highly granular Offered
        Transfer Capacities Continuous Evolution files."
      description: |
        While the official ENTSO-E documentation specifically references the general `/TP_export/Export_log_r3.csv`, `Export_oce_log_r3.csv` functions as a dedicated export log for the "Offered Transfer Capacities Continuous Evolution [11.1]" (OCE) datasets. Because OCE data files are the only extracts in the File Library that follow an exceptional naming convention (they are generated daily and grouped by specific borders, rather than by month or year), a separate log is used to track these high-frequency, border-specific file updates without overloading the main platform inventory.
      compliance: |
        This is an administrative and technical metadata file specific to the operation of the ENTSO-E Transparency Platform's File Management System (FMS). It facilitates efficient data extraction for continuous capacity updates under Article 11.1.
      suffix: r3
      physical_meaning: |
        This file does not contain physical power system measurements. Instead, it provides technical metadata mapping the specific file names of the continuous capacity evolution CSV extracts (e.g., `2024_06_18_IT-CNORTH_IT-CSOUTH_OfferedTransferCapacitiesContinuousEvolution_11.1_r3.csv`) to their exact latest creation or modification timestamps.
      technical_specification:
        format_and_frequency_of_extracts: |
          Provided as a flat CSV file in the File Library. The standard extraction process runs every 60 minutes, meaning this log is continuously updated to reflect the hourly refresh cycles of the File Library.
        time_resolution: |
          Not applicable. This is a point-in-time inventory log representing exact file generation timestamps rather than a continuous power market timeseries.
        required_columns: |
          Contains a mapping of the target extract filenames (specifically the border-by-border OCE files) to their corresponding `UpdateTime` (the exact timestamp when the file was last generated by the ENTSO-E platform).
        parsing_key_feature: |
          This log serves as the primary trigger mechanism for "delta loading" in automated ETL (Extract, Transform, Load) pipelines. By parsing this log first, systems can selectively download only the newly updated border-specific capacity evolution files instead of inefficiently re-downloading the entire directory.
        parsing_technical_challenges: |
          Data engineers must utilize this log to manage their API requests carefully. The File Library API has a strict rate limit of a maximum of 100 requests per minute per user. Reaching this limit results in a temporary 10-minute ban (HTTP 429 Error). Using the log minimizes unnecessary API calls.
        data_quality_issues: |
          Not applicable in the context of power system data quality (such as missing megawatts). Its accuracy depends solely on the internal ENTSO-E FMS syncing processes.
        anomalies:
          Exceptional_Naming_Convention: |
            Unlike standard full or monthly extracts, the files tracked by this log follow an exceptional naming mask: `YYYY_MM_DD_OutArea_InArea_OfferedTransferCapacitiesContinuousEvolution_11.1_r3.csv`.
          Extraction_Pause_Windows: |-
            The extraction process that updates the data files and this log explicitly pauses during the 00:00 and 01:00 CET/CEST time slots. Data pipelines should not expect any new file generations or log updates during these hours.











