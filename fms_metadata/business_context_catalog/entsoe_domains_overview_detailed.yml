domains:
  Load:
    ActualTotalLoad_6.1.A_r3:
      title: "Actual Total Load"
      oneliner: "Actual total load on the power system."
      description: |
        Actual total load on the power system. According to the official methodology (Detailed Data Descriptions),
        is calculated as the sum of electricity generated by all power plants connected to the main (TSO) and
        distribution (DSO) networks, minus the net cross-border flows (exports/imports) and the energy consumed
        by energy storage systems (e.g., pumped-storage hydro). The value is averaged over the market time unit (MTU).
      suffix: r3
      physical_meaning: |
        According to the official ENTSO-E methodology (Detailed Data Descriptions), **Actual Total Load**
        is calculated as the sum of electricity generated by all power plants connected to the main grid (TSO)
        and distribution networks (DSO), minus net cross-border flows (imports/exports), and minus energy
        consumed by storage systems (e.g., pumped-storage hydro during pumping). This value is always averaged
        over a specific market time unit (MTU).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the library are tab-delimited (not comma-separated) and use UTF-8 encoding.
          The files inside the folder have a standardized naming mask: `YYYY_MM_ActualTotalLoad_6.1.A.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country,
          the time step in the file may be
            - 15 minutes (`PT15M` — e.g., for Germany, Austria, Belgium),
            - 30 minutes (`PT30M` — e.g., for the UK and Ireland),
            - 60 minutes (`PT60M` — for most other countries).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the load value `TotalLoad[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          Important nuance of working with `ActualTotalLoad_6.1.A_r3` is that
          within one CSV-file, the same megawatts are duplicated for different geographical concepts.
          The `AreaTypeCode` column contains three possible values:
            - CTY (Country) — aggregation of load for the country as a whole.
            - BZN (Bidding Zone) — load for a trading zone (zone with a single spot price).
            - CTA (Control Area) — load for the dispatcher's control area.
        parsing_technical_challenges: |
          If you simply apply the `TotalLoad[MW]` column summation function without prior filtering by `AreaTypeCode`,
          the resulting consumption value will be artificially inflated by 2-3 times.
        data_quality_issues: |
          Actual load data is published on the platform based on the principle of operational telemetry:
            data must appear within one hour after the end of the operational period (H+1 delay).
        anomalies:
          Gaps: |
            The files regularly contain missing intervals (marked on the portal as `N/A`),
            especially during failures in the systems of national TSOs.
          Discrepancies_with_official_statistics: |
            If you compare the raw data of ENTSO-E with Eurostat statistics,
            the `TotalLoad` values on the platform are most often lower (sometimes the deviations exceed 10%).
              This is because Eurostat publishes verified historical data taking into account retrospective adjustments,
            while operational telemetry of TSO often overlooks part of the distributed generation at the low voltage level
            (for example, the generation of households).
          Local_methodological_distortions: |
            A striking example is Austria, where historical discrepancies amounted to about 20% because the
              Transparency Platform received load data only from the APG dispatcher's network (Control Area),
            which did not include the consumption of railways and large industrial enterprises with their own generation.

      compliance: |
        The i ndex `6.1.A` directly refers to the relevant article of EU Regulation No 543/2013 on transparency of electricity markets,
        which obliges system operators (TSOs) to publish this information.
    DayAheadTotalLoadForecast_6.1.B_r3:
      title: "Day-ahead Total Load Forecast"
      oneliner: "Short-term forecast of the total load on the power system for the
        next day."
      description: |
        Short-term forecast of the total load on the power system for the following day (Day-ahead).
        Unlike actual load which is published after consumption, this forecast is built a day before physical delivery (D-1).
        It is critically important for market participants (traders, generators) as it is used for preliminary spot market clearing,
        generation schedule planning, and assessing the system's need for balancing capacities for the upcoming day.
      compliance: |
        The index `6.1.B` directly refers to the relevant article of EU Regulation No 543/2013 on transparency of electricity markets,
        which obliges system operators (TSOs) to publish these short-term forecast data.
      suffix: r3
      physical_meaning: |
        This dataset represents the expected total load in megawatts (MW) on the power grid for the next operational day.
        The values are forecasted by national Transmission System Operators (TSOs) and are averaged over a specific
        market time unit (MTU).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the library are tab-delimited flat files and use UTF-8 encoding.
          The files inside the folder generally follow a standardized naming mask: `YYYY_MM_DayAheadTotalLoadForecast_6.1.B.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country, the time step (ResolutionCode) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographical zone type `AreaTypeCode` (BZN, CTA, CTY),
          the country map code `AreaMapCode`,
          the forecasted load value `TotalLoad[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `DayAheadTotalLoadForecast_6.1.B_r3` is that
          within one CSV-file, the forecasted megawatts are duplicated for different geographical concepts.
          The `AreaTypeCode` column contains three possible values:
          * CTY (Country) — aggregation of load forecast for the country as a whole.
          * BZN (Bidding Zone) — load forecast for a trading zone (zone with a single spot price).
          * CTA (Control Area) — load forecast for the dispatcher's control area.
        parsing_technical_challenges: |
          If you simply apply the `TotalLoad[MW]` column summation function without prior filtering by `AreaTypeCode`
          (e.g., `WHERE AreaTypeCode = 'CTY'`), the resulting consumption forecast value will be artificially inflated by 2-3 times.
        data_quality_issues: |
          Because these are forecast data generated by national operators, they are subject to historical anomalies, calculation errors,
          or submission mistakes prior to physical delivery.
        anomalies:
          Outliers_and_Errors: |
            Researchers and data engineers have repeatedly recorded errors in publications.
            A documented example is the forecast for the Netherlands: the `Day-ahead Total Load Forecast` (6.1.B)
            was historically published as 10 times higher than the `Actual Total Load` (6.1.A).
            Such outliers require mandatory implementation of data cleaning and validation algorithms on the consumer side
            before feeding them into analytical models.

    TotalLoadForecast_6.1.C_D_E_r3:
      title: "Total Load Forecast [6.1.C&D&E]"
      oneliner: "Long-term forecasts of the total load on the power system (week-ahead,
        month-ahead, and year-ahead)."
      description: |
        Long-term forecasts of the total load on the power system.
        It includes planning horizons such as Week-ahead (Article 6.1.C), Month-ahead (6.1.D), and Year-ahead (6.1.E).
        Unlike actual load or short-term day-ahead forecasts, this dataset provides the minimum and maximum expected load values to assess medium- and long-term system adequacy.
      compliance: |
        The indices 6.1.C, 6.1.D, and 6.1.E directly refer to the relevant articles of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish these long-term load forecasts.
      suffix: r3
      physical_meaning: |
        The dataset represents the expected minimum (`MinimumLoadForecast`) and maximum (`MaximumLoadForecast`) total load in megawatts (MW) for future long-term periods (weeks, months, years).
        The forecasts are generated by national Transmission System Operators (TSOs).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_TotalLoadForecast_6.1.C_D_E.csv`.
        time_resolution: |
          The time step (`ResolutionCode`) fundamentally differs from short-term load data and has a macroscopic character:
          * 1 day (`P1D`)
          * 7 days (`P7D`)
          * 1 month (`P1M`)
          * 3 months (`P3M`)
          * 1 year (`P1Y`)
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographical zone type `AreaTypeCode` (BZN, CTA, CTY),
          the country map code `AreaMapCode`,
          the contract type/horizon `ContractType` (Week-ahead, Month-ahead, Year-ahead),
          the forecasted values `MinimumLoadForecast[MW]` and `MaximumLoadForecast[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `TotalLoadForecast_6.1.C_D_E_r3` is that within one CSV file, the data is duplicated for different geographical concepts.
          The `AreaTypeCode` column contains three possible values:
          * CTY (Country) — aggregation of load forecast for the country as a whole.
          * BZN (Bidding Zone) — load forecast for a trading zone.
          * CTA (Control Area) — load forecast for the dispatcher's control area.
          A key difference from other load files is the presence of the `ContractType` column to separate forecasting horizons and the presence of TWO load columns (`Minimum` and `Maximum`) instead of a single `TotalLoad`.
        parsing_technical_challenges: |
          When performing calculations, prior filtering is mandatory not only by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'CTY'`) but also by `ContractType`.
          Without this, you will get artificially inflated values that sum up different geographical levels and forecasting horizons.
          Due to the coarse granularity (from days to years), this data cannot be directly joined with hourly actual values without complex resampling (upsampling) logic on the side of your DWH.
          When querying via the REST API, be aware that the query size limit is restricted to a one-year date range per request.
        data_quality_issues: |
          Long-term forecasting involves a high degree of uncertainty.
          In some cases, the minimum or maximum load fields may be empty (defined as `[0..1]` according to ENTSO-E specifications) depending on the technical and methodological capabilities of a specific TSO.
        anomalies:
          Outliers_and_Errors: |
            There are significant discrepancies in the methodologies for estimating minimum and maximum values over long-term horizons among different national TSOs.
            Users of the dataset should implement basic quality checks during parsing (for example, a script should verify that `MinimumLoadForecast` does not exceed `MaximumLoadForecast`, and safely handle NaN/Null values when fields are empty).

    YearAheadForecastMargin_8.1_r3:
      title: Year Ahead Forecast Margin [8.1]
      oneliner: Year-ahead forecast of the margin between available generation 
        capacity and expected demand.
      description: This dataset contains the year-ahead forecast of the margin 
        between the available generation capacity and the expected peak demand 
        on the power system.
      compliance: Article 8.1 of EU Regulation No 543/2013.
      suffix: r3
      physical_meaning: Represents the power system resource adequacy margin in 
        megawatts (MW) forecasted for the upcoming year.
      technical_specification:
        format_and_frequency_of_extracts: Provided as yearly extracts in the 
          File Library.
        time_resolution: One year (P1Y).
        required_columns: Year, AreaCode, AreaDisplayName, MapCode, Margin[MW], 
          UpdateTime(UTC)
        parsing_key_feature: Contains the forecasted margin value at a 
          macroscopic system level.
        parsing_technical_challenges: Data needs to be filtered by AreaTypeCode 
          to ensure correct geographical scoping.
        data_quality_issues: Subject to high forecast uncertainty and variations
          in TSO methodologies.
        anomalies:
          Methodological_Differences: |
            TSOs may apply different criteria for estimating available capacity and peak load.

    OperationalAgreementsOfLoadFrequencyControlBlocks_SOGL_184.3_r3:
      title: "Operational Agreements of Load Frequency Control Blocks [184.3]"
      oneliner: "Information and documents regarding the operational agreements for
        Load Frequency Control (LFC) blocks."
      description: |
        This data item publishes the operational agreements of Load Frequency Control (LFC) blocks. Rather than providing continuous numerical timeseries data, this section provides regulatory and operational transparency. It hosts or links to the official operational agreements established by Transmission System Operators (TSOs) operating within specific LFC blocks, detailing the rules, dimensioning of reserves, and coordinated actions required to maintain system frequency within the synchronous area.
      compliance: |
        The index `SO GL 184.3` refers to Article 184(3) of the System Operation Guideline (SO GL), which mandates the publication of the operational agreements established for each LFC block.
      suffix: r3
      physical_meaning: |
        This item does not contain quantitative physical telemetry or financial timeseries (such as megawatt volumes or EUR/MWh prices). Instead, it represents the structural, legal, and procedural documents governing how TSOs within a specific Load Frequency Control Block coordinate their frequency control mechanisms and reserve capacity management.
      technical_specification:
        format_and_frequency_of_extracts: |
          According to the official ENTSO-E Transparency Platform Help page, this specific data item is **not** available as a CSV extract in the File Management System (FMS) Library. Furthermore, it is **not** accessible via the RESTful API, nor does it have associated XML or XSD schemas. It is solely accessible via the web portal's knowledge base.
        time_resolution: |
          Not applicable. The content consists of static or semi-static regulatory and operational documents rather than continuous, granular timeseries data.
        required_columns: |
          Not applicable, as there are no flat files or CSV extracts provided for this data item.
        parsing_key_feature: |
          There are no structured data files to parse. Analysts and developers cannot use standard data extraction libraries (like `entsoe-py`) or standard HTTP GET/POST API requests to fetch quantitative data for this item.
        parsing_technical_challenges: |
          Because it entirely lacks REST API and FMS bulk download support, automated ETL (Extract, Transform, Load) pipelines cannot natively ingest this data. Any tracking of updates to the LFC block operational agreements would require custom web scraping of the ENTSO-E portal or manual monitoring of the relevant knowledge base links.
        data_quality_issues: |
          Data quality in this specific context relates purely to document management and version control—ensuring that the ENTSO-E platform provides working links to the most recently approved operational agreements between the respective TSOs.
        anomalies:
          No_Machine_Readable_Endpoints: |
            Similar to the `ApprovedMethodologies_12.3.J_r3` domain, this data item is exclusively document-based and entirely lacks machine-readable endpoints. Data engineering pipelines designed to programmatically loop through all known data item suffixes to download timeseries data will fail or return null responses if they attempt to query this specific identifier via the API or the FMS service.

  Generation:
    ActualGenerationOutputPerGenerationUnit_16.1.A_r3:
      title: "Actual Generation Output per Generation Unit [16.1.A]"
      oneliner: "Actual generation output in megawatts for individual generation units
        equal to or greater than 100 MW."
      description: |
        This dataset contains the actual generation output (and actual consumption, if applicable) for individual generation units.
        It provides unit-level telemetry rather than aggregated totals, which is crucial for detailed market analysis, tracking the dispatch of large individual power plants, and understanding unit-specific behaviors.
      compliance: |
        The index `16.1.A` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges primary owners (such as operators of power plants) to publish actual generation data for individual generators with an installed capacity equal to or greater than 100 MW.
      suffix: r3
      physical_meaning: |
        The dataset represents the physical generation output in megawatts (MW) produced by an individual generation unit (`ActualGenerationOutput[MW]`), and if applicable, the energy consumed by the unit (`ActualConsumption[MW]`, e.g., for pumped storage hydro plants during the pumping phase). The values are averaged over the specific market time unit (MTU).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_ActualGenerationOutputPerGenerationUnit_16.1.A.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographical zone type `AreaTypeCode` (BZN, CTA),
          the country map code `AreaMapCode`,
          the unit's unique EIC identifier `GenerationUnitCode`,
          the unit's name `GenerationUnitName`,
          the fuel/technology type `GenerationUnitType`,
          the actual values `ActualGenerationOutput[MW]` and `ActualConsumption[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike aggregated load or generation data, this dataset provides information at the specific generation unit level using the `GenerationUnitCode` (a 16-digit EIC code).
          However, geographical duplication still exists: the data might be published for different `AreaTypeCode` concepts simultaneously, typically Bidding Zone (`BZN`) and Control Area (`CTA`).
        parsing_technical_challenges: |
          When aggregating total generation from this dataset, you must filter by a single `AreaTypeCode` (e.g., `BZN`) to avoid double-counting.
          Additionally, because generation is only reported for large units meeting the 100 MW threshold, summing these values will NOT equal the country's total actual generation (which is instead reported in the aggregated `16.1.B&C` dataset).
        data_quality_issues: |
          As unit-level telemetry, this dataset is highly susceptible to missing data and delays. Some power plant operators fail to submit data on time. Furthermore, due to the 100 MW reporting threshold, a significant portion of distributed generation (like smaller wind and solar farms) is missing entirely from this dataset.
        anomalies:
          Gaps_and_Missing_Units: |
            The files regularly contain missing intervals (often marked as `N/A` or left blank). In many cases, generation data from certain countries or specific power plants (e.g., some German fossil gas plants) have been reported as missing.
            Wind and solar park operators often interpret the 100 MW threshold as applying to individual turbines or panels rather than the whole park, leading to massive data gaps for these renewable technologies in the unit-level dataset.

    AggregatedFillingRateOfWaterReservoirsAndHydroStoragePlants_16.1.D_r3:
      title: "Aggregate Filling Rate of Water Reservoirs and Hydro Storage Plants
        [16.1.D]"
      oneliner: "Weekly aggregated filling rate of water reservoirs and hydro storage
        plants in MWh."
      description: |
        This dataset contains information on the aggregated amount of energy
        stored in water reservoirs and hydro storage plants. The data provides
        a macroscopic view of hydro energy reserves, which is essential for
        assessing medium- and long-term power system adequacy, seasonal
        flexibility, and the availability of dispatchable hydro generation.
      compliance: |
        The index `16.1.D` directly refers to the relevant article of EU
        Regulation No 543/2013 on the transparency of electricity markets,
        which obliges system operators (TSOs) to publish this information
        regarding hydro energy reserves.
      suffix: r3
      physical_meaning: |
        The dataset represents the total stored energy in water reservoirs
        and hydro storage facilities, measured in Megawatt-hours (MWh)
        (`StoredEnergy[MWh]`). It reflects the potential electrical energy
        that can be generated from the currently stored water volume.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts.
          Despite the `.csv` extension, the files within the File Library
          are tab-delimited flat files (not comma-separated) and use UTF-8
          encoding.
          The files inside the folder generally follow the standardized naming
          mask for yearly extracts (which excludes months and days):
          `YYYY_AggregatedFillingRateOfWaterReservoirsAndHydroStoragePlants_16.1.D.csv`.
        time_resolution: |
          The time step (`ResolutionCode`) fundamentally differs from
          short-term operational data and has a macroscopic, weekly
          character:
          * 1 week (`P7D`).
          Instead of specific exact DateTime stamps for the start of the
          interval, the file utilizes `Year`, `Month`, and `Week` columns
          for time scoping.
        required_columns: |
          The file contains columns for `Year`, `Month`, `Week`, `TimeZone`
          (typically CET/CEST), the time step `ResolutionCode`, the 16-digit
          EIC code of the zone `AreaCode`, the zone name `AreaDisplayName`,
          the geographical zone type `AreaTypeCode` (BZN, CTA, CTY), the
          country map code `AreaMapCode`, the stored energy value
          `StoredEnergy[MWh]`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within
          one CSV file, the data is duplicated for different geographical
          concepts. The `AreaTypeCode` column contains three possible values:
          * CTY (Country) — aggregation of stored energy for the country
            as a whole.
          * BZN (Bidding Zone) — stored energy for a trading zone.
          * CTA (Control Area) — stored energy for the dispatcher's
            control area.
        parsing_technical_challenges: |
          When calculating the total stored energy across Europe or a
          specific region, prior filtering by `AreaTypeCode` (e.g., `WHERE
          AreaTypeCode = 'CTY'`) is mandatory to avoid artificial double or
          triple counting.
          Due to the weekly granularity (`P7D`) and the use of
          Year/Month/Week columns instead of a standard Timestamp, this
          data cannot be directly joined with hourly actual load or
          generation values without specific time-dimension mapping or
          upsampling logic on the side of your DWH.
          When querying via the REST API, be aware that the query size
          limit is restricted to a one-year date range per request.
        data_quality_issues: |
          Data relies on the aggregation of reservoir levels by TSOs or
          hydro plant operators. Because it covers weekly periods, slight
          reporting delays can occur.
        anomalies:
          Gaps_and_Reporting_Differences: |
            Certain zones might lack data completely if hydro storage with
            reservoirs is not a significant part of their energy mix, or
            if the installed capacity of the reservoirs falls below
            reporting thresholds. Users should implement logic in their
            ETL pipelines to handle missing intervals gracefully.

    AggregatedGenerationPerType_16.1.B_C_r3:
      title: "Aggregated Generation per Type [16.1.B&C]"
      oneliner: "Actual aggregated generation output per production type for specific
        geographical areas."
      description: |
        This dataset contains the actual aggregated generation output of power plants, categorized by production type (e.g., Nuclear, Fossil Gas, Wind Onshore, Solar, Hydro). It provides a macro-level view of the energy mix and actual production or consumption across European power systems. Unlike unit-level data, this dataset aggregates the generation of all units of the same technology type within a given geographical area.
      compliance: |
        The indices `16.1.B` and `16.1.C` refer to the respective articles of EU Regulation No 543/2013 on the transparency of electricity markets, mandating system operators to publish aggregated generation data by production type.
      suffix: r3
      physical_meaning: |
        The dataset represents the total physical generation output (`ActualGenerationOutput[MW]`) and, where applicable, the electricity consumed (`ActualConsumption[MW]`, e.g., for pumped hydro storage during the pumping phase) in megawatts (MW) for a specific production type. The values are averaged over the specific market time unit (MTU).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_AggregatedGenerationPerType_16.1.B_C.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographical zone type `AreaTypeCode` (BZN, CTA, CTY),
          the country map code `AreaMapCode`,
          the specific technology `ProductionType`,
          the actual values `ActualGenerationOutput[MW]` and `ActualConsumption[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `AggregatedGenerationPerType_16.1.B_C_r3` is that within one CSV file, the data is duplicated for different geographical concepts.
          The `AreaTypeCode` column contains three possible values:
          * CTY (Country) — aggregation of generation for the country as a whole.
          * BZN (Bidding Zone) — generation for a trading zone.
          * CTA (Control Area) — generation for the dispatcher's control area.
          The `ProductionType` column uses standardized text values (e.g., 'Biomass', 'Wind Offshore', 'Fossil Hard coal') to distinguish the energy source.
        parsing_technical_challenges: |
          When calculating the total generation for a country, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'CTY'`) is mandatory to avoid artificially inflating the sum by double or triple counting.
          Furthermore, users expect the total sum of this dataset to correspond with the "Actual Total Load" (6.1.A) minus "Scheduled Commercial Exchanges" (12.1.F), which often presents challenges due to differences in reporting methodologies across TSOs.
        data_quality_issues: |
          Historically, there are significant discrepancies between the Transparency Platform's aggregated generation data and official national statistics (like Eurostat or Destatis). For instance, generation from Fossil Gas and Hard Coal might be underreported on the platform.
          Additionally, the `Other` production type category is ambiguously used by some operators to group conventional generation (such as combined cycle gas turbines), reducing the analytical clarity of the dataset.
        anomalies:
          Gaps_and_Zero_Reporting: |
            The files regularly contain missing intervals (marked as `N/A`) or technical defaults.
            A highly critical anomaly type is "Fallback / Default zero reporting", famously illustrated by an incident involving the German TSO Amprion: due to technical failures, they temporarily lost the ability to collect solar generation data and published `0` MW for all daylight hours instead of leaving the fields empty.
            Such severe distortions require data engineers to implement machine learning imputation or anomaly detection algorithms before using the data in analytical models.


    DayAheadAggregatedGeneration_14.1.C_r3:
      title: "Day-Ahead Aggregated Generation [14.1.C]"
      oneliner: "Short-term forecast of the aggregated generation output for the next
        day."
      description: |
        Short-term (day-ahead) forecast of the aggregated generation output for a specific geographic area (such as a Bidding Zone, Control Area, or Country).
        This forecast is established before the physical delivery day (D-1) and helps market participants and system operators anticipate the total expected generation to effectively schedule resources and manage grid operations for the upcoming day.
      compliance: |
        The index `14.1.C` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish forecasted aggregated generation data.
      suffix: r3
      physical_meaning: |
        The dataset represents the expected total generation output (`GenerationForecast[MW]`) and, if applicable, the scheduled electricity consumption (`ScheduledConsumption[MW]`, e.g., for pumped hydro storage facilities during the pumping phase) in megawatts (MW).
        The forecasted values are averaged over a specific market time unit (MTU) for a given geographic area.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_DayAheadAggregatedGeneration_14.1.C.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographic zone type `AreaTypeCode` (BZN, CTA, CTY),
          the country map code `AreaMapCode`,
          the forecasted values `GenerationForecast[MW]` and `ScheduledConsumption[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `DayAheadAggregatedGeneration_14.1.C_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains three possible values:
          * CTY (Country) — aggregation of the generation forecast for the country as a whole.
          * BZN (Bidding Zone) — generation forecast for a trading zone.
          * CTA (Control Area) — generation forecast for the dispatcher's control area.
        parsing_technical_challenges: |
          When processing this data to calculate the total generation forecast for a country, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'CTY'`) is mandatory.
          Without this filter, the summation will result in artificially inflated values due to double or triple counting of the same geographic region.
          Additionally, when querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          As this dataset consists of day-ahead forecasts, the values are based on market schedules and operator predictions available at D-1. They will naturally deviate from the actual generation data published ex-post (16.1.B&C).
        anomalies:
          Gaps_and_Missing_Data: |
            The files may contain missing intervals (often marked as `N/A` or left blank) if a specific TSO fails to submit their generation forecast schedules before the required deadline or experiences technical issues during the data reporting process. Data pipelines should account for potential gaps and implement interpolation or default handling mechanisms.


    GenerationForecastsForWindAndSolar_14.1.D_r3:
      title: "Generation Forecasts for Wind and Solar [14.1.D]"
      oneliner: "Day-ahead, intraday, and current generation forecasts for wind and
        solar production types."
      description: |
        This dataset provides short-term generation forecasts for variable renewable energy sources, specifically wind and solar power. It includes different forecasting horizons such as day-ahead, intraday, and current generation forecasts. This information is critical for market participants and grid operators to anticipate renewable feed-in, schedule balancing resources, and optimize grid dispatch.
      compliance: |
        The index `14.1.D` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish wind and solar generation forecasts.
      suffix: r3
      physical_meaning: |
        The dataset represents the forecasted electrical power generation in megawatts (MW) from wind and solar resources. It provides three distinct forecast values per record: `DayAheadGenerationForecast[MW]`, `IntradayGenerationForecast[MW]`, and `CurrentGenerationForecast[MW]`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_GenerationForecastsForWindAndSolar_14.1.D.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographic zone type `AreaTypeCode` (BZN, CTA, CTY),
          the country map code `AreaMapCode`,
          the specific technology `ProductionType` (e.g., Wind onshore, Wind offshore, Solar),
          the forecasted values `DayAheadGenerationForecast[MW]`, `IntradayGenerationForecast[MW]`, and `CurrentGenerationForecast[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `GenerationForecastsForWindAndSolar_14.1.D_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains three possible values:
          * CTY (Country) — aggregation of the generation forecast for the country as a whole.
          * BZN (Bidding Zone) — generation forecast for a trading zone.
          * CTA (Control Area) — generation forecast for the dispatcher's control area.
        parsing_technical_challenges: |
          When calculating the total forecast for a country, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'CTY'`) is mandatory to avoid artificially inflating values by double or triple counting the same geographic area.
          Additionally, you must group or filter by `ProductionType` to correctly isolate solar or wind projections.
          When querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Forecasting variable renewables involves inherent uncertainty, and the dataset is known to have historical inconsistencies regarding data updates and versioning visibility.
        anomalies:
          Identical_to_Actuals_and_Overwriting: |
            Independent data quality reviews have found that in some historical cases, the values reported in "Day-ahead Generation Forecasts for Wind and Solar" (14.1.D) ended up being completely identical to the ex-post actual values reported in "Aggregated Generation per Type" (16.1.B&C).
            Furthermore, historically on the platform, day-ahead 18:00 forecast values were overwritten by intraday 8:00 forecasts and then possibly more recent forecasts without a clear indication of the update.
            Data engineers must carefully track the `UpdateTime(UTC)` to ensure they capture the true day-ahead prediction before retroactive overwriting occurs in the source systems.



    InstalledGenerationCapacityPerProductionUnit_14.1.B_r3:
      title: "Installed Generation Capacity per Unit [14.1.B]"
      oneliner: "Yearly data on the installed generation capacity for individual production
        units (≥ 100 MW)."
      description: |
        This dataset contains master data about the installed generation capacity of individual production units (power plants or storage facilities).
        It provides detailed structural and infrastructural data, including the unit's technology type, geographical location, voltage level of connection, and its operational status.
        This dataset is essential for tracking the physical infrastructure of the grid, monitoring the commissioning of new renewable or conventional projects, and understanding the generation fleet's composition at a highly granular level.
      compliance: |
        The index `14.1.B` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets.
        Primary data owners (such as operators of power plants) are obliged to report this master data for production units with an installed capacity equal to or greater than 100 MW.
      suffix: r3
      physical_meaning: |
        The dataset represents the physical characteristics of a production unit, primarily its maximum active power generation capability `InstalledCapacity(MW)` and grid connection `VoltageLevel(kV)`.
        The validity of this capacity is defined by a lifecycle timeframe (`ValidFrom` and `ValidTo`), tracking the unit through different project phases.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask for yearly extracts (excluding months and days): `YYYY_InstalledGenerationCapacityPerProductionUnit_14.1.B.csv`.
        time_resolution: |
          Unlike operational telemetry datasets, this master data does not use a standard step-based `ResolutionCode` (like `PT15M`).
          Instead, it uses specific `ValidFrom` and `ValidTo` DateTime stamps to indicate the exact period during which the reported installed capacity and status are valid.
        required_columns: |
          The file contains the unit's 16-digit EIC identifier `ProductionUnitCode`, the unit's name `ProductionUnitName`,
          the lifecycle validity period `ValidFrom` and `ValidTo`, the project's `Status` (Commissioned, Decommissioned, Cancelled),
          the fuel/technology `ProductionType` (e.g., Wind Offshore), the `ProductionUnitLocation`,
          the `InstalledCapacity(MW)`, the 16-digit EIC zone `AreaCode`, the `AreaDisplayName`,
          the geographical zone type `AreaTypeCode` (BZN, CTA), the country map code `AreaMapCode`,
          the connection `VoltageLevel(kV)`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `InstalledGenerationCapacityPerProductionUnit_14.1.B_r3` is that within one CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * BZN (Bidding Zone) — capacity assigned to a trading zone.
          * CTA (Control Area) — capacity assigned to the dispatcher's control area.
          Also, instead of single generation units (e.g., one gas turbine), this dataset aggregates information to the "Production Unit" level (e.g., the entire power plant).
        parsing_technical_challenges: |
          When calculating total installed capacity for a country based on this file, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'BZN'`) is mandatory to avoid double counting.
          Furthermore, querying the active capacity for a specific date requires temporal filtering logic that checks if the target date falls between `ValidFrom` and `ValidTo` (handling cases where `ValidTo` is empty/null for currently active units).
        data_quality_issues: |
          Historically, there has been a lack of standardization among TSOs regarding the definition of a "production unit". The Detailed Data Descriptions vaguely define it as a facility made up of a single or an aggregation of generation units, leaving it open to interpretation whether the aggregation should be functional (units that operate independently) or spatial (units on the same premises).
        anomalies:
          Ambiguous_Status_and_Identifiers: |
            Independent data quality reviews have highlighted that it is often unclear at what exact point a generation plant is considered officially "installed" (e.g., during physical construction, trial phase, or fully commissioned), leading to interpretation discrepancies.
            Additionally, names and identifiers for power plants are sometimes ambiguous if strict EIC coding is not uniformly enforced by the local operators, requiring data engineers to implement robust deduplication strategies.



    ProductionAndGenerationUnits_r3:
      title: "Production and Generation Units"
      oneliner: "Master data containing detailed information and the hierarchy of
        production and generation units."
      description: |
        This dataset provides master data about the generation infrastructure across European power systems.
        It details the physical characteristics, location, and operational status of both Production Units (power plants)
        and their constituent Generation Units (individual generators or turbines).
        It serves as the foundational reference dictionary for interpreting operational telemetry data, such as actual generation output or outages.
      compliance: |
        While acting as master data, it supports the obligations under EU Regulation No 543/2013 on the transparency of electricity markets, providing necessary reference metadata for generation-related articles.
      suffix: r3
      physical_meaning: |
        The dataset maps the physical relationship between a parent Production Unit and its Generation Units.
        It represents the structural characteristics including the installed active power generation capacity (`ProductionUnitInstalledCapacity(MW)` and `GenerationUnitInstalledCapacity(MW)`),
        grid connection voltage (`ProductionUnitVoltage(kV)`), fuel and technology type, and the operational lifecycle status (Commissioned, Decommissioned, Cancelled).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as a full extract containing all available records, rather than periodic time scopes.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          Unlike operational data, full extracts do not contain date elements in their filenames. The expected filename is typically `ProductionAndGenerationUnits_r3.csv`.
        time_resolution: |
          As master data, this dataset does not use standard time steps (`ResolutionCode`).
          Instead, it relies on lifecycle timestamps `ValidFrom` and `ValidTo` to indicate the exact period during which the reported unit configuration and status are valid.
        required_columns: |
          The file contains `ValidFrom`, `ValidTo`,
          the unit identifiers `ProductionUnitCode` and `GenerationUnitCode`,
          the unit names `ProductionUnitName` and `GenerationUnitName`,
          the statuses `ProductionUnitStatus` and `GenerationUnitStatus`,
          the technology types `ProductionUnitType` and `GenerationUnitType`,
          the locations `ProductionUnitLocation` and `GenerationUnitLocation`,
          the installed capacities `ProductionUnitInstalledCapacity(MW)` and `GenerationUnitInstalledCapacity(MW)`,
          the connection voltage `ProductionUnitVoltage(kV)`,
          the 16-digit EIC zone code `AreaCode` and `AreaDisplayName`,
          the geographic zone type `AreaTypeCode` (BZN, CTA),
          the country map code `AreaMapCode`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * BZN (Bidding Zone) — unit assigned to a trading zone.
          * CTA (Control Area) — unit assigned to the dispatcher's control area.
          Furthermore, the dataset explicitly links the `GenerationUnitCode` to its parent `ProductionUnitCode` within the same row.
        parsing_technical_challenges: |
          When counting total units or aggregating capacities, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'BZN'`) is mandatory to avoid double counting.
          To query the active fleet for a specific date, temporal filtering must check if the target date falls between `ValidFrom` and `ValidTo`, while handling null or empty `ValidTo` values for currently active assets. Additionally, users must filter by `ProductionUnitStatus` or `GenerationUnitStatus` (e.g., 'Commissioned') to exclude decommissioned or cancelled projects.
        data_quality_issues: |
          Historically, there has been a lack of standardization among TSOs regarding the definition of a "production unit".
          The Detailed Data Descriptions vaguely define it as a facility for the generation of electricity made up of a single generation unit or of an aggregation of generation units.
        anomalies:
          Ambiguous_Definitions_and_Aggregation: |
            Independent data quality reviews have highlighted that it is often open to interpretation by TSOs whether the aggregation of generation units into a production unit should be functional (separating units that can be operated individually, e.g., applied in France and Spain) or spatial (combining them if they are located on the same premises, e.g., applied in Germany).
            Additionally, names and identifiers for power plants are sometimes ambiguous, requiring robust deduplication based strictly on EIC codes.


    InstalledGenerationCapacityAggregated_14.1.A_r3:
      title: Installed Generation Capacity Aggregated [14.1.A]
      oneliner: Aggregated installed generation capacity by production type.
      description: This dataset provides the aggregated installed generation 
        capacity in megawatts (MW) for all generation units, classified by 
        production type (e.g. Wind, Solar, Gas, Coal, Nuclear).
      compliance: Article 14.1.A of EU Regulation No 543/2013.
      suffix: r3
      physical_meaning: Represents the total net generating capacity of all 
        power plants connected to the transmission or distribution grids.
      technical_specification:
        format_and_frequency_of_extracts: Provided as yearly extracts in the 
          File Library.
        time_resolution: Yearly timeframe.
        required_columns: Year, AreaCode, AreaDisplayName, ProductionType, 
          InstalledCapacity[MW]
        parsing_key_feature: Data is aggregated per fuel/technology type rather 
          than individual units.
        parsing_technical_challenges: Ensure to filter by AreaTypeCode to avoid 
          double counting country and control area levels.
        data_quality_issues: Delays in TSOs updating installed capacity figures 
          following unit retirements or new additions.
        anomalies:
          Delayed_Updates: Retirements and new grid connections may not be 
            immediately reflected.
  Transmission:
    CommercialSchedulesNetPositions_12.1.F_r3:
      title: "Commercial Schedules - Net Positions [12.1.F]"
      oneliner: "Day-ahead and total commercial schedules net positions for specific
        geographical areas."
      description: |
        This dataset contains the commercial schedules net positions for a given geographical area.
        It provides the aggregated netted commercial exchanges (import or export) resulting from day-ahead and total market timeframes.
        This is crucial for understanding the market-driven energy balance of a specific zone before physical delivery and physical flows actually occur.
      compliance: |
        The index `12.1.F` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish scheduled commercial exchanges.
      suffix: r3
      physical_meaning: |
        The dataset represents the netted scheduled commercial energy flows (Net Position) in megawatts (MW) for a specific area.
        It explicitly distinguishes between the day-ahead timeframe (`DayAheadCapacity[MW]`) and the total timeframe (`TotalCapacity[MW]`), along with their respective flow directions (`DayAheadSchedulesDirection` and `TotalSchedulesDirection`, i.e., Export or Import).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_CommercialSchedulesNetPositions_12.1.F.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`,
          the zone name `AreaDisplayName`,
          the geographic zone type `AreaTypeCode` (BZN, CTA, CTY),
          the country map code `MapCode`,
          the values `DayAheadCapacity[MW]` and `DayAheadSchedulesDirection`,
          the values `TotalCapacity[MW]` and `TotalSchedulesDirection`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `CommercialSchedulesNetPositions_12.1.F_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains three possible values:
          * CTY (Country) — aggregation of the net position for the country as a whole.
          * BZN (Bidding Zone) — net position for a trading zone.
          * CTA (Control Area) — net position for the dispatcher's control area.
        parsing_technical_challenges: |
          When processing this data to calculate the net positions for a specific country, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'CTY'`) is mandatory.
          Without this filter, analytical functions will process duplicate records, leading to artificially inflated totals.
          Additionally, when querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Users and independent data quality reviews have historically highlighted issues regarding the versioning and stability of this data.
          Specifically, there is a risk that day-ahead Scheduled Commercial Exchanges (12.1.F) might be overwritten by intraday or newer schedule values without a clear indication of the revision in the Transparency Platform.
        anomalies:
          Overwritten_Schedules: |
            The most prevalent concern recorded by the ENTSO-E Transparency User Group (ETUG) is that day-ahead “Scheduled Commercial Exchanges” (12.1.F) are not reliably available as they are sometimes overwritten.
            Data engineers must carefully track the `UpdateTime(UTC)` to ensure they capture the true day-ahead schedules. If data is pulled retroactively well after the delivery day, the original day-ahead values might have been overwritten by later intraday adjustments, reducing the reliability of the dataset for strict day-ahead market analysis.


    CommercialSchedules_12.1.F_r3:
      title: "Commercial Schedules [12.1.F]"
      oneliner: "Scheduled commercial exchanges (day-ahead and total capacities) between
        specific geographical areas."
      description: |
        This dataset contains the scheduled commercial exchanges of electricity between two geographical areas (e.g., Bidding Zones, Control Areas, or Countries). It reflects the commercial market schedules (Day-Ahead and Total) agreed upon between market participants across borders, which dictate the planned commercial transfer of energy before physical delivery occurs.
      compliance: |
        The index `12.1.F` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators (TSOs) to publish scheduled commercial exchanges.
      suffix: r3
      physical_meaning: |
        The dataset represents the scheduled commercial capacity flows in megawatts (MW) from an outgoing area to an incoming area. It explicitly provides two capacity values per record: `DayAheadCapacity[MW]` and `TotalCapacity[MW]`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_CommercialSchedules_12.1.F.csv`.
        time_resolution: |
          Depending on the national market rules of a specific country and contract types, the time step (`ResolutionCode`) in the file can vary widely, including:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * Up to daily (`P1D`), weekly (`P7D`), monthly (`P1M`), or yearly (`P1Y`).
        required_columns: |
          The file contains columns with the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, the zone name `OutAreaDisplayName`, the geographic zone type `OutAreaTypeCode` (BZN, CTA, CTY), the country map code `OutMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, the zone name `InAreaDisplayName`, the geographic zone type `InAreaTypeCode` (BZN, CTA, CTY), the country map code `InMapCode`,
          the scheduled values `DayAheadCapacity[MW]` and `TotalCapacity[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `CommercialSchedules_12.1.F_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * CTY (Country) — scheduled exchange between countries.
          * BZN (Bidding Zone) — scheduled exchange between trading zones.
          * CTA (Control Area) — scheduled exchange between dispatchers' control areas.
        parsing_technical_challenges: |
          When processing this data to calculate the total exchanges across a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'CTY' AND InAreaTypeCode = 'CTY'`) is mandatory. Without this filter, analytical functions will process duplicate records, leading to artificially inflated totals.
          Additionally, when querying this dataset via the REST API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Users and independent data quality reviews have historically highlighted issues regarding the versioning and stability of the day-ahead commercial schedules.
        anomalies:
          Overwritten_Schedules: |
            The most prevalent concern recorded by the ENTSO-E Transparency User Group (ETUG) is that day-ahead “Scheduled Commercial Exchanges” (12.1.F) are not reliably available as they are sometimes overwritten. Day-ahead values are overwritten by intraday or newer schedule values without a clear indication of the revision. Data engineers must carefully track the `UpdateTime(UTC)` to ensure they capture the true day-ahead schedules before retroactive overwriting occurs in the source systems.


    CrossBorderCapacityForDCLinksRampingRestrictions_11.3_r3:
      title: "Cross-border Capacity for DC Links [11.3] (Ramping Restrictions)"
      oneliner: "Information regarding ramping restrictions for High-Voltage Direct
        Current (HVDC) links."
      description: |
        This data item provides information on the ramping restrictions for Direct Current (DC) links between different geographic areas or bidding zones.
        It is critically important to note that, according to the official ENTSO-E Transparency Platform documentation, this specific data item is currently NOT available for bulk download via the File Library (FMS) or the RESTful API.
      compliance: |
        The index `11.3` refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of cross-border capacity limits and restrictions for DC links.
      suffix: r3
      physical_meaning: |
        Ramping restrictions dictate the maximum allowed rate (e.g., MW per minute) at which the active power flow over a DC link can be changed. This is a critical physical and operational constraint enforced by system operators to maintain frequency stability and overall operational security in the synchronously connected AC grids on both ends of the DC link.
      technical_specification:
        format_and_frequency_of_extracts: |
          Not applicable. According to the Transparency Platform Help Page (Overview of extracts), there is NO CSV extract provided in the File Library, nor is there a REST API endpoint available for "DC Ramping Restrictions" (marked explicitly as "-").
        time_resolution: |
          Not applicable, as the data is not distributed via standard programmatic channels.
        required_columns: |
          Not applicable.
        parsing_key_feature: |
          Unlike other DC-link datasets (such as `CrossBorderCapacityForDcLinksIntradayTransferLimits_11.3_r3` which does have an active extract), ramping restrictions cannot be parsed automatically via bulk CSV files or standard XML API responses.
        parsing_technical_challenges: |
          Because ENTSO-E does not provide FMS or REST API support for this specific metric, data engineers cannot build automated ETL pipelines to fetch this data. Users must rely on the graphical user interface (GUI) or other manual data collection methods if the information is occasionally published on the portal.
        data_quality_issues: |
          The primary issue is the complete lack of programmatic accessibility. The data availability is highly restricted compared to other operational telemetry metrics on the platform.
        anomalies:
          Unavailable_via_API_and_FMS: |
            The official documentation explicitly lists "Cross-border Capacity for DC Links [11.3] (Ramping Restrictions)" with no FMS, REST API, XML, or XSD support. If a data engineer or scraper attempts to query the assumed directory name (`CrossBorderCapacityForDCLinksRampingRestrictions_11.3_r3`) via the File Library, the server will return a 400 or 403/404 error ("The specified folder does not exist" or "File not found").


    CrossBorderCapacityForDcLinksIntradayTransferLimits_11.3_r3:
