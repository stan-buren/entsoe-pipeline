        The dataset describes the structural and operational characteristics of transmission assets.
        It includes the asset type (e.g., DC Link), geographic location, and operational lifecycle status (Commissioned, Decommissioned, Cancelled).
        It also details the organizations responsible for the asset and the electrical loss factor associated with it.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as a full extract containing all available records, rather than periodic time scopes.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          Unlike operational data, full extracts do not contain date elements in their filenames. The expected filename is typically `TransmissionAssets_r3.csv`.
        time_resolution: |
          As master data, this dataset does not use standard time steps like `ResolutionCode`.
          Instead, it relies on lifecycle timestamps `ValidFrom` and `ValidTo` to indicate the exact period during which the reported asset configuration and status are valid.
        required_columns: |
          The file contains `ValidFrom` and `ValidTo`,
          the identifier `AssetCode` and name `AssetName`,
          the status `AssetStatus` and type `AssetType` (e.g., DC Link),
          the geographic location `AssetLocation` and `LossFactor`,
          the 16-digit EIC zone code `AreaCode` and `AreaDisplayName`,
          the geographic zone type `AreaTypeCode` (e.g., CTA) and country map code `AreaMapCode`,
          the `OrganizationCode` and `OrganizationName` of the responsible entity,
          the `MarketInformationDataProviderCodes`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset represents assets mapped to specific areas, such as Control Areas (CTA).
          It serves as a reference dictionary where the `AssetCode` can be used to join with other operational datasets like unavailabilities or capacity limits.
        parsing_technical_challenges: |
          When querying the active fleet for a specific date, temporal filtering must check if the target date falls between `ValidFrom` and `ValidTo`, while handling null or empty `ValidTo` values for currently active assets.
          Additionally, users must filter by `AssetStatus` (e.g., 'Commissioned') to exclude decommissioned or cancelled projects.
        data_quality_issues: |
          Master data relies on timely updates by TSOs when new links are commissioned or decommissioned.
          Sometimes, new operational datasets might reference an asset code before the master data file is fully updated on the platform.
        anomalies:
          Focus_on_DC_Links: |
            While named "Transmission Assets", the platform currently heavily focuses this master dataset on DC Links (High-Voltage Direct Current interconnectors).
            Standard domestic AC grid elements are typically not exhaustively listed here, but rather identified dynamically within outage or flow-based datasets.



    TransmissionAssets_r3.1:
      title: "Transmission Assets"
      oneliner: "Master data containing detailed information and the lifecycle hierarchy
        of transmission assets, primarily DC Links."
      description: |
        This dataset provides the foundational master data regarding the transmission infrastructure across the European power system.
        It details the physical characteristics, location, and operational status of transmission assets, with a specific focus on Direct Current (DC) links and interconnectors.
        It serves as a critical reference dictionary (lookup table) for interpreting operational telemetry data, such as cross-border physical flows or transmission grid unavailabilities.
      compliance: |
        While serving as master data, it directly supports the publication obligations under EU Regulation No 543/2013 on the transparency of electricity markets. It provides the necessary reference metadata (such as EIC asset codes) required for transparency in transmission-related articles (e.g., outages, expansion projects, and capacity limits).
      suffix: r3.1
      physical_meaning: |
        The dataset maps a specific physical transmission asset (like a DC Link) with its unique identifier (`AssetCode`), its structural name (`AssetName`), and its operational lifecycle status (`AssetStatus` — e.g., Commissioned, Decommissioned, Cancelled). It also links the asset to its physical geographical route (`AssetLocation`), technical `LossFactor`, and the responsible system operator (`OrganizationName`).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as a "full extract" containing all available historical and active records, rather than periodic monthly time scopes.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          Unlike operational data, full extracts do not contain date elements in their filenames. The expected filename format downloaded from the FMS is typically `TransmissionAssets_r3.csv`.
        time_resolution: |
          As master data, this dataset does not use standard time steps (`ResolutionCode` like PT15M or PT60M).
          Instead, it relies on lifecycle timestamps `ValidFrom` and `ValidTo` to indicate the exact period during which the reported asset configuration and status are valid.
        required_columns: |
          The file contains the lifecycle boundaries `ValidFrom` and `ValidTo`,
          the asset identifiers `AssetCode` and `AssetName`,
          the operational status `AssetStatus`,
          the asset category `AssetType` (e.g., DC Link),
          the geographical route `AssetLocation`,
          the technical `LossFactor`,
          the 16-digit EIC zone code `AreaCode`, `AreaDisplayName`,
          the geographic zone type `AreaTypeCode` (e.g., CTA),
          the country map code `AreaMapCode`,
          the responsible operator's `OrganizationCode` and `OrganizationName`,
          the `MarketInformationDataProviderCodes`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is its reliance on EIC codes for physical assets (usually 'T' type EIC codes designated for Tie Lines, e.g., `22T201903146---W` for the ALEGrO DC Link). This dataset is essential for decoding the `AffectedAssetCode` or `InterconnectorCode` found in operational datasets.
        parsing_technical_challenges: |
          To query the active transmission assets for a specific date, temporal filtering must be applied in ETL pipelines to check if the target date falls between `ValidFrom` and `ValidTo`. Data engineers must specifically handle null or empty `ValidTo` values, which represent currently active, ongoing assets.
        data_quality_issues: |
          Master data relies entirely on Transmission System Operators (TSOs) keeping the central ENTSO-E registry consistently updated. Occasionally, new interconnectors might begin commercial operations before their master data is fully populated or correctly versioned in this specific extract.
        anomalies:
          EIC_Code_Synchronization: |
            A common challenge for data engineers is ensuring that the `AssetCode` in this dataset perfectly matches the `AffectedAssetCode` published in Urgent Market Messages (UMMs) for outages (e.g., 10.1.A and 10.1.B). Discrepancies or delays in updating this master data by the TSOs can lead to orphaned records when performing SQL JOIN operations between operational telemetry and this master dictionary.



    UseOfTransferCapacity_12.1.A_r3:
      title: "Use of Transfer Capacity [12.1.A]"
      oneliner: "Actual usage, requested capacity, and auction prices for cross-zonal
        capacity under explicit allocation mechanisms."
      description: |
        This dataset contains information regarding the use of transfer capacity under explicit capacity allocation.
        In explicit auctions, cross-zonal transmission capacity is auctioned and allocated to market participants separately from the electrical energy itself.
        This dataset provides transparency on market demand by showing how much capacity was requested, how much was actually allocated, and the clearing price for that capacity across various market timeframes (from Intraday to Yearly).
      compliance: |
        The index `12.1.A` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators to publish explicit allocation information, including capacity requested, allocated, and its price.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the explicit commercial market for transmission capacity.
        `RequestedCapacity[MW]` represents the total volume of capacity market participants bid for.
        `AllocatedCapacity[MW]` represents the cleared capacity successfully assigned to market participants, flowing from the outgoing area to the incoming area.
        `CapacityPrice[Currency/MWh]` reflects the marginal clearing price of the transmission bottleneck, measured in the specified `Currency` (e.g., EUR).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files inside the folder generally follow the standardized naming mask: `YYYY_MM_UseOfTransferCapacity_12.1.A.csv`.
        time_resolution: |
          Depending on the `ContractType` (allocation horizon) and specific market rules, the time step (`ResolutionCode`) in the file varies widely:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * Macro horizons up to daily (`P1D`), weekly (`P7D`), monthly (`P1M`), quarterly (`P3M`), or yearly (`P1Y`).
        required_columns: |
          The file contains columns for `InstanceCode`, the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`, the `ContractType` (Intraday, Daily, Weekly, Monthly, Yearly, Long term, Quarter-Yearly, Semestrial),
          the delivery profile `Category` (Base, Hourly, Off peak, Peak), an optional `Sequence` number,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA, BZA), `OutAreaMapCode`,
          the 16-digit EIC code of the incoming zone `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA, BZA), `InAreaMapCode`,
          the actual `AllocatedCapacity[MW]`, the `RequestedCapacity[MW]`, the `CapacityPrice[Currency/MWh]`, the `Currency` (as per ISO 4217),
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with `UseOfTransferCapacity_12.1.A_r3` is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * BZN (Bidding Zone) — explicit allocation between trading zones.
          * CTA (Control Area) — explicit allocation between dispatchers' control areas.
          * BZA (Bidding Zone Aggregation) — explicit allocation between aggregated zones.
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is strictly mandatory to avoid double or triple counting.
          Analytical queries must explicitly group or filter by `ContractType` (e.g., 'Daily' vs 'Yearly') and `Category` to avoid mixing different allocation horizons and load profiles.
          When querying this dataset via the REST API, the query response will always return data for a whole day (or a multiple of days), even if only a few hours are requested.
        data_quality_issues: |
          Values are highly dependent on explicit auction results. Data engineers must carefully track the `UpdateTime(UTC)` to capture the most recent values if corrections are issued by the capacity allocation offices (e.g., JAO).
        anomalies:
          API_Limitations_and_Whole_Day_Responses: |
            Due to the strict 100 documents limit on the REST API for Explicit Allocation Information (12.1.A), it is highly impractical to download large historical datasets via the API.
            Combined with the fact that the API forces a whole-day response boundary for this specific dataset, pagination and specific hour extraction become incredibly complex. Data engineers should heavily rely on the bulk FMS (File Library) monthly CSV extracts for historical data ingestion.


    PowerTransferDistributionFactors_11.1.B_r3:
      title: Power Transfer Distribution Factors [11.1.B]
      oneliner: Flow-based Power Transfer Distribution Factors (PTDFs) for 
        capacity allocation.
      description: This dataset contains the Power Transfer Distribution Factors
        (PTDFs) and Remaining Available Margin (RAM) parameters used in the 
        flow-based capacity allocation methodology.
      compliance: Article 11.1.B of EU Regulation No 543/2013.
      suffix: r3
      physical_meaning: PTDFs represent the sensitivity of physical flows on 
        critical network elements (CNECs) to commercial exchanges between 
        bidding zones.
      technical_specification:
        format_and_frequency_of_extracts: Provided as daily or monthly extracts 
          in the File Library.
        time_resolution: Market Time Unit (MTU) resolution.
        required_columns: DateTime(UTC), CNEC_Name, PTDF_Values, Margin
        parsing_key_feature: Core input to the flow-based market coupling 
          algorithm.
        parsing_technical_challenges: Extremely high volume of matrix-like 
          mathematical parameters.
        data_quality_issues: Highly complex mathematical representation that 
          requires specialized domain knowledge to validate.
        anomalies:
          High_Granularity_Volume: The large size of these datasets requires 
            efficient columnar storage to query.
  Balancing:
    AggregatedBalancingEnergyBids_12.3.E_r3:
      title: "Aggregated Balancing Energy Bids [12.3.E]"
      oneliner: "Aggregated offered, activated, and unavailable volumes of balancing
        energy bids."
      description: |
        This dataset contains the aggregated volumes of balancing energy bids, including offered, activated, and unavailable volumes for upward and downward regulation. It provides transparency on the balancing energy market and the utilization of different reserve types (e.g., aFRR, mFRR, RR) by system operators to maintain system frequency.
      compliance: |
        The index `12.3.E` refers to the relevant article of the Electricity Balancing Guideline (GL EB) Article 12(3)(e), which obliges system operators to publish information on aggregated balancing energy bids. This dataset officially replaces the legacy "Activated Balancing Energy [17.1.E]" publication from previous transparency frameworks.
      suffix: r3
      physical_meaning: |
        The dataset represents aggregated active power volumes in megawatts (MW) for specific balancing processes. It details what was offered to the market (`OfferedUpBidVolume[MW]`, `OfferedDownBidVolume[MW]`), what was actually activated by the system operator (`ActivatedUpBidVolume[MW]`, `ActivatedDownBidVolume[MW]`), and what became unavailable (`UnavailableUpBidVolume[MW]`, `UnavailableDownBidVolume[MW]`) during the market time unit.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          The files generally follow the standardized naming mask: `YYYY_MM_AggregatedBalancingEnergyBids_12.3.E.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          The file contains columns for the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`, the zone name `AreaDisplayName`, the geographic zone type `AreaTypeCode` (SCA, LFA), the country map code `MapCode`,
          the reserve type `ReserveType` (e.g., Automatic Frequency Restoration Reserve (aFRR), Manual Frequency Restoration Reserve (mFRR), Replacement Reserve (RR), etc.),
          the product type `TypeOfProduct` (Local, Specific, Standard),
          the bid volumes `OfferedUpBidVolume[MW]`, `OfferedDownBidVolume[MW]`, `ActivatedUpBidVolume[MW]`, `ActivatedDownBidVolume[MW]`, `UnavailableUpBidVolume[MW]`, `UnavailableDownBidVolume[MW]`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * SCA (Scheduling Area)
          * LFA (Load Frequency Control Area)
          Additionally, data is heavily dimensionalized by `ReserveType` and `TypeOfProduct`.
        parsing_technical_challenges: |
          When processing this data to analyze total balancing volumes for a specific country or zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is mandatory to avoid double counting duplicate geographical concepts.
          Furthermore, analytical queries must explicitly group or filter by `ReserveType` and `TypeOfProduct` to avoid erroneously summing distinct balancing services and product types together.
          When querying this dataset via the RESTful API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Balancing market data relies heavily on complex post-operational settlement processes. While operational telemetry is published relatively quickly, the data might undergo revisions as final settlement data is confirmed by the TSOs.
        anomalies:
          Empty_Fields_and_Nulls: |
            Depending on the specific market rules and the technical capabilities of the reporting TSO, certain volume columns (especially `UnavailableUpBidVolume[MW]` and `UnavailableDownBidVolume[MW]`) might be frequently empty or reported as zero if unavailable bids are not explicitly tracked or published in that specific balancing framework. Data pipelines must be built robustly to handle missing values in these optional numeric fields.



    AmountAndPricesPaidOfBalancingReservesUnderContract_17.1.B_C_r3:
      title: "Amounts and Prices Paid of Balancing Reserves Under Contract [17.1.B&C]"
      oneliner: "Volumes and prices of contracted balancing reserves like aFRR, mFRR,
        FCR, and RR."
      description: |
        This dataset details the procured volumes of balancing reserves and the corresponding prices paid under contract. It consolidates and officially replaces the legacy Transparency Platform publications for "Amount of Balancing Reserves Under Contract [17.1.B]" and "Prices of Procured Balancing Reserves [17.1.C]". This information is crucial for understanding the costs and capacities secured by Transmission System Operators (TSOs) in advance to maintain system frequency.
      compliance: |
        The index `17.1.B_C` directly refers to Articles 17.1.B and 17.1.C of the EU Regulation No 543/2013 on the transparency of electricity markets, which mandate the publication of the amount and prices of balancing reserves under contract.
      suffix: r3
      physical_meaning: |
        The dataset represents the active power `Volume(MW)` contracted for system balancing and the corresponding clearing `Price(MW/ISP)` paid to the Balancing Service Provider. The data is highly dimensionalized, specifying the direction of the reserve (Up, Down, Symmetric) and the source of the reserve (Generation, Load, Mixed).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library. Despite the `.csv` extension, the files are tab-delimited flat files using UTF-8 encoding. The files generally follow the standardized naming mask: `YYYY_MM_AmountAndPricesPaidOfBalancingReservesUnderContract_17.1.B_C.csv`.
        time_resolution: |
          Depending on the specific market rules and the `TimeHorizon`, the time step (`ResolutionCode`) in the file may vary extremely widely. It can range from short intervals like `PT15M`, `PT30M`, and `PT60M` up to macro horizons like `P1D`, `P7D`, `P1M`, `P3M`, or `P1Y`.
        required_columns: |
          The file contains a comprehensive set of columns including `InstanceCode`, `ContractedTimePeriodStart(UTC)`, `ContractedTimePeriodEnd(UTC)`, `ProcurementDateAndTime(UTC)`.
          It details the geography with the 16-digit EIC code `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (SCA), and `AreaMapCode`.
          It also specifies the `TimeHorizon` (e.g., Hourly, Daily, Yearly), `ReserveType` (aFRR, FCR, mFRR, RR), `TypeOfProduct` (Standard, Specific, Local, Integrated process), `ReserveSource`, and `Direction`.
          Finally, it includes the actual values for `ISP(UTC)`, `Volume(MW)`, `Price(MW/ISP)`, `Currency` (as per ISO 4217), `PriceType` (Average, Marginal), and `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset predominantly uses `AreaTypeCode` = 'SCA' (Scheduling Area) to define the geographic scope of the contracted reserves. A highly distinct feature is its multiple time dimensions: it distinguishes between the exact time the procurement auction happened (`ProcurementDateAndTime(UTC)`), the overarching validity period of the contract (`ContractedTimePeriodStart(UTC)` / `End`), and the actual Imbalance Settlement Period (`ISP(UTC)`) for delivery.
        parsing_technical_challenges: |
          When processing this data to analyze total contracted volumes or average prices, ETL queries must explicitly group or filter by `ReserveType`, `TimeHorizon`, `Direction`, and `TypeOfProduct`. Failing to do so will result in erroneously summing distinct balancing services (like FCR and RR) and overlapping allocation timeframes together. When querying via the RESTful API, general query size rules apply, making pagination necessary for long periods.
        data_quality_issues: |
          Because this dataset integrates previously separate legacy data items (17.1.B and 17.1.C), early historical data before the transition might exhibit structural differences or mapping issues. Additionally, some optional attributes like `ReserveSource` or `PriceType` might be sparsely populated depending on the respective TSO's reporting capabilities.
        anomalies:
          Complex_Time_Mapping: |
            Data engineers must be extremely careful when joining or aggregating this data temporally. Because a single reserve contract might be procured months or years in advance (e.g., `TimeHorizon` = 'Yearly') but is broken down into granular intervals (`ISP(UTC)`), analysts must use the correct timestamp column depending on whether they are analyzing market bidding behavior (`ProcurementDateAndTime(UTC)`) or actual physical reserve availability in a given hour (`ISP(UTC)`).



    BalancingBorderCapacityLimitations_IFs_4.3_4.4_r3:
      title: "Balancing Border Capacity Limitations [IFs 4.3&4.4]"
      oneliner: "Information on cross-border capacity limitations applied specifically
        for balancing energy processes."
      description: |
        This dataset details the limitations imposed on cross-zonal transmission capacities that are available for the exchange of balancing energy or for operating the imbalance netting process. It provides transparency on when, where, and why transmission system operators (TSOs) restrict the capacity that can be used for balancing purposes (such as aFRR, mFRR, or Imbalance Netting) across specific borders.
      compliance: |
        The index `IFs 4.3&4.4` refers to the Implementation Frameworks for the exchange of balancing energy, complying with the Electricity Balancing Guideline (EB GL) requirements to publish information regarding cross-zonal capacity limitations for balancing.
      suffix: r3
      physical_meaning: |
        The dataset represents the maximum allowed active power limit (`CrossBorderCapacityLimit[MW]`) over a specific border or physical interconnector (`InterconnectorCode`) for a given balancing process (`ProcessType`). It includes the operational `Reason` for the limitation (e.g., 'Operational security') and identifies the TSO requesting the limitation (`RequesterName`).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files encoded in UTF-8.
          The files generally follow the standardized naming mask: `YYYY_MM_BalancingBorderCapacityLimitations_IFs_4.3_4.4.csv`.
        time_resolution: |
          Depending on the specific market rules and balancing processes, the time step (`ResolutionCode`) in the file is typically:
          * 15 minutes (`PT15M`)
        required_columns: |
          The file contains columns for the exact start time of the Imbalance Settlement Period `ISP(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (LFA, SCA), `OutAreaMapCode`,
          the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (LFA, SCA), `InAreaMapCode`.
          It also includes the balancing `ProcessType` (Automatic Frequency Restoration Reserve (aFRR), Imbalance Netting (IN), Manual Frequency Restoration Reserve (mFRR)),
          an optional `InterconnectorCode` and `InterconnectorName`,
          the limit value `CrossBorderCapacityLimit[MW]`,
          the `RequesterCode` and `RequesterName`,
          the `Reason` (e.g., Operational security) and an optional `Comment`,
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          The geography is defined by a pair of incoming and outgoing areas, typically Load Frequency Control Areas (LFA) or Scheduling Areas (SCA).
          Crucially, the limitations are specific to the balancing `ProcessType` (aFRR, mFRR, IN) and can be granular down to a specific physical interconnector (`InterconnectorCode`).
        parsing_technical_challenges: |
          When aggregating or analysing the data for a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'SCA' AND InAreaTypeCode = 'SCA'`) is mandatory to prevent double-counting duplicate geographic concepts.
          Additionally, queries must isolate the specific `ProcessType` because the same border may have different capacity limits applied simultaneously to different balancing reserves.
        data_quality_issues: |
          Limitations are often ad-hoc and applied due to dynamic operational security constraints. The dataset relies on the accurate and timely reporting by the requesting TSOs when they actively restrict balancing flows.
        anomalies:
          Optional_Fields_and_Sparsity: |
            Fields such as `InterconnectorCode`, `InterconnectorName`, and `Comment` are optional and might frequently be empty if the limitation applies to the entire border rather than a specific tie-line. Additionally, data pipelines should be prepared to handle sparse data, as TSOs generally only report this data when a limitation is actively enforced, leading to files that may not have continuous intervals for every border.



    BalancingEnergyBidsArchives_12.3.B_C_r3:
      title: "Balancing Energy Bids Archives [12.3.B & C]"
      oneliner: "Archived historical data of balancing energy bids (older than 93
        days), provided in XML format."
      description: |
        This dataset serves as the long-term historical archive for individual balancing energy bids submitted by Balancing Service Providers (BSPs) to the system operators. Because balancing bid data is extremely voluminous and highly granular, the ENTSO-E platform splits its publication into two formats: recent data (for the past 93 days) is available in flat CSV format under the standard `BalancingEnergyBids_12.3.B_C_r3` directory, while all historical data older than 93 days is permanently moved to this archive dataset. It provides transparency on the balancing market depth, reserve prices, and bid availability over long historical horizons.
      compliance: |
        The index `12.3.B_C` refers to Articles 12(3)(b) and 12(3)(c) of the Electricity Balancing Guideline (GL EB), which obliges TSOs to publish detailed information on balancing energy bids.
      suffix: r3
      physical_meaning: |
        The dataset details individual balancing energy bids offered to the market. Key metrics include the offered capacity `Volume[MW]`, the bid `Price[Currency/MWh]`, the reserve category `ReserveType` (e.g., aFRR, mFRR, RR), and the flow `Direction` (Up or Down). It also tracks the `Status` of the bid (Available or Unavailable) and, if applicable, the `ReasonForUnavailability` (such as internal congestion or operational security constraints).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as daily extracts.
          A crucial distinction for this archive dataset is the file format: unlike standard monthly CSV extracts, the archives are provided as **ZIP files containing XML documents** (`ZIP (XML)`).
        time_resolution: |
          Depending on the specific market rules and bidding zones, the time step (`ResolutionCode`) for the Imbalance Settlement Period (ISP) is typically:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          Because this is an XML archive, the schema follows the ENTSO-E CIM (Common Information Model) standard, specifically IEC 62325-451-7 for balancing processes. When flattened, the equivalent fields map to:
          `InstanceCode`, `DeliveryPeriodStart(UTC)`, `ValidityPeriodStart(UTC)`, `ISP(UTC)`,
          the 16-digit EIC code of the zone `AreaCode` (usually `SCA` or `LFA`), `AreaTypeCode`,
          the unique `BidID`, `ReserveType`, `TypeOfProduct` (e.g., Standard, Specific, Local),
          `Direction`, `Volume[MW]`, `Price[Currency/MWh]`, `Status`, `ReasonForUnavailability`, and `UpdateTime(UTC)`.
        parsing_key_feature: |
          The most critical feature of working with this dataset is managing the temporal split. To analyze long-term trends (e.g., extracting a full year of bidding data), analysts must build an ETL pipeline that combines the flat CSV files from the standard dataset (for the most recent 93 days) with the heavily nested XML files parsed from this archive dataset (for all preceding days).
        parsing_technical_challenges: |
          Parsing XML files is significantly more computationally expensive and technically complex than processing flat CSVs. The ZIP files contain deeply nested CIM XML structures. Data engineers need robust XML parsers (e.g., `xml.etree.ElementTree` or `BeautifulSoup` wrapped via tools like `entsoe-py`) to extract the bid time series, flatten them into tabular formats, and append them to their historical databases.
        data_quality_issues: |
          Balancing bid data is highly dimensional and can be exceptionally large in volume. Bids can be complex (e.g., linked or multipart bids), and tracking their availability status through time requires careful alignment of the `ValidityPeriodStart` and `ValidityPeriodEnd` timestamps.
        anomalies:
          Dual_Format_Discrepancy: |
            The dual-format structure (CSV for <93 days, XML for >93 days) is a unique architectural anomaly for balancing bids on the Transparency Platform. Data pipelines must implement two completely different ingestion logic paths to build a continuous, unbroken historical time series. Furthermore, parsing millions of XML nodes for historical bids requires significant RAM and CPU resources compared to standard CSV ingestion.



    BalancingEnergyBids_12.3.B_C_r3:
      title: "Balancing Energy Bids [12.3.B&C]"
      oneliner: "Detailed information on individual balancing energy bids, including
        volume, price, and availability status."
      description: |
        This dataset provides highly granular, bid-level data for balancing energy submitted by Balancing Service Providers (BSPs) to system operators. It covers different reserve types such as Automatic Frequency Restoration Reserve (aFRR), Manual Frequency Restoration Reserve (mFRR), and Replacement Reserve (RR). It details the specific direction of the bid, the product type, its complexity, and its availability status, playing a crucial role in understanding the liquidity, pricing, and operational dynamics of the European balancing markets.
      compliance: |
        The index `12.3.B_C` directly refers to the relevant articles of the Electricity Balancing Guideline (GL EB) 12.3.B and 12.3.C, which obliges the publication of information regarding offered balancing energy bids.
      suffix: r3
      physical_meaning: |
        The dataset represents individual balancing energy bids, specifying the active power `Volume[MW]` and its `Price[Currency/MWh]` for a given `Direction` (Up or Down). It provides operational metadata including the `ReserveType` (e.g., aFRR, mFRR), `TypeOfProduct` (e.g., Standard, Specific, Local), and the bid's `Status` (Available or Unavailable). If a bid is marked as unavailable, it may include a `ReasonForUnavailability` (e.g., Internal congestion, Operational security constraints) and an `ActivationPurpose`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as daily extracts in the File Library for the past 93 days.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          For data older than 93 days, the extracts are moved to the `BalancingEnergyBidsArchives_12.3.B_C_r3` folder and are provided exclusively as ZIP archives containing XML files.
        time_resolution: |
          Depending on the specific market rules and the Imbalance Settlement Period (ISP), the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          The file contains columns for `InstanceCode`, `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`, `ValidityPeriodStart(UTC)`, `ValidityPeriodEnd(UTC)`, and the exact `ISP(UTC)`.
          It includes the time step `ResolutionCode`, the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (LFA, SCA), and the `MapCode`.
          Bid-specific details include the unique `BidID`, `ReserveType`, `TypeOfProduct`, `Direction`, `Complexity` (Exclusive, Linked, Multipart), `Status`, `Volume[MW]`, `Price[Currency/MWh]`, and `Currency`.
          It also contains `ReasonForUnavailability`, `ActivationPurpose`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * SCA (Scheduling Area)
          * LFA (Load Frequency Control Area).
          Additionally, this dataset uniquely tracks individual bids via the `BidID` column.
        parsing_technical_challenges: |
          When processing this data to analyze balancing bids, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double-counting duplicate geographical concepts.
          When querying this dataset via the REST API, the query size limit is severely restricted to a maximum of 100 documents per request, making it completely unsuitable for bulk historical downloads.
        data_quality_issues: |
          Because this dataset tracks individual bids, it is highly sensitive to the varying reporting capabilities of different TSOs. Fields like `Price[Currency/MWh]` might occasionally be empty if the bid does not have a price attached, and the `Currency` field is only provided when a price is reported.
        anomalies:
          Data_Retention_and_Dual_Pipelines: |
            Due to the massive volume of individual bid data, ENTSO-E applies a unique data retention policy to this specific dataset. The standard CSV FMS extracts are only available for the past 93 days. Any data older than 93 days is archived into ZIP files containing raw CIM XML documents (`BalancingEnergyBidsArchives_12.3.B_C_r3`). Data engineers attempting to build a complete historical timeseries face a significant technical hurdle, as they must build two entirely different ETL parsers (one for flat tab-delimited CSVs, and one for heavily nested XMLs) and seamlessly stitch the output together.



    ChangesToBidAvailabilityArchives_IFs_mFRR9.9_aFRR9.6_9.8_r3:
      title: "Changes to Bid Availability Archives [IFs mFRR 9.9, aFRR 9.6 & 9.8]"
      oneliner: "Archived daily XML data for changes to balancing energy bid availability
        older than 93 days."
      description: |
        This dataset contains the historical archives of changes to the availability of balancing energy bids for Automatic and Manual Frequency Restoration Reserves (aFRR and mFRR). It holds data that is older than 93 days. This information is crucial to track when and why previously submitted balancing bids became unavailable for activation by the system operators (e.g., due to technical failures or operational security constraints).
      compliance: |
        The dataset supports the publication obligations under the Implementation Frameworks (IFs) for mFRR (Article 9.9) and aFRR (Articles 9.6 & 9.8) on the European transparency platforms.
      suffix: r3
      physical_meaning: |
        The data identifies specific balancing energy bids (`LinkedBidID`) and records their `Status` (Available or Unavailable) for a given delivery period. It includes the `ReserveType` (aFRR or mFRR), flow `Direction` (Up or Down), and details the `Reason` for the unavailability (e.g., Technical unavailability of specific reserve providing unit(s)).
      technical_specification:
        format_and_frequency_of_extracts: |
          Unlike the standard recent data extracts which are provided as monthly CSVs, this specific archive dataset is provided as daily extracts for data older than 93 days.
          The data is packaged in ZIP files containing XML documents.
        time_resolution: |
          The delivery periods generally align with the standard market time units of the specific balancing area, which may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          Although provided in XML format, the data fields map to the following structure:
          `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`,
          the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (SCA, LFA), `MapCode`,
          the specific bid identifier `LinkedBidID`,
          the `ReserveType` (aFRR, mFRR), `Direction` (Up, Down),
          the `RequestingPartyCode` and `RequestingPartyRole`,
          the `Status`, `Reason` and `Note`,
          details of the affected network element (`NetworkElementsEICCode`, `NetworkElementsType`, `NetworkElementsLocation`),
          and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          The most critical aspect of this dataset is that it is an archive for older data (>93 days) and thus relies on daily ZIP files containing XML documents (DocumentType B45 - Bid Availability Document), rather than flat CSVs. It uses the `LinkedBidID` to reference the original balancing bid.
          Furthermore, geographic data is duplicated across two Area Type Codes:
          * SCA (Scheduling Area)
          * LFA (Load Frequency Control Area).
        parsing_technical_challenges: |
          Building an ETL pipeline for this dataset requires an XML parser capable of unzipping daily archives and extracting data from CIM-based XML structures, which is significantly more complex and resource-intensive than parsing the monthly CSV FMS extracts.
          Additionally, you must filter by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) to avoid processing duplicate records for the same geographical area.
        data_quality_issues: |
          Because this is an archive, the data represents the historical, finalized state of bid availability. However, reasons for unavailability and network element details (`NetworkElementsEICCode`) might be left empty or contain free-text notes depending on the reporting practices of the specific TSO.
        anomalies:
          Format_Discrepancy_with_Recent_Data: |
            Data engineers must build bifurcated pipelines if they want to analyze both recent and historical bid availability: recent data (<= 93 days) is pulled from the standard `ChangesToBidAvailability_IFs_mFRR9.9_aFRR9.6_9.8_r3` FMS folder as monthly CSVs, whereas historical data (> 93 days) must be pulled from this `ChangesToBidAvailabilityArchives...` folder as daily ZIP/XMLs.



    ChangesToBidAvailability_IFs_mFRR9.9_aFRR9.6_9.8_r3:
      title: "Changes to Bid Availability [IFs mFRR 9.9, aFRR 9.6&9.8]"
      oneliner: "Recent data on modifications to the availability status of submitted
        balancing energy bids."
      description: |
        This dataset details changes to the availability status of previously submitted balancing energy bids for Automatic and Manual Frequency Restoration Reserves (aFRR and mFRR). It provides transparency on when and why a balancing bid's availability changes (e.g., becomes unavailable for activation) due to reasons like technical failures of reserve providing units or network security constraints. This specific standard dataset covers the recent time horizon, while older historical data is routed to a separate XML archive.
      compliance: |
        This publication fulfils the obligations under the Implementation Frameworks (IFs) for the exchange of balancing energy, specifically for mFRR (Article 9.9) and aFRR (Articles 9.6 & 9.8).
      suffix: r3
      physical_meaning: |
        The dataset references a specific balancing energy bid using its `LinkedBidID` and records its updated `Status` (Available or Unavailable) over a specified delivery period. It specifies the `ReserveType` (aFRR or mFRR), flow `Direction` (Up or Down), the party requesting the change (`RequestingPartyRole`), and the operational `Reason` for the change (e.g., 'Technical unavailability of specific reserve providing unit(s)').
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files encoded in UTF-8.
          The files generally follow the standardized naming mask: `YYYY_MM_ChangesToBidAvailability_IFs_mFRR9.9_aFRR9.6_9.8.csv`.
        time_resolution: |
          The time interval is defined by the exact start and end times: `DeliveryPeriodStart(UTC)` and `DeliveryPeriodEnd(UTC)`. These periods generally align with the standard market time units of the specific balancing area.
        required_columns: |
          The file contains columns for `InstanceCode`, `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`,
          the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (SCA, LFA), and `MapCode`.
          Bid specific details include `LinkedBidID`, `ReserveType` (aFRR, mFRR), and `Direction`.
          It tracks the source of the change via `RequestingPartyCode`, `RequestingPartyName`, and `RequestingPartyRole` (Transmission System Operator, Balancing Service Provider, Distribution System Operator).
          Finally, it includes the new `Status`, `Reason`, an optional `Note`, details on affected infrastructure if applicable (`NetworkElementsEICCode`, `NetworkElementsName`, `NetworkElementsType`, `NetworkElementsLocation`), and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset uniquely relies on the `LinkedBidID` to connect the availability change back to the original balancing bid submitted by the BSP.
          Additionally, within a single CSV file, the data is duplicated for different geographic concepts. The `AreaTypeCode` column contains two possible values: LFA (Load Frequency Control Area) and SCA (Scheduling Area).
        parsing_technical_challenges: |
          When processing this data, prior filtering by matching `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is mandatory to avoid processing duplicate geographic records.
          When querying via the REST API, the query size limit is severely restricted to a maximum of 100 documents per request, making bulk historical downloads via the API extremely impractical.
        data_quality_issues: |
          The granularity and completeness of the reason for unavailability heavily depend on the reporting TSO's practices. Optional fields related to network elements (`NetworkElementsEICCode`, `NetworkElementsName`, `NetworkElementsType`, `NetworkElementsLocation`) and free-text `Note` fields might frequently be empty.
        anomalies:
          Data_Retention_and_Archives: |
            Similar to the underlying balancing bids, ENTSO-E applies a strict retention policy to this dataset. The flat CSV files in this directory are only generated for recent data. To build a comprehensive historical timeline for data older than 93 days, data engineers must construct parallel pipelines to download and parse deeply nested XML files from the daily ZIP archives located in the corresponding `ChangesToBidAvailabilityArchives_IFs_mFRR9.9_aFRR9.6_9.8_r3` folder.



    CrossZonalBalancingCapacity_12.3.H_12.3.I_r3:
      title: "Cross-zonal Balancing Capacity [12.3.H & 12.3.I]"
      oneliner: "Information on the allocation, use, and release of cross-zonal capacity
        specifically reserved for balancing purposes."
      description: |
        This dataset details the cross-zonal balancing capacity between bidding zones. It covers the capacity allocated for the exchange of balancing capacity or the sharing of reserves, tracking how much of that capacity was actually used and how much was released back to the market. It provides transparency on cross-border cooperation in balancing markets, including economic assessments like estimated costs and benefits of the allocation decisions.
      compliance: |
        The indices `12.3.H` and `12.3.I` directly refer to the relevant articles of the Electricity Balancing Guideline (GL EB), which obliges system operators (TSOs) to publish information regarding the use of allocated cross-zonal balancing capacity.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the active power capacity in megawatts allocated (`AllocatedCapacity[MW]`), utilized (`UsedCapacity[MW]`), and subsequently freed up (`ReleasedCapacity[MW]`) for balancing processes between an outgoing area and an incoming area. It categorizes the data by `ReserveType` (e.g., aFRR, FCR, mFRR, RR) and allocation timeframe `ContractType` (Daily, Weekly, Long term). It also provides economic indicators such as `EstimatedCost` and `EstimatedBenefits`, denominated in the specified `Currency`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) and use UTF-8 encoding.
          The files generally follow the standardized naming mask: `YYYY_MM_CrossZonalBalancingCapacity_12.3.H_12.3.I.csv`.
        time_resolution: |
          Depending on the `ContractType` and the specific market time unit, the time step (`ResolutionCode`) in the file may vary significantly:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * 1 day (`P1D`)
          * 7 days (`P7D`)
        required_columns: |
          The file contains columns for `InstanceCode`, `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`, and the specific `MarketTimeUnit(UTC)`.
          It includes the time step `ResolutionCode`, the 16-digit EIC code of the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN), `OutAreaMapCode`.
          It also includes the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN), `InAreaMapCode`.
          Furthermore, it contains the `AllocationDecisionDateAndTime(UTC)`, `ContractType`, and `ReserveType`.
          The capacity values are `AllocatedCapacity[MW]`, `UsedCapacity[MW]`, and `ReleasedCapacity[MW]`.
          Financial and economic metrics include `BalancingReserveCapacity[currency/MW/MTU]`, `BalancingEnergy[currency/MW/MTU]`, `EstimatedCost`, `EstimatedBenefits`, and the `Currency` (as per ISO 4217).
          Finally, it contains the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          A unique and highly beneficial feature of this dataset compared to others on the Transparency Platform is that the geography is strictly defined at the Bidding Zone level (`OutAreaTypeCode` and `InAreaTypeCode` only contain the value `BZN`). This means data engineers do not have to filter out duplicate geographic concepts (like CTA or SCA) within the same file. However, the data is highly dimensionalized by `ContractType` and `ReserveType`.
        parsing_technical_challenges: |
          When processing this data, analytical queries must explicitly group or filter by `ContractType` and `ReserveType` to avoid erroneously summing distinct balancing reserves and overlapping allocation timeframes together.
          When querying this dataset via the RESTful API, general query rules apply, meaning a request can cover a date range of up to one year without the severe 100-document limitation seen in some other capacity datasets.
        data_quality_issues: |
          Because cross-zonal balancing allocation involves predictive economic assessments, the dataset relies heavily on the TSOs' ability to accurately forecast and report costs and benefits. Financial fields might be populated later or subjected to updates.
        anomalies:
          Sparse_Financial_Data: |
            Fields such as `BalancingReserveCapacity[currency/MW/MTU]`, `BalancingEnergy[currency/MW/MTU]`, `EstimatedCost`, and `EstimatedBenefits` are optional [0..1] and might frequently be empty depending on the specific balancing processes, market integration maturity on the given border, and the reporting capabilities of the respective TSOs. Data pipelines should be built robustly to handle nulls in these numeric columns.



    CurrentBalancingState_12.3.A_r3:
      title: "Current Balancing State [12.3.A]"
      oneliner: "Real-time information on the balancing state of the power system,
        including surplus, deficit, and control area errors."
      description: |
        This dataset provides transparency on the real-time balancing state of the power system. It indicates whether a specific geographical area is experiencing a deficit, a surplus, or is in a balanced state. It also quantifies the imbalance through the Open Loop Control Area Error, providing market participants with crucial insights into the system's immediate need for balancing energy.
      compliance: |
        The index `12.3.A` refers to Article 12(3)(a) of the Electricity Balancing Guideline (GL EB), which mandates the publication of the current balancing state of the scheduling areas.
      suffix: r3
      physical_meaning: |
        The dataset represents the physical balancing situation of a grid area (`Situation`: Balanced, Deficit, Surplus) for a given time interval. It also provides the `OpenLoopControlAreaError[MW]` in megawatts, which quantifies the physical deviation of the area's active power balance from its scheduled value.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          The files generally follow the standardized naming mask: `YYYY_MM_CurrentBalancingState_12.3.A.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file can be highly granular, typically 1 minute (`PT1M`), but may also appear as larger intervals like `PT60M`.
        required_columns: |
          The file contains columns for the exact start time of the interval `DateTime(UTC)`, the time step `ResolutionCode`, the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (IBA, LFA, SCA), and the country map code `AreaMapCode`.
          It includes the qualitative `Situation` (Balanced, Deficit, Surplus), the quantitative `OpenLoopControlAreaError[MW]`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          A critical feature of this dataset is the duplication of records across different geographical concepts within the same file.
          The `AreaTypeCode` column contains three possible values:
          * IBA (Imbalance Area)
          * LFA (Load Frequency Control Area)
          * SCA (Scheduling Area).
        parsing_technical_challenges: |
          When querying or aggregating this data, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double or triple counting the same geographic area.
          Furthermore, when querying this dataset via the RESTful API, the query size limit is restricted to a maximum of a 100-day date range per request, which differs from the standard one-year limit applied to many other datasets.
        data_quality_issues: |
          Because this data relies on near real-time operational telemetry to calculate the open loop control area error, it can be subject to noise, missing intervals, or delays if communication links between the TSO and the central platform experience temporary failures.
        anomalies:
          API_Query_Limit_Anomaly: |
            Unlike most other standard datasets that allow a 1-year date range for API requests, the Current Balancing State (12.3.A) restricts API queries to a maximum of 100 days per request. ETL pipelines must be configured with shorter pagination intervals when fetching historical data directly via the RESTful API rather than using the bulk FMS monthly extracts.



    ElasticDemands_IFs_mFRR3.4_aFRR3.4_r3:
      title: "Elastic Demands [IFs mFRR 3.4, aFRR 3.4]"
      oneliner: "Volumes and prices of elastic demands for aFRR and mFRR balancing
        reserves."
      description: |
        This dataset details the elastic demands submitted for balancing energy purposes, specifically for the exchange of Automatic Frequency Restoration Reserve (aFRR) and Manual Frequency Restoration Reserve (mFRR). It provides transparency on the requested volumes, offered prices, and directions of these elastic demands across different geographical areas.
      compliance: |
        The index `IFs mFRR 3.4, aFRR 3.4` refers to the Implementation Frameworks for the exchange of balancing energy from mFRR and aFRR, complying with the publication obligations under the European balancing guidelines.
      suffix: r3
      physical_meaning: |
        The dataset represents the requested active power volume in megawatts (`RequestedVolume[MW]`) for a specific balancing reserve (`ReserveType`) and flow direction (`Direction`, which can be Up or Down). It also includes the price the requesting party is willing to pay (`OfferedPrice`) alongside the specific `Currency` (as per ISO 4217).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          The files generally follow the standardized naming mask: `YYYY_MM_ElasticDemands_IFs_mFRR3.4_aFRR3.4.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file is typically:
          * 15 minutes (`PT15M`)
        required_columns: |
          The file contains columns for `InstanceCode`, the exact start and end of the Market Time Unit (`MarketTimeUnitStart(UTC)` and `MarketTimeUnitEnd(UTC)`), and the time step `ResolutionCode`.
          The geographical information includes the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (SCA, LFA), and the country `MapCode`.
          The balancing parameters include the `ReserveType` (Automatic Frequency Restoration Reserve (aFRR), Manual Frequency Restoration Reserve (mFRR)), the flow `Direction` (Up, Down), the `RequestedVolume[MW]`, the `OfferedPrice`, the `Currency`, a `Reason`, an optional `Comment`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * SCA (Scheduling Area)
          * LFA (Load Frequency Control Area)
        parsing_technical_challenges: |
          When processing this data to analyze total elastic demand volumes for a specific country or zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double-counting duplicate geographical concepts.
          Furthermore, analytical queries must explicitly group or filter by `ReserveType` (aFRR vs mFRR) and `Direction` (Up vs Down) to avoid erroneously summing distinct balancing services together.
        data_quality_issues: |
          Optional fields such as `OfferedPrice`, `Currency`, `Reason`, and `Comment` may be sparsely populated depending on the reporting capabilities and specific operational situations of the TSOs.
        anomalies:
          Empty_Price_Fields: |
            Data pipelines must be built robustly to handle `null` or missing values in the `OfferedPrice` and `Currency` fields, as elastic demands might not always be submitted with a specific price attached.



    Fallbacks_IF_IN7.2_mFRR3.11_aFRR3.10_r3:
      title: "Fall-backs [IFs IN 7.2, mFRR 3.11, aFRR 3.10]"
      oneliner: "Information on fall-back procedures and platform failures affecting
        balancing energy and imbalance netting processes."
      description: |
        This dataset provides transparency on the invocation of fall-back procedures for the exchange of balancing energy and imbalance netting (IN) processes. It records events where standard European balancing platforms or auctions fail, are cancelled, or undergo planned maintenance, along with the reasons and affected validity periods.
      compliance: |
        The dataset complies with the Implementation Frameworks (IFs) for Imbalance Netting (Article 7.2), mFRR (Article 3.11), and aFRR (Article 3.10), which mandate reporting on the use of fall-backs.
      suffix: r3
      physical_meaning: |
        The dataset details operational disruptions, captured as `EventType`, such as platform failures, auction cancellations, or TSO disconnections that prevent normal balancing market operations. It indicates the affected geographical area, the `ProcessType` (e.g., IN, aFRR, mFRR), the `Reason` for the fall-back, and the exact timestamps of the affected Imbalance Settlement Periods.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library. Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8. The standard naming mask is typically `YYYY_MM_Fallbacks_IF_IN7.2_mFRR3.11_aFRR3.10.csv`.
        time_resolution: |
          Unlike standard continuous time series, this is event-driven data specifying start and end times for the affected Imbalance Settlement Periods, specifically via `FirstAffectedISPStart(UTC)` and `LastAffectedISPEnd(UTC)`.
        required_columns: |
          The file contains `InstanceCode`, `FirstAffectedISPStart(UTC)`, `LastAffectedISPEnd(UTC)`, `FirstAffectedValidityPeriodStart(UTC)`, and `FirstUnaffectedValidityPeriodStart(UTC)`. It includes geographic identifiers like `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (CTA, LFA, REG), and `AreaMapCode`. It also specifies `ProcessType`, `EventType`, `Status` (Intermediate, Final, Cancelled, Active), `Reason`, `Comments`, and `UpdateTime(UTC)`.
        parsing_key_feature: |
          A defining feature is that it describes discrete outage or failure events rather than continuous time series. Geography is represented by three potential `AreaTypeCode` values: CTA (Control Area), LFA (Load Frequency Control Area), and REG (Region). The events are strictly categorized by specific balancing `ProcessType` (e.g., aFRR, IN, mFRR, mFRR DA, mFRR SA).
        parsing_technical_challenges: |
          When querying via the REST API, a strict limit of 100 documents per request applies, making it necessary to paginate through results or carefully narrow the search window. Additionally, when processing the CSV files to analyze a specific geographic region, analysts must filter by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'LFA'`) to avoid double-counting events across overlapping geographic definitions.
        data_quality_issues: |
          Because this is event-driven outage data, files will only contain records when failures or planned maintenance actually occur. Free-text `Comments` are optional and might frequently be empty depending on the reporting TSO.
        anomalies:
          API_Limitations_and_Event_Sparsity: |
            The strict API limit of 100 documents requires careful querying when retrieving historical data. In the bulk FMS monthly extracts, the data might be highly sparse across certain months, as fall-backs are exceptional operational events rather than regular continuous market schedules.




    FinancialExpensesAndIncomeForBalancing_17.1.I_r3:
      title: "Financial Expenses and Income for Balancing [17.1.I]"
      oneliner: "Monthly financial data detailing the expenses and income related
        to power system balancing."
      description: |
        This dataset provides transparency on the financial aspects of the balancing operations conducted by Transmission System Operators (TSOs). It contains the aggregated monthly monetary figures for both the expenses incurred and the income generated from balancing the electrical grid. This information is essential for understanding the overall economic costs associated with maintaining system frequency and balancing supply and demand.
      compliance: |
        The index `17.1.I` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of financial expenses and income for balancing.
      suffix: r3
      physical_meaning: |
        The dataset represents the total monetary volume of `Expenses` and `Income` related to system balancing over a specific month. These values are denominated in the respective local `Currency` based on ISO 4217 codes (e.g., CZK, EUR). It also tracks the settlement phase via the `Status` column, distinguishing between 'Intermediate' and 'Final' accounting figures.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The filenames typically follow the standardized mask: `YYYY_MM_FinancialExpensesAndIncomeForBalancing_17.1.I.csv`.
        time_resolution: |
          Given the financial settlement nature of this data, the time step (`ResolutionCode`) in the file is strictly one month (`P1M`).
        required_columns: |
          The file contains columns for the `Year`, `Month`, the local `TimeZone` (e.g., CET/CEST), and the time step `ResolutionCode`.
          It includes the settlement `Status` (Intermediate, Final).
          Geographical attributes include the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (strictly CTA), and `AreaMapCode`.
          Finally, it contains the financial figures `Expenses`, `Income`, the `Currency`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike operational telemetry that is heavily duplicated across multiple geographic concepts, this dataset relies specifically on the Control Area (`CTA`) as the defined `AreaTypeCode`.
          A crucial operational feature is the `Status` column, which dictates the maturity of the financial settlement.
        parsing_technical_challenges: |
          When querying this dataset via the RESTful API, the query size limit is strictly restricted to a maximum of a one-year date range per request. Data engineers must handle the `P1M` resolution appropriately, mapping it to monthly periods rather than the high-frequency intra-day timestamps used in most other domains.
        data_quality_issues: |
          Balancing energy settlement is a complex financial process that takes time to reconcile. As a result, TSOs will often first publish provisional data marked with the `Status` 'Intermediate'. Data engineers must build pipelines that periodically check and overwrite these values once the TSO updates the `Status` to 'Final' along with a new `UpdateTime(UTC)`.
        anomalies:
          Legacy_Data_and_Zone_Splits: |
            Historical data for the discontinued Market Balance Area `MBA|DE-LU` (Germany-Luxembourg) under the old publication schema is not kept in this active directory. Instead, it is archived separately in the `FinancialExpensesAndIncomeForBalancing_17.1.I_r2` folder within the `TP_Legacy_Publications` directory. Analysts compiling long-term historical financial series for Germany must append data from this legacy r2 archive.



    ImbalancePrices_17.1.G_r3:
      title: "Imbalance Prices [17.1.G]"
      oneliner: "Imbalance prices and their specific components for different geographical
        areas."
      description: |
        This dataset details the imbalance prices applied in different geographic areas, such as Imbalance Price Areas (IPA) or Scheduling Areas (SCA). It provides transparency on the financial costs associated with positive and negative energy imbalances, which are crucial for market participants (Balance Responsible Parties) responsible for maintaining their balance. It includes the main prices as well as specific price components like scarcity, incentive, and financial neutrality where applicable.
      compliance: |
        The index `17.1.G` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators to publish imbalance prices.
      suffix: r3
      physical_meaning: |
        The dataset tracks the actual financial prices applied to energy imbalances: `PositiveImbalancePrice(PerMWh)` and `NegativeImbalancePrice(PerMWh)`, measured in the specified `Currency`. It further breaks down these prices into constituent parts: Scarcity, Incentive, and Financial Neutrality. It also specifies the `Status` of the price, indicating whether it is an 'Intermediate' calculation or a 'Final' settled price.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          The files generally follow the standardized naming mask: `YYYY_MM_ImbalancePrices_17.1.G.csv`.
        time_resolution: |
          Depending on the specific market rules and the Imbalance Settlement Period (ISP), the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          The file contains columns for the exact start time of the interval `DateTime(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (IPA, LFA, SCA), `MapCode`.
          It details the main prices `PositiveImbalancePrice(PerMWh)` and `NegativeImbalancePrice(PerMWh)`,
          and the price components `PositiveScarcity(PerMWh)`, `PositiveIncentive(PerMWh)`, `PositiveFinancialNeutrality(PerMWh)`,
          `NegativeScarcity(PerMWh)`, `NegativeIncentive(PerMWh)`, `NegativeFinancialNeutrality(PerMWh)`.
          It also includes the `Currency` (as per ISO 4217), the `Status` (Intermediate, Final),
          and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains three possible values:
          * IPA (Imbalance Price Area)
          * LFA (Load Frequency Control Area)
          * SCA (Scheduling Area).
        parsing_technical_challenges: |
          When processing this data to analyze a specific market, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is mandatory to avoid processing duplicate records for the same geographical area.
          When querying this dataset via the RESTful API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Imbalance settlement is a highly complex post-operational process. Data is initially published with an 'Intermediate' status and might be subject to revisions until the 'Final' status is reached. Data pipelines must carefully track the `UpdateTime(UTC)` to capture the finalized settlement prices.
        anomalies:
          Empty_Price_Components: |
            Fields detailing specific price components (like `PositiveScarcity`, `NegativeIncentive`, `PositiveFinancialNeutrality`) are often empty depending on the specific national market rules and the reporting practices of the local TSO. Pipelines should be prepared to robustly handle missing or `null` values for these optional numeric fields.



    NettedAndExchangedVolumesAfrr_IFs_aFRR3.16_r3:
      title: "Exchanged Volumes And Prices Provided By Activation Optimisation Function
        (AOF) [IFs aFRR 3.16]"
      oneliner: "Daily highly granular data of netted and exchanged volumes for the
        automatic Frequency Restoration Reserve (aFRR) process."
      description: |
        This dataset details the netted and exchanged volumes of balancing energy specifically for the Automatic Frequency Restoration Reserve (aFRR). It provides highly granular information resulting from the Activation Optimisation Function (AOF), indicating the volumes of balancing energy imported or exported by specific areas.
      compliance: |
        The index `IFs aFRR 3.16` refers to the Implementation Framework for the European aFRR platform (PICASSO) under the Electricity Balancing Guideline (EB GL), obliging the publication of exchanged volumes provided by the AOF.
      suffix: r3
      physical_meaning: |
        The dataset tracks the active power energy `Quantity[MWh]` exchanged or netted over very short optimisation cycles. It specifies the `Direction` of the flow (Import or Export) for the aFRR `ProcessType` and indicates the `Status` of the data (Preliminary or Final).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as daily extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files using UTF-8 encoding.
          The files generally follow the standardized naming mask: `YYYY_MM_DD_NettedAndExchangedVolumesAfrr_IFs_aFRR3.16.csv`.
        time_resolution: |
          The time step (`ResolutionCode`) in this dataset is exceptionally granular, reflecting the fast nature of the aFRR process. It typically features intervals of:
          * 1 second (`PT1S`)
          * 4 seconds (`PT4S`)
        required_columns: |
          The file contains columns for `OptimizationCycleStart(UTC)` and `OptimizationCycleEnd(UTC)`, the time step `ResolutionCode`.
          It details the geography with the 16-digit EIC code `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (SCA, LFA), and `MapCode`.
          It includes the `ProcessType` (Automatic Frequency Restoration Reserve (aFRR)), the `Direction` (Import, Export, or blank), the `Quantity[MWh]`, the `Status` (Preliminary, Final), and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance is the geographic duplication: the `AreaTypeCode` column contains two possible values: SCA (Scheduling Area) and LFA (Load Frequency Control Area). A highly distinct feature is its extreme temporal granularity (down to 1-second intervals).
        parsing_technical_challenges: |
          When processing this data, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double counting duplicate geographical concepts. Furthermore, because data can be provided with a `Status` of both `Preliminary` and `Final`, queries must account for this dimension to avoid summing unfinalized values with finalized ones. Due to the 1-second or 4-second intervals, these daily extracts can be massive, requiring big data processing techniques.
        data_quality_issues: |
          Given the continuous, near-real-time operation of the AOF, initial data may frequently be published as `Preliminary`. Data engineers must build pipelines capable of upserting or overwriting preliminary records once the `Final` status records are published, referencing the `UpdateTime(UTC)`.
        anomalies:
          Blank_Direction_Fields: |
            Data pipelines must be prepared to handle missing string values in the `Direction` column. According to the specification, when the exchanged `Quantity[MWh]` is exactly 0, the `Direction` field will be left completely blank.



    NettedAndExchangedVolumesPerBorder_IFs_IN3.10_mFRR3.17_r3:
      title: "Netted and Exchanged Volumes Per Border [IFs IN 3.10 & mFRR 3.17]"
      oneliner: "Netted and exchanged volumes of balancing energy across specific
        borders for Imbalance Netting and mFRR processes."
      description: |
        This dataset provides detailed information on the netted and exchanged volumes of balancing energy between different geographical areas (borders). It specifically covers balancing processes like Imbalance Netting (IN) and Manual Frequency Restoration Reserve (mFRR). It allows market participants to track the actual cross-zonal exchanges resulting from the activation of balancing actions by system operators.
      compliance: |
        The indexes `IN 3.10` and `mFRR 3.17` refer to the respective Implementation Frameworks (IFs) for Imbalance Netting and mFRR, which mandate the publication of netted and exchanged volumes of balancing energy.
      suffix: r3
      physical_meaning: |
        The dataset represents the actual active power `Quantity[MWh]` in megawatt-hours exchanged over a specific border from an outgoing area to an incoming area during a specific Imbalance Settlement Period (`ISP(UTC)`). The data details the volume used for a particular balancing `ProcessType` (e.g., Imbalance Netting, mFRR direct activation, or mFRR scheduled activation) and indicates whether the published value is a Preliminary or Final settlement (`Status`).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          The files generally follow the standardized naming mask: `YYYY_MM_NettedAndExchangedVolumesPerBorder_IFs_IN3.10_mFRR3.17.csv`.
        time_resolution: |
          The standard time step (`ResolutionCode`) in the file for these balancing processes is typically 15 minutes (`PT15M`).
        required_columns: |
          The file contains columns for the exact start time of the Imbalance Settlement Period `ISP(UTC)` and the time step `ResolutionCode`.
          It details the geography with the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (SCA, LFA), and `OutMapCode`.
          It similarly includes the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (SCA, LFA), and `InMapCode`.
          Finally, it specifies the `ProcessType` (Imbalance Netting (IN), Manual Frequency Restoration Reserve direct activation (mFRR DA), Manual Frequency Restoration Reserve scheduled activation (mFRR SA)), the `Quantity[MWh]`, the `Status` (Preliminary, Final), and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important feature of this dataset is that it represents cross-border exchanges, thus relying on paired incoming and outgoing area definitions.
          Within a single CSV file, the data is duplicated for different geographic concepts. The `OutAreaTypeCode` and `InAreaTypeCode` columns contain two possible values: SCA (Scheduling Area) and LFA (Load Frequency Control Area).
          The dataset is also highly dimensionalized by specific balancing processes (`ProcessType`) and settlement statuses (`Status`).
        parsing_technical_challenges: |
          When aggregating or analyzing the data for a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'SCA' AND InAreaTypeCode = 'SCA'`) is strictly mandatory to prevent double-counting duplicate geographic concepts.
          Furthermore, analytical queries must explicitly group or filter by `ProcessType` to avoid erroneously summing distinct balancing services together.
        data_quality_issues: |
          Balancing market data relies heavily on complex post-operational settlement processes. While preliminary operational telemetry might be published relatively quickly, the data is subject to revisions and will be updated to a final state by the TSOs.
        anomalies:
          Preliminary_vs_Final_Status: |
            Data pipelines must be carefully constructed to handle the `Status` column. TSOs often publish a `Preliminary` value shortly after delivery, and later publish a `Final` value. Data engineers should track the `Status` and the `UpdateTime(UTC)` to ensure their databases upsert or overwrite older preliminary records with the finalized settlement volumes.



    NettedAndExchangedVolumes_IFs_IN3.10_mFRR3.17_r3:
      title: "Netted and Exchanged Volumes [IFs IN 3.10 & mFRR 3.17]"
      oneliner: "Netted and exchanged volumes of balancing energy for Imbalance Netting
        and mFRR processes."
      description: |
        This dataset provides the netted and exchanged volumes of balancing energy for specific geographic areas. It covers the Imbalance Netting (IN) process and Manual Frequency Restoration Reserve (mFRR) activations, including both direct (mFRR DA) and scheduled (mFRR SA) activations. This data is essential for tracking how much balancing energy is imported or exported by a specific area to maintain system frequency.
      compliance: |
        This dataset fulfills the publication obligations under the Implementation Frameworks (IFs) for Imbalance Netting (Article 3.10) and mFRR (Article 3.17) in accordance with the European Electricity Balancing Guideline (EB GL).
      suffix: r3
      physical_meaning: |
        The dataset represents the total volume of balancing energy in megawatt-hours (`Quantity[MWh]`) that was netted or exchanged during a specific Imbalance Settlement Period (`ISP(UTC)`). The flow of energy is indicated by the `Direction` column (import or export) for the given area.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          The files generally follow the standardized naming mask: `YYYY_MM_NettedAndExchangedVolumes_IFs_IN3.10_mFRR3.17.csv`.
        time_resolution: |
          Depending on the specific market rules and the Imbalance Settlement Period, the time step (`ResolutionCode`) in the file is typically:
          * 15 minutes (`PT15M`)
        required_columns: |
          The file contains columns for the exact start time of the interval `ISP(UTC)`,
          the time step `ResolutionCode`,
          the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (SCA, LFA), the country map code `MapCode`,
          the balancing `ProcessType` (Imbalance Netting (IN), Manual Frequency Restoration Reserve direct activation (mFRR DA), Manual Frequency Restoration Reserve scheduled activation (mFRR SA)),
          the flow `Direction` (import, export, or blank),
          the volume `Quantity[MWh]`,
          the settlement `Status` (Preliminary, Final),
          and the record update time `UpdateTime` (which is in UTC).
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data might be duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * SCA (Scheduling Area)
          * LFA (Load Frequency Control Area)
          Additionally, this dataset uniquely reports the direction as blank when the quantity is exactly zero.
        parsing_technical_challenges: |
          When processing this data to analyze a specific zone, prior filtering by matching `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double counting duplicate geographical concepts.
          Furthermore, analytical queries must explicitly group or filter by `ProcessType` to avoid inappropriately summing volumes from completely different balancing mechanisms (e.g., IN vs. mFRR).
        data_quality_issues: |
          Balancing volume data relies heavily on complex post-operational settlement processes. The dataset includes a `Status` column (Preliminary or Final). Analysts must properly handle these versions, as preliminary operational data is often overwritten by final settlement data at a later date.
        anomalies:
          Blank_Direction_for_Zero_Volume: |
            A specific parsing anomaly to handle in this dataset is that when the `Quantity[MWh]` is 0, the `Direction` column is explicitly left blank. Data ingestion pipelines must be robust enough to handle null or empty strings in the `Direction` field without failing or dropping the record.



    PricesOfActivatedBalancingEnergy_17.1.F_r3:
      title: "Prices of Activated Balancing Energy & aFRR CBMPs [17.1.F, IF aFRR 3.16]"
      oneliner: "Prices paid for activated balancing energy and Cross Border Marginal
        Prices for aFRR."
      description: |
        This dataset provides detailed information on the prices paid for activated balancing energy, broken down by reserve type, product type, and direction (upward or downward). It distinguishes between the source of the reserve, specifying whether the balancing action was provided by generation, load, or if the source was not specified. Furthermore, starting from July 2022, this dataset includes Cross Border Marginal Prices (CBMPs) for the Automatic Frequency Restoration Reserve (aFRR) process.
      compliance: |
        The index `17.1.F` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators to publish prices of activated balancing energy. The inclusion of `IF aFRR 3.16` fulfills the publication obligations under the Implementation Framework for the European aFRR platform (PICASSO).
      suffix: r3
      physical_meaning: |
        The dataset tracks the actual financial prices paid for activated balancing energy during a specific Imbalance Settlement Period (`ISP(UTC)`). Prices are separated by flow direction and source, resulting in distinct fields: `LoadUpPrice`, `LoadDownPrice`, `GenerationUpPrice`, `GenerationDownPrice`, `NotSpecifiedUpPrice`, and `NotSpecifiedDownPrice`. The values represent the price per MWh rounded to 2 decimals, denominated in the specified `Currency` (as per ISO 4217). The `PriceType` indicates whether the published price is an 'Average', 'Marginal', or a 'Cross Border Marginal Price'.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The files generally follow the standardized naming mask: `YYYY_MM_PricesOfActivatedBalancingEnergy_17.1.F.csv`.
        time_resolution: |
          Depending on the specific market rules and the length of the Imbalance Settlement Period (ISP), the time step (`ResolutionCode`) in the file is typically 15 minutes (`PT15M`), though it may vary.
        required_columns: |
          The file contains columns for the exact start time of the interval `ISP(UTC)` and the time step `ResolutionCode`.
          Geographical parameters include the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (IPA, LFA, SCA), and `MapCode`.
          Balancing characteristics include the `ReserveType` (e.g., aFRR, FCR, mFRR, mFRR DA, mFRR SA, RR) and the `TypeOfProduct` (Local, Not Specified, Specific, Standard).
          The price columns are `LoadUpPrice`, `LoadDownPrice`, `GenerationUpPrice`, `GenerationDownPrice`, `NotSpecifiedUpPrice`, and `NotSpecifiedDownPrice`.
          Finally, it contains the `PriceType`, `Currency`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains three possible values:
          * IPA (Imbalance Price Area)
          * LFA (Load Frequency Control Area)
          * SCA (Scheduling Area).
        parsing_technical_challenges: |
          When processing this data to analyze balancing prices for a specific zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double or triple counting duplicate geographical concepts. Furthermore, analytical queries must properly handle the sparse matrix of price columns, checking `PriceType`, `TypeOfProduct`, and `ReserveType` to avoid mixing different pricing mechanisms (like Marginal vs Average). When querying this dataset via the RESTful API, the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Depending on the national market design and the technical capabilities of the reporting TSOs, they might not distinguish between load and generation sources. In such cases, TSOs will leave the `Load` and `Generation` price fields empty and exclusively populate the `NotSpecifiedUpPrice` and `NotSpecifiedDownPrice` columns. Data pipelines must be robust enough to handle `null` values across these mutually exclusive numeric fields.
        anomalies:
          Legacy_Data_Transition: |
            Before July 21, 2022, cross-border balancing prices were published under the legacy item `Cross-border Balancing - Prices [17.1.J]`. This legacy data item was discontinued, and its data flows were merged into this current `PricesOfActivatedBalancingEnergy_17.1.F_r3` structure to accommodate the reporting of aFRR CBMPs. Data engineers compiling long-term historical price series must extract older data from the `CrossBorderBalancingPrices_17.1.J_r2` archive and stitch it to this newer dataset.



    ProcuredBalancingCapacity_12.3.F_r3:
      title: "Procured Balancing Capacity [12.3.F]"
      oneliner: "Information on the volumes and prices of balancing capacity procured
        by system operators."
      description: |
        This dataset provides detailed transparency on the balancing capacity procured in advance by Transmission System Operators (TSOs). It sheds light on the volumes of active power reserved (such as aFRR, mFRR, FCR, and RR) and the prices paid to Balancing Service Providers (BSPs) to guarantee that sufficient reserves are available to balance the grid and maintain system frequency in real-time.
      compliance: |
        The index `12.3.F` directly refers to Article 12(3)(f) of the Electricity Balancing Guideline (GL EB), which requires the publication of information regarding procured balancing capacity.
      suffix: r3
      physical_meaning: |
        The dataset specifies the active power `Volume[MW]` procured and its corresponding `Price` (denominated in the specified `Currency`) over a given delivery period. It dimensionalizes the procured capacity by `ReserveType` (e.g., aFRR, mFRR, FCR, RR), the flow `Direction` (Up, Down, Symmetric), the `TypeOfProduct` (Local, Specific, Standard), and the underlying `ReserveSource` (Generation, Load, Mixed).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The expected filename mask generally follows the standard format: `YYYY_MM_ProcuredBalancingCapacity_12.3.F.csv`.
        time_resolution: |
          The delivery timeframes are bounded by `DeliveryPeriodStart(UTC)` and `DeliveryPeriodEnd(UTC)`. The procurement cycles are classified by the `TimeHorizon` attribute, which can span a wide range of periods: Hourly, Daily, Weekly, Monthly, Yearly, or Long term.
        required_columns: |
          The file contains columns for `InstanceCode`, the overarching `DeliveryPeriodStart(UTC)` and `DeliveryPeriodEnd(UTC)`, as well as the specific `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`.
          Geographic information includes the 16-digit EIC `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (LFA, SCA), and `AreaMapCode`.
          It details the `TimeHorizon`, `ReserveType`, `TypeOfProduct`, `ReserveSource`, and `Direction`.
          Finally, it includes the procured `Volume[MW]`, the `Price`, the `Currency` (as per ISO 4217), the exact `ProcurementDateAndTime(UTC)`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset relies on two parallel timeline concepts: the exact timestamp when the auction/procurement took place (`ProcurementDateAndTime(UTC)`) versus the actual physical period when the reserve must be delivered (`DeliveryPeriod`).
          Additionally, geography is duplicated within the same file under two possible `AreaTypeCode` values: LFA (Load Frequency Control Area) and SCA (Scheduling Area).
        parsing_technical_challenges: |
          When processing this data to analyze procured volumes or costs for a specific zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double-counting duplicate geographical concepts.
          Furthermore, when querying this dataset via the RESTful API, the query size limit is severely restricted to a maximum of 100 documents per request, making bulk historical downloads via the API extremely inefficient. Analysts should rely on the FMS File Library extracts instead.
        data_quality_issues: |
          Optional fields such as `TimeHorizon` and `ReserveSource` might be sparsely populated depending on the reporting practices and market maturity of the respective TSOs.
        anomalies:
          Impending_Deprecation_and_Structural_Change: |
            Data engineers must be aware of a critical, scheduled structural break for this dataset. According to official ENTSO-E specifications, the `ProcuredBalancingCapacity_12.3.F_r3` extract will be officially removed and deprecated on 20/05/2026. It is being replaced by a newer version, `ProcuredBalancingCapacity_12.3.F_r3.1` (available from 20/04/2026). The new `r3.1` version introduces a dedicated `ResolutionCode` column, an `ISP` column, and refactors the price column to `Price[Currency/MW/ISP]`. ETL pipelines must be updated to migrate to the `r3.1` folder and handle the schema evolution.



    TotalImbalanceVolumes_17.1.H_r3:
      title: "Total Imbalance Volumes [17.1.H]"
      oneliner: "Aggregated volumes of positive and negative imbalances for specific
        geographical areas."
      description: |
        This dataset details the total imbalance volumes for balancing areas. It indicates whether the system is experiencing a surplus, a deficit, or is in a symmetric state during a specific Imbalance Settlement Period (ISP), and it quantifies the total volume of that physical imbalance. It provides essential transparency for market participants regarding the overall physical imbalance of the power system that system operators have to resolve.
      compliance: |
        The index `17.1.H` refers to the relevant article of the EU Regulation No 543/2013 on the transparency of electricity markets, which obliges system operators to publish total imbalance volumes.
      suffix: r3
      physical_meaning: |
        The dataset represents the total active energy imbalance measured in megawatt-hours (`TotalImbalanceVolume[MWh]`) for a given interval. The `Situation` column specifies the direction of the physical imbalance (Surplus, Deficit, or Symmetric). It also tracks the settlement maturity via the `Status` column, distinguishing between 'Intermediate' and 'Final' accounting values.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The files generally follow the standardized naming mask: `YYYY_MM_TotalImbalanceVolumes_17.1.H.csv`.
        time_resolution: |
          Depending on the specific market rules and the Imbalance Settlement Period (ISP) of the given area, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for the exact start time of the interval `DateTime(UTC)`, the time step `ResolutionCode`, the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (IBA, SCA), and the `MapCode`.
          It includes the quantitative `TotalImbalanceVolume[MWh]`, an optional `Difference[MWh]`, the qualitative `Situation` (Surplus, Deficit, Symmetric), the settlement `Status` (Intermediate, Final), and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important feature of this dataset is geographical duplication. Within a single CSV file, data might be duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * IBA (Imbalance Area)
          * SCA (Scheduling Area).
        parsing_technical_challenges: |
          When aggregating or analysing the data for a specific zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to prevent processing duplicate geographic records.
          Furthermore, users fetching data via the RESTful API must note that the query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Historical assessments indicate that completeness is exceptionally high for this dataset compared to others; for two-thirds of all balancing areas, fewer than 0.2% of all observations are missing, and about one-quarter of all imbalance volume time series are 100% complete.
          However, because balancing volumes rely heavily on post-operational settlement processes, preliminary operational data is published with an 'Intermediate' status and is subject to revisions. Data pipelines must track the `Status` and `UpdateTime(UTC)` to ensure they capture the 'Final' settlement volumes.
        anomalies:
          Empty_Difference_Field: |
            The `Difference[MWh]` column is optional [0..1] and may frequently be empty depending on the respective TSO's specific national reporting practices and market rules. ETL pipelines must handle null or empty values for this numeric field gracefully.

    ProcuredBalancingCapacity_12.3.F_r3.1:
      title: "Procured Balancing Capacity [12.3.F]"
      oneliner: "Information on the volumes and prices of balancing capacity procured
        by system operators."
      description: |
        This dataset provides detailed transparency on the balancing capacity procured in advance by Transmission System Operators (TSOs). It sheds light on the volumes of active power reserved (such as aFRR, mFRR, FCR, and RR) and the prices paid to Balancing Service Providers (BSPs) to guarantee that sufficient reserves are available to balance the grid and maintain system frequency in real-time.
      compliance: |
        The index `12.3.F` directly refers to Article 12(3)(f) of the Electricity Balancing Guideline (GL EB), which requires the publication of information regarding procured balancing capacity.
      suffix: r3.1
      physical_meaning: |
        The dataset specifies the active power `Volume[MW]` procured and its corresponding `Price` (denominated in the specified `Currency`) over a given delivery period. It dimensionalizes the procured capacity by `ReserveType` (e.g., aFRR, mFRR, FCR, RR), the flow `Direction` (Up, Down, Symmetric), the `TypeOfProduct` (Local, Specific, Standard), and the underlying `ReserveSource` (Generation, Load, Mixed).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The expected filename mask generally follows the standard format: `YYYY_MM_ProcuredBalancingCapacity_12.3.F.csv`.
        time_resolution: |
          The delivery timeframes are bounded by `DeliveryPeriodStart(UTC)` and `DeliveryPeriodEnd(UTC)`. The procurement cycles are classified by the `TimeHorizon` attribute, which can span a wide range of periods: Hourly, Daily, Weekly, Monthly, Yearly, or Long term.
        required_columns: |
          The file contains columns for `InstanceCode`, the overarching `DeliveryPeriodStart(UTC)` and `DeliveryPeriodEnd(UTC)`, as well as the specific `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`.
          Geographic information includes the 16-digit EIC `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (LFA, SCA), and `AreaMapCode`.
          It details the `TimeHorizon`, `ReserveType`, `TypeOfProduct`, `ReserveSource`, and `Direction`.
          Finally, it includes the procured `Volume[MW]`, the `Price`, the `Currency` (as per ISO 4217), the exact `ProcurementDateAndTime(UTC)`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset relies on two parallel timeline concepts: the exact timestamp when the auction/procurement took place (`ProcurementDateAndTime(UTC)`) versus the actual physical period when the reserve must be delivered (`DeliveryPeriod`).
          Additionally, geography is duplicated within the same file under two possible `AreaTypeCode` values: LFA (Load Frequency Control Area) and SCA (Scheduling Area).
        parsing_technical_challenges: |
          When processing this data to analyze procured volumes or costs for a specific zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double-counting duplicate geographical concepts.
          Furthermore, when querying this dataset via the RESTful API, the query size limit is severely restricted to a maximum of 100 documents per request, making bulk historical downloads via the API extremely inefficient. Analysts should rely on the FMS File Library extracts instead.
        data_quality_issues: |
          Optional fields such as `TimeHorizon` and `ReserveSource` might be sparsely populated depending on the reporting practices and market maturity of the respective TSOs.
        anomalies:
          Impending_Deprecation_and_Structural_Change: |
            Data engineers must be aware of a critical, scheduled structural break for this dataset. According to official ENTSO-E specifications, the `ProcuredBalancingCapacity_12.3.F_r3` extract will be officially removed and deprecated on 20/05/2026. It is being replaced by a newer version, `ProcuredBalancingCapacity_12.3.F_r3.1` (available from 20/04/2026). The new `r3.1` version introduces a dedicated `ResolutionCode` column, an `ISP` column, and refactors the price column to `Price[Currency/MW/ISP]`. ETL pipelines must be updated to migrate to the `r3.1` folder and handle the schema evolution.



  Market:
    AuctionRevenue_12.1.A_r3:
      title: "Auction Revenue [12.1.A]"
      oneliner: "Revenues generated from the explicit allocation of cross-zonal transmission
        capacity."
      description: |
        This dataset details the revenues generated by Transmission System Operators (TSOs) or capacity allocation offices from auctioning cross-zonal capacity to market participants under explicit allocation mechanisms. It provides transparency on the financial income derived from managing cross-border congestion across different allocation timeframes.
      compliance: |
        The index `12.1.A` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of information related to explicit allocations, including capacity requested, allocated, and the resulting auction revenue.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the financial `Revenue` generated from selling transmission capacity on a specific border, flowing from an outgoing area to an incoming area, over a specific time interval. The monetary value is denominated in the specified `Currency` based on ISO 4217 codes (e.g., EUR).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The standard naming mask for the files is typically `YYYY_MM_AuctionRevenue_12.1.A.csv`.
        time_resolution: |
          Depending on the `ContractType` (allocation horizon), the time step (`ResolutionCode`) in the file varies widely:
          * Granular intervals: 15 minutes (`PT15M`), 30 minutes (`PT30M`), 60 minutes (`PT60M`)
          * Macro horizons: daily (`P1D`), weekly (`P7D`), monthly (`P1M`), quarterly (`P3M`), or yearly (`P1Y`).
        required_columns: |
          The file contains columns for `InstanceCode`, the start time of the interval `DateTime(UTC)`, the time step `ResolutionCode`, and the `ContractType` (Intraday, Daily, Weekly, Monthly, Yearly, Long term, Quarter-Yearly, Semestrial).
          It includes geographic identifiers for the outgoing zone: `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA, BZA), `OutAreaMapCode`.
          It includes geographic identifiers for the incoming zone: `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA, BZA), `InAreaMapCode`.
          It specifies the financial `Revenue`, the `Currency`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `OutAreaTypeCode` and `InAreaTypeCode` columns contain three possible values:
          * BZN (Bidding Zone) — revenue on trading zone borders.
          * CTA (Control Area) — revenue on dispatcher control area borders.
          * BZA (Bidding Zone Aggregation) — revenue on aggregated zone borders.
        parsing_technical_challenges: |
          When processing this data to calculate the revenue for a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is strictly mandatory to avoid double or triple counting.
          Additionally, analytical queries must explicitly group or filter by `ContractType` to avoid inappropriately summing daily auction revenues with long-term (e.g., yearly) auction revenues.
        data_quality_issues: |
          Values are highly dependent on the results of explicit capacity auctions managed by entities like the Joint Allocation Office (JAO). Data engineers must track the `UpdateTime(UTC)` to capture the most recent values if any post-auction corrections are issued.
        anomalies:
          API_Limitations_and_Whole_Day_Responses: |
            Due to strict limitations on the REST API for Explicit Allocation Information (12.1.A), queries are restricted to a maximum of 100 documents per request. Furthermore, the query response will always return data bounded to a whole day (or a multiple of days), even if only a specific few hours are requested. This makes pagination complex and historical data extraction via API highly impractical, meaning data engineers should heavily rely on the bulk FMS (File Library) monthly CSV extracts for historical ingestion.



    CostsOfCongestionManagement_13.1.C_r3:
      title: "Costs of Congestion Management [13.1.C]"
      oneliner: "Monthly financial costs incurred by TSOs for redispatching, countertrading,
        and other congestion management actions."
      description: |
        This dataset provides transparency on the financial expenditures associated with managing physical congestion within the transmission grid. It details the monthly costs incurred by Transmission System Operators (TSOs) for implementing remedial actions such as redispatching and countertrading to alleviate physical bottlenecks and ensure the operational security of the power system.
      compliance: |
        The index `13.1.C` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which mandates the publication of the costs incurred for congestion management.
      suffix: r3
      physical_meaning: |
        The dataset breaks down the financial expenditures into specific remedial action categories: `RedispatchingCosts`, `CountertradingCosts`, and `OtherCosts`. These components are summed into the `TotalCosts` for a given `Month` and `Year`. All monetary values are denominated in the respective national or regional `Currency` (based on ISO 4217 codes, e.g., EUR, CZK).
      technical_specification:
        format_and_frequency_of_extracts: |
          Unlike operational telemetry which is extracted monthly, this dataset is provided as yearly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          Because they are yearly extracts, the files generally follow the standardized naming mask omitting the month: `YYYY_CostsOfCongestionManagement_13.1.C.csv`.
        time_resolution: |
          The data represents monthly financial aggregates. Therefore, the time step (`ResolutionCode`) in the file is strictly one month (`P1M`). Time intervals are specified using the `Year` and `Month` columns rather than exact UTC start and end timestamps.
        required_columns: |
          The file contains columns for the `Year`, `Month`, the local `TimeZone` (e.g., CET/CEST), and the time step `ResolutionCode`.
          It details the geography with the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (CTA, BZN, CTY), and the country `AreaMapCode`.
          Financial metrics include `RedispatchingCosts`, `CountertradingCosts`, `OtherCosts`, `TotalCosts`, and the `Currency`.
          Finally, it contains the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          A defining feature of this dataset is its financial nature, meaning it relies on monthly aggregations (`P1M`) rather than granular high-frequency intervals (like PT15M). Within a single CSV file, the data is duplicated for different geographic concepts. The `AreaTypeCode` column can contain values such as CTA (Control Area), BZN (Bidding Zone), and CTY (Country).
        parsing_technical_challenges: |
          When aggregating total congestion costs for a specific country or region, prior filtering by matching `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'CTA'`) is strictly mandatory to prevent double or triple counting the exact same costs reported across overlapping geographic boundaries.
          Additionally, when querying this dataset via the REST API, the query size limit is severely restricted to a maximum of 100 documents per request.
        data_quality_issues: |
          Because this dataset relies on complex post-operational financial settlements between TSOs, cross-border partners, and market participants, the data is subject to significant delays and revisions. Data pipelines must carefully track the `UpdateTime(UTC)` to capture finalized financial figures if initial provisional estimates are overwritten.
        anomalies:
          Empty_or_Zero_Cost_Fields: |
            Depending on the specific month and the operational necessity for remedial actions in a given zone, individual cost components like `RedispatchingCosts`, `CountertradingCosts`, or `OtherCosts` might frequently be `0` or left completely empty (null). Data engineering pipelines must be built to handle sparse matrices and null numeric values robustly when performing financial aggregations.



    EnergyPrices_12.1.D_r3:
      title: "Energy Prices [12.1.D]"
      oneliner: "Day-ahead and intraday market clearing prices for electrical energy."
      description: |
        This dataset provides transparency on wholesale energy prices across European markets. It contains the day-ahead and intraday market clearing prices for electrical energy within specific bidding zones.
      compliance: |
        The index `12.1.D` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of day-ahead prices.
      suffix: r3
      physical_meaning: |
        The dataset tracks the actual financial prices applied to electrical energy, represented by `Price[Currency/MWh]` and measured in the specified `Currency` as per ISO 4217. It specifies the `ContractType`, indicating whether the price was formed on the 'Day-ahead' or 'Intraday' market.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library. Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8. The files generally follow the standardized naming mask: `YYYY_MM_EnergyPrices_12.1.D.csv`.
        time_resolution: |
          Depending on the specific market rules, the time step (`ResolutionCode`) in the file may be 15 minutes (`PT15M`), 30 minutes (`PT30M`), or 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for `InstanceCode`, the exact start time of the interval `DateTime(UTC)`, and the time step `ResolutionCode`. It includes the 16-digit EIC code of the zone `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (which is strictly BZN for Bidding Zone), and `MapCode` (renamed to `AreaMapCode` in `_r3.1`). It also details the `ContractType`, an optional `Sequence`, the `Price[Currency/MWh]`, the `Currency`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike operational telemetry datasets that duplicate data across multiple geographic concepts, this dataset relies exclusively on the Bidding Zone (`BZN`) as the defined `AreaTypeCode`. Another distinct feature is its categorization of prices by `ContractType` (Day-ahead or Intraday).
        parsing_technical_challenges: |
          When querying this dataset via the RESTful API, the query response will always return data for a whole day (or a multiple of days, depending on the length of the requested time interval), rather than just the exact requested MTU. Furthermore, the time interval in the response corresponds to the day in the time zone for which the platform publishes the data; meaning a query for April 6 in CET will return a block from April 5 22:00Z to April 6 22:00Z. The API query size limit is restricted to a maximum of a one-year date range per request.
        data_quality_issues: |
          Day-ahead prices show fewer gaps than many other data items, but only a few time series are completely without gaps (such as Spain). No price data are expected for bidding zones that have not introduced a power exchange, which historically affected Bulgaria and Croatia, and still affects Malta.
        anomalies:
          Poland_Zero_Exchange_Gaps: |
            Historically (until March 2017), price data for Poland (PSE SA BZ) were not expected for hours with zero energy exchange with neighbouring countries, which was the case 25% of the time in 2015–2016, leading to structural gaps.
          Whole_Day_API_Responses_and_Time_Zones: |
            Because API responses are strictly grouped by whole days based on local time zones, data engineers cannot request arbitrary UTC hour blocks. ETL pipelines must handle the offset boundaries (like 22:00 or 23:00 UTC) correctly to align with midnight local time, accounting for summer and winter time shifts.



    EnergyPrices_12.1.D_r3.1:
      title: "Energy Prices [12.1.D]"
      oneliner: "Day-ahead and intraday market clearing prices. Patch revision — identical
        schema to `_r3` except `MapCode` → `AreaMapCode`."
      description: |
        Patched revision of `EnergyPrices_12.1.D_r3`, released on 2026-06-02. The only schema change is the rename of `MapCode` to `AreaMapCode` for consistency with other ENTSO-E publications. All 12 columns, enumerations, and data types are otherwise identical per the official Zendesk documentation. The FTP folder contains the same historical range (2014-01 through present, 141 files in PROD, ~886 MB) as `_r3`, with filenames using the `_r3.1` suffix. Both revisions coexist; `_r3` is expected to be deprecated following the same pattern as `ProcuredBalancingCapacity_12.3.F_r3` (deprecated 2026-05-20).
      compliance: |
        Article 12.1.D of EU Regulation No 543/2013.
      suffix: r3.1
      physical_meaning: |
        Identical to `_r3`: actual financial prices `Price[Currency/MWh]` in `Currency` (ISO 4217) for `Day-ahead` and `Intraday` markets per bidding zone.
      technical_specification:
        format_and_frequency_of_extracts: |
          Monthly extracts, tab-delimited UTF-8. Filename mask: `YYYY_MM_EnergyPrices_12.1.D_r3.1.csv`.
        time_resolution: |
          Same as `_r3`: PT15M, PT30M, or PT60M.
        required_columns: |
          Same 12 columns as `_r3`, with one rename: `MapCode` → `AreaMapCode`. Full list: `InstanceCode`, `DateTime(UTC)`, `ResolutionCode`, `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (BZN only), `AreaMapCode`, `ContractType` (Day-ahead, Intraday), `Sequence` [0..1], `Price[Currency/MWh]`, `Currency` (ISO 4217), `UpdateTime(UTC)`.
        parsing_key_feature: |
          Identical to `_r3`. `AreaTypeCode` strictly `BZN`. `AreaMapCode` replaces legacy `MapCode`.
        parsing_technical_challenges: |
          Same REST API constraints as `_r3`.
        data_quality_issues: |
          Same as `_r3`.
        anomalies:
          Poland_Zero_Exchange_Gaps: |
            Same as `_r3`.
          Whole_Day_API_Responses_and_Time_Zones: |
            Same as `_r3`.
      zendesk_url: 
        https://transparencyplatform.zendesk.com/hc/en-us/articles/47308268140689-EnergyPrices-12-1-D-r3-1
      zendesk_last_updated: 2026-06-02



    ExpansionAndDismantlingProjectsReport_9.1_r3:
      title: "Expansion and Dismantling Projects [9.1]"
      oneliner: "Information on planned expansion and dismantling projects of the
        cross-border transmission grid."
      description: |
        This dataset details the planned evolution of the European transmission network. It focuses specifically on expansion projects (such as new interconnectors or capacity upgrades) and the dismantling of existing cross-border transmission infrastructure. It provides market participants with long-term visibility into future transmission capacities, expected net transfer capacities (NTC), and structural changes in the power grid.
      compliance: |
        The index `9.1` refers to Article 9 of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges Transmission System Operators (TSOs) to publish information about future changes to the network and their anticipated impact on cross-zonal capacities.
      suffix: r3
      physical_meaning: |
        The dataset tracks physical and structural lifecycle events of the transmission grid, categorised by `ProjectType` (e.g., 'Interconnector network evolution' or 'Interconnector network dismantling'). It includes specific infrastructure details such as the `AssetCode`, `AssetName`, `AssetLocation`, and `AssetType` (e.g., AC Link, DC Link). Crucially, it provides the expected new capacity limit `NewNTC[MW]`, the `EstimatedCompletionDate`, and the project's current lifecycle `Status` (Active, Cancelled).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          The files generally follow the standardized naming mask for yearly extracts: `YYYY_ExpansionAndDismantlingProjects_9.1.csv`.
        time_resolution: |
          Depending on the specific capacity projection period, the time step (`ResolutionCode`) in the file can vary widely, including short-term intervals (`PT15M`, `PT30M`, `PT60M`) and macro-horizons (`P7D`, `P1M`, `P1Y`).
        required_columns: |
          The file contains columns for `InstanceCode`, `DateTime(UTC)`, and `ResolutionCode`.
          It defines the geography via the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA), and `OutAreaMapCode`, alongside the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA), and `InAreaMapCode`.
          Project details include `ProjectType`, `AssetCode`, `AssetName`, `AssetLocation`, `AssetType`, `NewNTC[MW]`, `EstimatedCompletionDate`, `Status`, an optional `Comment`, and the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset represents projects mapped to specific cross-border connections. Within a single CSV file, the data is duplicated for different geographic concepts. Both `OutAreaTypeCode` and `InAreaTypeCode` columns contain two possible values: BZN (Bidding Zone) and CTA (Control Area).
        parsing_technical_challenges: |
          When aggregating or analysing the data, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is strictly mandatory to avoid double-counting duplicate geographic concepts.
          When querying this dataset via the RESTful API, the query size limit is severely restricted to a maximum of 100 documents per request.
        data_quality_issues: |
          Because these are long-term infrastructure projects, `EstimatedCompletionDate` and `NewNTC[MW]` values are forecasts and subject to frequent revisions by TSOs. Projects may be delayed or cancelled entirely. Data pipelines must track the `Status` and `UpdateTime(UTC)` to ensure the latest project state is reflected.
        anomalies:
          API_100_Documents_Limit: |
            Unlike operational telemetry datasets that allow a 1-year date range for API requests, the Expansion and Dismantling Projects dataset restricts API queries to a strict 100 documents limit. Data engineers should heavily rely on the bulk FMS (File Library) yearly CSV extracts for comprehensive database ingestion to bypass this API bottleneck.



    ExpansionAndDismantlingProjects_9.1_r3:
      title: "Expansion and Dismantling Projects [9.1]"
      oneliner: "Information regarding future expansion and dismantling projects of
        transmission grid interconnectors."
      description: |
        This dataset provides transparency on the evolution of the transmission grid by detailing planned expansion and dismantling projects for interconnectors between geographical areas. It includes information on the type of project, the affected assets, the estimated completion date, and the expected impact on the Net Transfer Capacity (NTC).
      compliance: |
        The index `9.1` directly refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which mandates the publication of information relating to interconnector network expansion and dismantling projects.
      suffix: r3
      physical_meaning: |
        The dataset describes physical changes to the grid infrastructure, specified in the `ProjectType` column as either 'Interconnector network evolution' or 'Interconnector network dismantling'. It specifies the asset involved through `AssetCode`, `AssetName`, `AssetType` (e.g., AC Link), and `AssetLocation`. It provides the anticipated new active power transfer limit via `NewNTC[MW]`, and tracks the project's progress via its `Status` (e.g., Active, Cancelled) and `EstimatedCompletionDate`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
        time_resolution: |
          Depending on the specific project and reporting practices, the time step (`ResolutionCode`) in the file can vary widely:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
          * 7 days (`P7D`)
          * 1 month (`P1M`)
          * 1 year (`P1Y`).
        required_columns: |
          The file contains `InstanceCode`, `DateTime(UTC)`, and `ResolutionCode`.
          It defines the border using the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA), and `OutAreaMapCode`, along with the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode`, and `InAreaMapCode`.
          Project specifics include `ProjectType`, `AssetCode`, `AssetName`, `AssetLocation`, and `AssetType`.
          Values include `NewNTC[MW]`, `EstimatedCompletionDate`, `Status`, an optional `Comment`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset represents interconnector projects, thus relying on paired incoming and outgoing area definitions to define the geographical border.
          Within a single CSV file, the data is duplicated for different geographic concepts, as the `OutAreaTypeCode` and `InAreaTypeCode` columns contain two possible values: BZN (Bidding Zone) and CTA (Control Area).
        parsing_technical_challenges: |
          When processing this data to analyze a specific border, prior filtering by matching `OutAreaTypeCode` and `InAreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) is strictly mandatory to avoid double-counting duplicate geographic records.
          When querying this dataset via the REST API, the query size limit is severely restricted to a maximum of 100 documents per request.
        data_quality_issues: |
          Infrastructure expansion projects are complex and often subject to delays or cancellations. Data engineers must carefully monitor the `Status` column and `EstimatedCompletionDate`, relying on the `UpdateTime(UTC)` to capture the most recent project adjustments and revisions provided by the TSOs.
        anomalies:
          API_Query_Limit: |
            Unlike many other standard operational datasets that allow a 1-year date range for API requests, the Expansion and Dismantling Projects (9.1) dataset strictly limits API queries to a maximum of 100 documents per request. For bulk historical data retrieval, downloading the yearly CSV extracts from the File Library is highly recommended over iterative API pagination.


  Outages:
    UnavailabilityInTheTransmissionGrid_10.1.A_B_r3:
      title: "Unavailability in the Transmission Grid [10.1.A&B]"
      oneliner: "Information on planned and forced unavailabilities in the transmission
        grid, detailing the new Net Transfer Capacity (NTC) and affected assets."
      description: |
        This dataset provides transparency on transmission grid outages, which are often published as Urgent Market Messages (UMMs) by the Transmission System Operators (TSOs). It details both planned maintenance and unexpected forced failures affecting the transmission infrastructure (such as AC links, DC links, transformers, and substations) between or within specific geographical areas. This dataset specifically focuses on how the unavailability impacts the overall Net Transfer Capacity (NTC).
      compliance: |
        The index `10.1.A_B` directly refers to Articles 10.1.A and 10.1.B of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of planned unavailabilities and changes in actual availability in the transmission grid.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the impact of network outages on the grid by reporting the `NewNTC[MW]` (New Net Transfer Capacity) resulting from the unavailability of specific components. It categorizes the event `Type` (Forced or Planned), tracks its lifecycle `Status` (Active, Cancelled, Withdrawn), and identifies the specific infrastructure involved through `AffectedAssetsCodes` and `AffectedAssetsTypes` (AC Link, DC Link, Transformer, Substation).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files (not comma-separated) encoded in UTF-8.
          The files follow the standardized naming mask: `YYYY_MM_UnavailabilityInTheTransmissionGrid_10.1.A_B.csv`.
        time_resolution: |
          Unlike standard continuous timeseries, this is event-driven data specifying the exact start and end times of the outage via `StartOutage(UTC)` and `EndOutage(UTC)`.
          The timeseries breakdown of the capacity limit (`ResolutionCode`) varies by border and reporting TSO:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`)
        required_columns: |
          The file contains `InstanceCode`, `Version`, `OldVersion`,
          outage bounds `StartOutage(UTC)` and `EndOutage(UTC)`,
          timeseries bounds `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`,
          the time step `ResolutionCode`, the outage `Status` and `Type`.
          It details the geography with the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (BZN, CTA), and `OutAreaMapCode`,
          along with the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (BZN, CTA), and `InAreaMapCode`.
          Asset details include `AffectedAssetsCodes`, `AffectedAssetsNames`, `AffectedAssetsTypes`, and `AffectedAssetsLocations`.
          It reports the `NewNTC[MW]`, the operational `Reason`, an optional `Comment`, the `VersionPublicationTimestamp(UTC)`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          The most critical feature of working with this dataset is its event-driven versioning system. Outage messages are frequently updated by TSOs, generating new records with incremented `Version` numbers.
          Furthermore, the geographic orientation is defined by paired `OutAreaTypeCode` and `InAreaTypeCode`, which contain duplicates for Bidding Zones (BZN) and Control Areas (CTA).
        parsing_technical_challenges: |
          When querying this dataset via the REST API, a strict limit of 200 documents per request applies. During peak maintenance seasons, a wide time interval will easily exceed this limit, requiring complex and careful pagination logic.
          Additionally, when processing the bulk CSV files, analysts must filter by `AreaTypeCode` (e.g., `WHERE OutAreaTypeCode = 'BZN' AND InAreaTypeCode = 'BZN'`) to avoid double-counting outages. To find the current, valid state of an outage, data pipelines must group by the unique event identifier (`InstanceCode` or asset) and select the row with the highest `Version` where the `Status` is 'Active'.
        data_quality_issues: |
          Users frequently report issues with UMMs, such as delayed reporting, withdrawn outages not always being clearly communicated via the API, and ambiguity in the data definitions (e.g., whether the outage reflects a reduction in the thermal capacity of the line directly or of the resulting cross-border capacity).
        anomalies:
          Duplicate_UMMs_and_Multiple_Assets: |
            A common anomaly is the presence of duplicate UMMs reported with identical values due to disjointed TSO updates. Furthermore, the `AffectedAssetsCodes` column can sometimes contain a concatenated list of multiple EIC codes (e.g., separated by slashes) rather than a single clean value, which forces data engineers to implement custom string-splitting logic before these codes can be joined with the `TransmissionAssets_r3` master data dictionary.



    UnavailabilityOfConsumptionUnits_7.1.A_B_r3:
      title: "Unavailability of Consumption Units [7.1.A&B]"
      oneliner: "Information on planned unavailabilities and changes in actual availability
        of major consumption units."
      description: |
        This dataset details the scheduled (planned) and forced (actual) unavailabilities of large electricity consumers (typically those with a capacity of 100 MW or more). It provides transparency on significant demand-side reductions that could impact the power system's load profile, operational security, and market balance.
      compliance: |
        The index `7.1.A_B` refers to Articles 7.1.A and 7.1.B of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of planned unavailability and changes in actual availability of consumption units.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the reduction in consumption capability in megawatts. It details the `PlannedUnavailableCapacity[MW]`, the `ActualUnavailableCapacity[MW]`, and the combined `TotalUnavailableCapacity[MW]` for a specific time interval and geographic area.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The filenames typically follow the standardized mask: `YYYY_MM_UnavailabilityOfConsumptionUnits_7.1.A_B.csv`.
        time_resolution: |
          Depending on the market rules and the specific outage event, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for the exact start time of the interval `DateTime(UTC)`, the time step `ResolutionCode`, the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (BZN, CTA), and `AreaMapCode`.
          It includes the capacity values `PlannedUnavailableCapacity[MW]`, `ActualUnavailableCapacity[MW]`, and `TotalUnavailableCapacity[MW]`, along with the record's `UpdateTime(UTC)`.
        parsing_key_feature: |
          An important nuance of working with this dataset is that within a single CSV file, the data is duplicated for different geographic concepts.
          The `AreaTypeCode` column contains two possible values:
          * BZN (Bidding Zone)
          * CTA (Control Area).
        parsing_technical_challenges: |
          Prior filtering by matching `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'BZN'`) is strictly mandatory to avoid double-counting unavailabilities.
          Furthermore, when querying this dataset via the RESTful API, developers can utilize special parameters (`timeIntervalUpdate`, or a combination of `periodStartUpdate` and `periodEndUpdate`). These parameters are exclusive to the "Outages" domain and allow systems to fetch only newly published or updated outage reports (based on `UpdateTime(UTC)`) rather than re-downloading entire historical date ranges.
          The standard API limit for this endpoint allows querying up to a one-year date range per request.
        data_quality_issues: |
          The completeness of this data relies heavily on major consumers accurately reporting their operational status to TSOs. Users frequently report that Urgent Market Messages (UMMs) for outages can sometimes contain duplicate records, or lack complete historical audit trails if updates continuously overwrite previous versions without clear versioning.
        anomalies:
          Reporting_Thresholds: |
            By regulation, only major consumers with a total capacity of 100 MW or more are strictly required to report their unavailabilities. Consequently, this dataset does not capture the unavailability of smaller industrial or commercial loads.
          Sparse_Updates: |
            Fields such as `PlannedUnavailableCapacity[MW]` and `ActualUnavailableCapacity[MW]` can sometimes contain `null` or missing values. Data ingestion pipelines must be robust enough to handle blank values in these columns and fall back to relying on `TotalUnavailableCapacity[MW]`.



    UnavailabilityOfOffshoreGrid_10.1.C_r3:
      title: "Unavailability of Offshore Grid [10.1.C]"
      oneliner: "Information on the unavailability and changes in actual availability
        of offshore grid infrastructure."
      description: |
        This dataset provides transparency on outages and unavailabilities affecting offshore grid infrastructure, which typically connects offshore wind farms to the mainland power system. It details the changes in actual availability, specifying the affected transmission assets (such as DC links) and quantifying the impact on the wind power that can be fed into the grid.
      compliance: |
        The index `10.1.C` refers to Article 10.1.C of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of changes in the actual availability of offshore grid infrastructure.
      suffix: r3
      physical_meaning: |
        The dataset captures specific outage events for offshore grid elements. It identifies the specific infrastructure involved through `AssetCode`, `AssetName`, and `AssetType` (e.g., AC Link, DC Link, Transformer, Substation). It quantifies the operational impact by reporting the `WindPowerFedIn[MW]` against the `InstalledWindPowerGenerationCapacity[MW]`. Furthermore, it tracks the event's lifecycle through its `Status` (Active, Withdrawn) and captures the operational cause via the `Reason` and `ReasonText` fields.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files and use UTF-8 encoding.
          The standard naming mask for these files is typically `YYYY_MM_UnavailabilityOfOffshoreGrid_10.1.C.csv`.
        time_resolution: |
          Unlike standard continuous timeseries data, this dataset is event-driven. It specifies the exact start and end times of the outage event via `StartOutage(UTC)` and `EndOutage(UTC)`. The timeseries boundaries within the duration of the outage are provided by `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`.
        required_columns: |
          The file contains `InstanceCode`, event versioning via `Version` and `OldVersion`, and the bounds `StartOutage(UTC)`, `EndOutage(UTC)`, `StartTimeSeries(UTC)`, and `EndTimeSeries(UTC)`.
          It defines the geography with `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (BZN, CTA), and `AreaMapCode`.
          Asset specifics include `AssetCode`, `AssetName`, and `AssetType`.
          The capacity values are `WindPowerFedIn[MW]` and `InstalledWindPowerGenerationCapacity[MW]`.
          It also includes `Status`, `Reason`, `ReasonText`, `VersionPublicationTimestamp(UTC)`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          A critical feature of working with this dataset is its event-driven versioning system. Outage messages (Urgent Market Messages) are updated by TSOs, which generates new records with incremented `Version` numbers and updated `Status` flags. Additionally, within a single CSV file, the data is duplicated for different geographic concepts, as the `AreaTypeCode` column contains two possible values: BZN (Bidding Zone) and CTA (Control Area).
        parsing_technical_challenges: |
          When processing this data to analyze outages for a specific zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'BZN'`) is strictly mandatory to avoid double-counting duplicate geographic records. To find the current, valid state of an outage, data pipelines must group by the unique event identifier (`InstanceCode`) and select the row with the highest `Version` where the `Status` is 'Active'.
          Furthermore, when querying this dataset via the REST API, a strict limit of 200 documents per request applies, making pagination complex during periods with many updates.
        data_quality_issues: |
          Users frequently report issues with Urgent Market Messages (UMMs) such as duplicate UMMs reported for single facilities, or withdrawn outages not always being clearly communicated. The optional `Reason` and `ReasonText` fields might frequently be empty depending on the reporting practices of the TSO.
        anomalies:
          API_Query_Limits_and_Versioning: |
            The RESTful API restricts queries for this dataset to a maximum of a one-year date range and strictly limits the response to 200 documents per request. Because TSOs frequently overwrite or update outage reports (incrementing versions), data engineers must use robust deduplication and version-control logic to ensure only the latest active state of the offshore grid unavailability is used for analytical modeling.



    UnavailabilityOfProductionAndGenerationUnits_15.1.A_B_C_D_r3:
      title: "Unavailability of Production and Generation Units [15.1.A&B&C&D]"
      oneliner: "Information on planned unavailabilities and changes in actual availability
        of production and generation units."
      description: |
        This dataset provides transparency on power plant outages, which are published as Urgent Market Messages (UMMs) by the Transmission System Operators (TSOs). It details both planned maintenance and unexpected forced failures affecting individual generation units (installed capacity ≥ 100 MW) and entire production units (installed capacity ≥ 200 MW). It helps market participants anticipate supply reductions and potential market tightness.
      compliance: |
        The indices `15.1.A`, `15.1.B`, `15.1.C`, and `15.1.D` directly refer to the relevant articles of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of planned unavailabilities and changes in actual availability of generation and production units.
      suffix: r3
      physical_meaning: |
        The dataset reports the resulting `AvailableCapacity[MW]` in megawatts during an outage event. It categorizes the event `Type` (Forced or Planned), tracks its lifecycle `Status` (Active, Cancelled, Withdrawn), and identifies the specific asset involved via `AssetCode`, `AssetName`, `AssetType` (Generation Unit or Production Unit), and its `ProductionType`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library. Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding. The filenames generally follow the standardized mask: `YYYY_MM_UnavailabilityOfProductionAndGenerationUnits_15.1.A_B_C_D.csv`.
        time_resolution: |
          Unlike continuous timeseries data, this is event-driven data specifying the exact start and end times of the outage via `StartOutage(UTC)` and `EndOutage(UTC)`. The timeseries profile of the capacity limit during the outage is defined by `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)` and varies by reporting TSO.
        required_columns: |
          The file contains `InstanceCode`, `Version`, and the boolean flag `OldVersion`. It includes outage bounds `StartOutage(UTC)` and `EndOutage(UTC)`, and timeseries bounds `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`. It details the outage `Status` and `Type`. Geographic identifiers include the 16-digit EIC code `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (BZN, CTA), and `AreaMapCode`. Asset details include `AssetCode`, `AssetName`, `AssetType`, and `ProductionType`. It reports the `AvailableCapacity[MW]`, the operational `Reason`, an optional `ReasonText`, the `VersionPublicationTimestamp(UTC)`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          The most critical feature of working with this dataset is its event-driven versioning system. Outage messages (UMMs) are frequently updated by TSOs, generating new records with incremented `Version` numbers and changing `OldVersion` flags. Additionally, geography is duplicated within the same file under two possible `AreaTypeCode` values: BZN (Bidding Zone) and CTA (Control Area).
        parsing_technical_challenges: |
          When processing the CSV files, analysts must filter by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'BZN'`) to avoid double-counting outages. To reconstruct the valid timeline of an outage, data pipelines must group by the unique event identifier (`InstanceCode` or asset) and select the row with the highest `Version` where the `Status` is 'Active'. Furthermore, when querying this dataset via the REST API, a strict limit of 200 documents per request applies, requiring careful pagination for wide search windows.
        data_quality_issues: |
          Different TSOs employ varying definitions of generation and production units, leading to inconsistencies. The definition of a "production unit" leaves it open whether the aggregation should be functional (separating units that can be operated individually, applied e.g. in France and Spain) or spatial (combining them if they are located on the same premises, applied in Germany).
        anomalies:
          100_MW_Threshold_Evasion: |
            By regulation, individual generation units must report data if their capacity is ≥ 100 MW. Operators of wind farms and solar parks often interpret this as allowing them to refrain from reporting outages, because individual wind turbines or solar inverters are typically well under 100 MW, even if the total park capacity exceeds the threshold.
          Duplicate_UMMs_and_Orphaned_Updates: |
            Users frequently report the presence of duplicate UMMs with identical values for the same physical outage. Furthermore, updates concerning outages cannot always be cleanly connected to original announcements, meaning each update might appear as a completely new UMM, making it impossible to easily get an aggregated overview of all historical outages for a single power plant.


    UnavailabilityInTheTransmissionGridAffectedAssets_10.1.A_B_r3:
      title: Unavailability in the Transmission Grid - Affected Assets 
        [10.1.A/B]
      oneliner: Details of specific transmission assets affected by planned or 
        unplanned outages.
      description: This dataset details the specific transmission lines, 
        transformers, and sub-stations affected by planned or unplanned outages.
      compliance: Articles 10.1.A and 10.1.B of EU Regulation No 543/2013.
      suffix: r3
      physical_meaning: Identifies physical assets out of service and their 
        nominal and remaining capacities.
      technical_specification:
        format_and_frequency_of_extracts: Provided as monthly extracts in the 
          File Library.
        time_resolution: Event-driven outage intervals.
        required_columns: OutageID, AssetName, AssetCode, NominalCapacity, 
          OutageStart, OutageEnd
        parsing_key_feature: Tracks asset-level outage lifecycles.
        parsing_technical_challenges: Requires joining with Affected Areas 
          dataset to determine market impact.
        data_quality_issues: TSOs may update outage durations dynamically, 
          generating multiple revisions.
        anomalies:
          Dynamic_Revisions: Outage schedules are subject to constant updates as
            grid maintenance proceeds.
    UnavailabilityInTheTransmissionGridAffectedAreas_10.1.A_B_r3:
      title: Unavailability in the Transmission Grid - Affected Areas [10.1.A/B]
      oneliner: Details of geographical areas affected by transmission asset 
        outages.
      description: This dataset specifies the geographical bidding zones and 
        control areas affected by transmission grid outages, including the 
        impact on transfer capacities.
      compliance: Articles 10.1.A and 10.1.B of EU Regulation No 543/2013.
      suffix: r3
      physical_meaning: Quantifies the reduction in cross-border transmission 
        capacity caused by grid outages.
      technical_specification:
        format_and_frequency_of_extracts: Provided as monthly extracts in the 
          File Library.
        time_resolution: Event-driven outage intervals.
        required_columns: OutageID, OutAreaCode, InAreaCode, 
          ReductionInCapacity[MW]
        parsing_key_feature: Directly links grid asset outages to cross-border 
          trading limits.
        parsing_technical_challenges: Must be joined on OutageID with the 
          Affected Assets dataset.
        data_quality_issues: TSOs may report capacity reductions as absolute 
          values or percentage limits depending on the border.
        anomalies:
          Capacity_Definition_Discrepancies: Different borders may report 
            reduction values using inconsistent physical definitions.
  Operations:
    ActualCapacitiesAndOutlookOnFrequencyRestorationReserveAndReplacementReserve_SOGL_188.3_188.4_189.2_189.3_r3:
      title: "Actual Capacities and Outlook on Frequency Restoration Reserve and Replacement
        Reserve [SO GL 188.3, 188.4, 189.2 & 189.3]"
      oneliner: "Information on the actual capacities and capacity outlooks for Frequency
        Restoration Reserve (FRR) and Replacement Reserve (RR)."
      description: |
        This dataset provides transparency on the balancing capacities available to the power system. It details both the forecasted (outlook) and actual capacities for Frequency Restoration Reserves (FRR) and Replacement Reserves (RR). By presenting the minimum, average, and maximum actual capacities alongside the initial capacity outlook, it allows market participants to track how well reserve requirements are being met over a given period.
      compliance: |
        The indices `188.3`, `188.4`, `189.2`, and `189.3` directly refer to the relevant articles of the System Operation Guideline (SO GL), which mandate the publication of capacity outlooks and actual capacities for FRR and RR by system operators.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the active power capacity in megawatts. It includes the forecasted `CapacityOutlook[MW]` as well as the observed `MinimumActualCapacity[MW]`, `AverageActualCapacity[MW]`, and `MaximumActualCapacity[MW]`. These capacities are categorized by the specific `ReserveType` (Frequency restoration reserve (FRR) or Replacement Reserve (RR)) and the flow `Direction` (Up or Down).
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
        time_resolution: |
          Unlike standard operational telemetry, this dataset aggregates data over larger macro-horizons. The typical time step (`ResolutionCode`) in the file is:
          * 3 months / quarterly (`P3M`).
        required_columns: |
          The file relies on `Year` and `Quarter` rather than exact UTC start/end timestamps. It includes the local `TimeZone` (e.g., CET/CEST) and the time step `ResolutionCode`.
          Geographic information includes the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (strictly LFB), and the `MapCode`.
          Balancing characteristics include `ReserveType` (Frequency restoration reserve (FRR), Replacement Reserve (RR)) and `Direction` (Up, Down).
          Capacity metrics include `CapacityOutlook[MW]`, `MinimumActualCapacity[MW]`, `AverageActualCapacity[MW]`, and `MaximumActualCapacity[MW]`.
          Finally, it contains the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike operational telemetry that duplicates data across multiple geographic concepts, this dataset relies exclusively on the Load Frequency Control Block (`LFB`) as the defined `AreaTypeCode`. Another distinct feature is its representation of time using `Year` and `Quarter` columns instead of continuous UTC timestamps.
        parsing_technical_challenges: |
          Data pipelines must be adapted to handle the `P3M` (quarterly) resolution and construct valid date/time intervals manually using the `Year` and `Quarter` integer fields.
        data_quality_issues: |
          Because this dataset combines both forward-looking outlooks and backward-looking actuals, the completeness of the numeric capacity columns depends heavily on the maturity of the data at the time of publication and extraction.
        anomalies:
          Sparse_Capacity_Metrics: |
            Fields such as `CapacityOutlook[MW]`, `MinimumActualCapacity[MW]`, `AverageActualCapacity[MW]`, and `MaximumActualCapacity[MW]` are marked as optional [0..1] and might frequently be empty (null). Data ingestion pipelines must be robust enough to handle blank values in these numeric columns.
          Legacy_Data_Transition: |
            Historically, under the older 'r2' schema, this information was split across four distinct legacy publications (FRR capacity forecast [188.3], FRR actual capacity [188.4], RR capacity forecast [189.2], and RR actual capacity [189.3]). Data engineers compiling long-term historical series must extract older data from these four separate legacy archives in the `TP_Legacy_Publications` folder and merge them to match this unified `r3` structure.



    Algorithm_12.3.K_r3:
      title: "Algorithm [GL EB 12.3.K]"
      oneliner: "Information regarding the algorithms applied for European balancing
        processes."
      description: |
        This data item relates to the publication of the algorithms used for the operation of the European balancing market. Unlike operational telemetry, load measurements, or market time series, this item does not represent dynamic numerical data. Instead, it provides methodological information regarding how balancing bids are processed, matched, and activated across the power system.
      compliance: |
        The index `12.3.K` refers to the relevant article of the Electricity Balancing Guideline (GL EB), which obliges the publication of the algorithms used for balancing energy and capacity.
      suffix: r3
      physical_meaning: |
        This item does not contain physical power system measurements (like megawatts) or financial time series. It represents the algorithmic logic and mathematical frameworks used by system operators and European balancing platforms to clear the market.
      technical_specification:
        format_and_frequency_of_extracts: |
          According to the official ENTSO-E Transparency Platform documentation, this specific data item is NOT available for bulk download via the File Management System (FMS) (File Library). There are no CSV extracts generated for it.
        time_resolution: |
          Not applicable. This is not a continuous time-series dataset.
        required_columns: |
          Not applicable. There is no structured CSV or XML schema associated with this item.
        parsing_key_feature: |
          A defining feature of this item is its strict absence from programmatic data channels. Based on the ENTSO-E Help page matrix, the `Algorithm [GL EB 12.3.K]` item has no FMS link, no REST API endpoint, no XML examples, and no XSD schema. It is only accompanied by a Knowledge Base link.
        parsing_technical_challenges: |
          Data engineers cannot build automated ETL pipelines to fetch this data item via the standard RESTful API or the File Library, as it is completely excluded from these access channels. Analysts and users interested in this information must manually navigate to the ENTSO-E Transparency Platform website to access the provided documentation or static methodological files.
        data_quality_issues: |
          Not applicable, as there is no tabular data to evaluate for completeness, accuracy, or missing values.
        anomalies:
          No_API_or_FMS_Access: |
            This is one of the few items on the Transparency Platform (alongside "Terms and Conditions", "Approved Methodologies", and "Common Annual Report") that is strictly informational. Data ingestion pipelines attempting to query the API for `12.3.K` will not be able to retrieve standard XML market documents.



    ApprovedMethodologies_12.3.J_r3:
      title: "Approved Methodologies [GL EB 12.3.J]"
      oneliner: "Information and documents regarding the approved methodologies for
        European electricity balancing markets."
      description: |
        This data item publishes the approved methodologies under the Electricity Balancing Guideline (GL EB). Rather than providing numerical timeseries data like load or generation, this section provides regulatory transparency. It hosts or links to the official methodological documents, rules, and mathematical frameworks agreed upon by the Transmission System Operators (TSOs) and approved by the relevant regulatory authorities (such as ACER) for the functioning of the balancing markets.
      compliance: |
        The index `12.3.J` directly refers to Article 12(3)(j) of the Electricity Balancing Guideline (GL EB), which mandates the publication of the approved methodologies used in balancing market operations.
      suffix: r3
      physical_meaning: |
        This item does not contain quantitative physical or financial telemetry (such as MW volumes or EUR/MWh prices). Instead, it represents the legal, structural, and procedural frameworks governing how the balancing markets, capacity calculations, and energy exchanges operate.
      technical_specification:
        format_and_frequency_of_extracts: |
          According to the official ENTSO-E Transparency Platform Help page, this specific data item is **not** available as a CSV extract in the File Library (FMS). Furthermore, it is **not** accessible via the RESTful API and does not have associated XML or XSD schemas. It is only accessible via the web portal's knowledge base.
        time_resolution: |
          Not applicable. The content consists of static or semi-static regulatory documents rather than continuous, granular timeseries data.
        required_columns: |
          Not applicable, as there are no flat files or CSV extracts provided for this data item.
        parsing_key_feature: |
          There are no structured data files to parse. Analysts and developers cannot use standard data extraction libraries (like `entsoe-py`) or standard HTTP GET/POST API requests to fetch this item.
        parsing_technical_challenges: |
          Because it lacks REST API and FMS bulk download support, automated ETL (Extract, Transform, Load) pipelines cannot natively ingest this data. Any tracking of methodological updates or document revisions would require custom web scraping of the ENTSO-E portal or manual monitoring of the relevant knowledge base links.
        data_quality_issues: |
          Data quality in this specific context refers to document version control—ensuring that the ENTSO-E platform promptly uploads and links the most recently approved methodologies by ACER and the respective TSOs, maintaining a clear historical archive of older, superseded methodologies.
        anomalies:
          No_Machine_Readable_Endpoints: |
            Unlike the vast majority of operational and market data on the Transparency Platform, `ApprovedMethodologies_12.3.J_r3` entirely lacks machine-readable endpoints. Data engineering pipelines that are designed to programmatically loop through all known data item suffixes to download data will return errors or null responses if they attempt to query this specific identifier via the API or the FMS service.



    CommonAnnualReport_12.3.L_r3:
      title: "Common Annual Report [GL EB 12.3.L]"
      oneliner: "Common annual report on European electricity balancing operations."
      description: |
        This data item refers to the Common Annual Report published under the obligations of the Electricity Balancing Guideline (GL EB). It is designed to provide an aggregated, yearly overview of the European balancing markets, highlighting developments, integration progress, and the overall performance of balancing processes across the synchronous areas.
      compliance: |
        The index `12.3.L` directly refers to the relevant article of the European Electricity Balancing Guideline (GL EB), which mandates the publication of a common annual report regarding balancing market activities.
      suffix: r3
      physical_meaning: |
        Unlike standard continuous time series or operational telemetry, this item represents a comprehensive qualitative and quantitative reporting mechanism (an annual report) summarizing the balancing market's operational and financial states over the previous calendar year.
      technical_specification:
        format_and_frequency_of_extracts: |
          According to the ENTSO-E Transparency Platform specifications, this data item is currently NOT available as a structured flat file extract in the File Library (FMS). There is no automated CSV export provided for this reporting item.
        time_resolution: |
          The temporal scope of the report is strictly yearly.
        required_columns: |
          Not applicable. Structured time-series data columns do not exist for this specific item in the File Library.
        parsing_key_feature: |
          The defining feature of this data item is its unstructured nature within the context of the platform's data domains. As officially indicated by the ENTSO-E data item overview, it explicitly lacks an XSD schema, XML examples, and standard database structures.
        parsing_technical_challenges: |
          Data engineers cannot automate the ingestion of this data via the standard RESTful API or the bulk FTP/File Library channels, as the Transparency Platform explicitly lists it as having no API and no FMS extraction links. Any processing of this information would likely require manual downloading and natural language processing of the published documents.
        data_quality_issues: |
          Not applicable in the context of raw timeseries telemetry, as it is a compiled report rather than a high-frequency sensor or market data feed.
        anomalies:
          Lack_Of_Programmatic_Access: |
            This item stands out because it is one of the few items listed on the Transparency Platform under the "Balancing" domain that entirely lacks programmatic access routes. Users building automated ETL pipelines must bypass this item and handle it manually through the Knowledge Base or document portal if they need the specific annual balancing reports.



    Countertrading_13.1.B_r3.1:
      title: "Countertrading [13.1.B]"
      oneliner: "Information on countertrading actions applied by Transmission System
        Operators to relieve physical congestions."
      description: |
        This dataset details countertrading actions taken by system operators. Countertrading is a remedial action used in congestion management where operators instruct an increase or decrease in cross-border exchanges to relieve physical congestions on the grid and maintain operational security.
      compliance: |
        The index `13.1.B` refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of countertrading actions used for congestion management.
      suffix: r3.1
      physical_meaning: |
        The dataset tracks the active power volume modified due to the countertrade, represented by `ChangeInCrossBorderExchange[MW]`. It specifies the `Action` direction (which can be 'Increase' or 'Decrease'), the operational `Reason` (e.g., 'Load flow overload'), and the specific time bounds of the action via `TimeIntervalFrom(UTC)` and `TimeIntervalTo(UTC)`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files are tab-delimited flat files encoded in UTF-8.
        time_resolution: |
          The time step (`Resolution`) in the file depends on the specific event and market rules, and can be 15 minutes (`PT15M`), 30 minutes (`PT30M`), or 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for `InstanceCode`, the overall event bounds `TimeIntervalFrom(UTC)` and `TimeIntervalTo(UTC)`, the specific series bounds `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`, and the `Resolution`.
          It defines the geography with the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (CTA, BZN), and `OutAreaMapCode`.
          It similarly includes the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (strictly CTA in the example), and `InAreaMapCode`.
          It also contains optional fields `ConnectingMarketParticipantCode` and `ConnectingMarketParticipantName`, the `Action`, `ChangeInCrossBorderExchange[MW]`, the `Reason`, and the `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset defines the geographical orientation using a pair of outgoing and incoming zones. The `OutAreaTypeCode` column contains two possible values: CTA (Control Area) and BZN (Bidding Zone), whereas `InAreaTypeCode` primarily contains CTA.
        parsing_technical_challenges: |
          When querying this dataset via the REST API, the query size limit is strictly restricted to a maximum of 100 documents per request. This requires careful pagination and narrow search windows when retrieving historical data programmatically.
        data_quality_issues: |
          Countertrading is an exceptional remedial action rather than a continuous market schedule. Therefore, data will only be present for intervals when such actions are actually activated by TSOs.
        anomalies:
          Sparsity_in_Participant_Data: |
            Fields identifying the connecting market participant (`ConnectingMarketParticipantCode` and `ConnectingMarketParticipantName`) are optional [0..1] and may frequently be empty depending on the respective TSO's reporting practices. Data ingestion pipelines must be robust enough to handle null values for these string fields.



    CrossBorderMarginalPriceForAfrrCs_IF_aFRR3.16_r3:
      title: "CBMPs for aFRR CS [aFRR IF 3.16]"
      oneliner: "Cross Border Marginal Prices (CBMPs) for the Automatic Frequency
        Restoration Reserve (aFRR) central selection process."
      description: |
        This dataset details the Cross Border Marginal Prices (CBMPs) for the Automatic Frequency Restoration Reserve (aFRR) central selection (CS) process. It provides highly granular price signals for upward and downward balancing energy across different geographical areas participating in the European aFRR platform (PICASSO).
      compliance: |
        The index `IF aFRR 3.16` refers to the Implementation Framework for the European aFRR platform (PICASSO) in accordance with the Electricity Balancing Guideline (EB GL), which mandates the publication of marginal prices for the aFRR central selection process.
      suffix: "r3"
      physical_meaning: |
        The dataset tracks the financial clearing prices for balancing energy during a highly specific optimization cycle. It records the `UpPrice` and `DownPrice` denominated in a specific `Currency` (as per ISO 4217 codes). The physical cycle itself is strictly bounded by `OptimizationCycleStart(UTC)` and `OptimizationCycleEnd(UTC)`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as daily extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          The files generally follow the standardized naming mask for daily extracts: `YYYY_MM_DD_CrossBorderMarginalPriceForAfrrCs_IF_aFRR3.16.csv`.
        time_resolution: |
          The time step (`ResolutionCode`) in this dataset is exceptionally granular, reflecting the fast-paced nature of the aFRR Activation Optimisation Function. It features intervals of:
          * 1 second (`PT1S`)
          * 4 seconds (`PT4S`)
        required_columns: |
          The file contains columns for `OptimizationCycleStart(UTC)`, `OptimizationCycleEnd(UTC)`, and the time step `ResolutionCode`.
          Geographical parameters include the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (IPA, LFA, SCA), and `MapCode`.
          The specific price metrics are `UpPrice`, `DownPrice`, and the `Currency`.
          Finally, it contains the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          The most distinctive features of this dataset are its extreme temporal granularity (down to 1-second intervals) and its geographic duplication. Within a single CSV file, the data is duplicated for different geographic concepts. The `AreaTypeCode` column contains three possible values: IPA (Imbalance Price Area), LFA (Load Frequency Control Area), and SCA (Scheduling Area).
        parsing_technical_challenges: |
          When processing this data to analyze a specific zone, prior filtering by `AreaTypeCode` (e.g., `WHERE AreaTypeCode = 'SCA'`) is strictly mandatory to avoid double or triple counting duplicate geographical concepts. Due to the 1-second and 4-second resolutions, the daily CSV files are extremely large and require robust big data processing pipelines. Furthermore, when querying this dataset via the RESTful API, the query size limit is restricted to a maximum of a one-year date range per request, but practically much smaller time windows should be requested to prevent timeouts due to the massive volume of individual time series documents.
        data_quality_issues: |
          The `UpPrice` and `DownPrice` columns are defined as optional numeric fields `[0..1]`. Depending on the market clearing outcomes of the central selection optimization in a specific cycle, these values might be left completely empty (null).
        anomalies:
          Negative_Prices: |
            Data pipelines must be prepared to handle negative values in the price fields, as the `UpPrice` or `DownPrice` can drop below zero depending on system imbalance states (e.g., an `UpPrice` of `-123.4`). Financial datatypes must accommodate signed floating-point numbers.
          High_Frequency_Data_Volume: |
            Because the data is generated at `PT1S` or `PT4S` intervals, it generates thousands of rows per hour for a single area. ETL platforms must be scaled to handle billions of rows historically and should use column-oriented partitioning strategies (like Parquet) when archiving this specific domain.



    ExchangedReserveCapacity_SOGL_190.3_r3:
      title: "Exchanged Reserve Capacity [SO GL 190.3]"
      oneliner: "Information on the amounts of reserve capacity exchanged between
        different geographical areas."
      description: |
        This dataset details the amount of reserve capacity exchanged between an acquiring area and a connecting area. It provides transparency on the cross-border sharing and exchange of balancing reserves, such as Automatic Frequency Restoration Reserve (aFRR), Frequency Containment Reserve (FCR), Manual Frequency Restoration Reserve (mFRR), and Replacement Reserve (RR).
      compliance: |
        The index `SO GL 190.3` refers to Article 190(3) of the System Operation Guideline (SO GL), which mandates the publication of information regarding the amount of exchanged reserve capacity.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the active power capacity in megawatts (`ExchangedCapacity[MW]`) reserved in a connecting area for the benefit of an acquiring area. It specifies the type of reserve (`ReserveType`), the flow direction (`Direction`: Up, Down, Symmetric), and the specific delivery period bounds via `DeliveryPeriodStart(UTC)` and `DeliveryPeriodEnd(UTC)`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
          Because they are yearly extracts, the files generally follow the standardized naming mask omitting the month and day.
        time_resolution: |
          Depending on the market rules and the specific agreement, the time step (`ResolutionCode`) in the file may be:
          * 15 minutes (`PT15M`)
          * 30 minutes (`PT30M`)
          * 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for `InstanceCode`, `DeliveryPeriodStart(UTC)`, `DeliveryPeriodEnd(UTC)`, and the specific Imbalance Settlement Period `ISP(UTC)`.
          It includes the time step `ResolutionCode`.
          Geographic details include the `AcquiringAreaCode`, `AcquiringAreaDisplayName`, `AcquiringAreaTypeCode` (LFA, LFB, REG), and `AcquiringAreaMapCode` for the acquiring zone.
          It similarly includes `ConnectingAreaCode`, `ConnectingAreaDisplayName`, `ConnectingAreaTypeCode` (LFA, LFB, REG), and `ConnectingAreaMapCode` for the connecting zone.
          It also specifies the `ReserveType` (aFRR, FCR, mFRR, RR), `Direction` (Up, Down, Symmetric), the `ExchangedCapacity[MW]`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          A key feature is that the geography relies on paired acquiring and connecting area definitions to represent the exchange.
          Within a single CSV file, data is duplicated across different geographic concepts. Both the `AcquiringAreaTypeCode` and `ConnectingAreaTypeCode` columns can contain values such as LFA (Load Frequency Control Area), LFB (Load Frequency Control Block), and REG (Region).
        parsing_technical_challenges: |
          When aggregating or analyzing the data for a specific border, prior filtering by matching `AcquiringAreaTypeCode` and `ConnectingAreaTypeCode` (e.g., `WHERE AcquiringAreaTypeCode = 'LFA' AND ConnectingAreaTypeCode = 'LFA'`) is strictly mandatory to avoid double-counting duplicate geographic concepts.
          Additionally, general API query rules apply to this dataset, meaning API requests can cover a date range of up to one year per request.
        data_quality_issues: |
          As this involves reserve capacity exchanges, data relies heavily on accurate reporting by the respective TSOs involved in the exchange agreement. Values may be subject to updates if initial capacity bookings or agreements change prior to the delivery period.
        anomalies:
          Legacy_Data_Archive: |
            Historical data published under the old schema is archived separately. Data engineers compiling long-term historical series prior to the r3 implementation must extract older data from the `ExchangedReserveCapacity_SOGL_190.3_r2` folder within the legacy publications directory and map it to the new structure.



    FrequencyContainmentReserveAmountAndShares_SOGL_187.2_r3:
      title: "Frequency Containment Reserve Amount And Shares [SO GL 187.2]"
      oneliner: "Yearly data on the total required capacity and regional shares of
        Frequency Containment Reserves."
      description: |
        This dataset details the amount and shares of Frequency Containment Reserve (FCR) capacity. It provides transparency on the active power reserves specifically designed to stabilize the system frequency after a sudden imbalance between generation and demand. The data covers the macro-level reserve requirements across entire Synchronous Areas as well as the specific shares allocated to individual Load Frequency Control (LFC) blocks.
      compliance: |
        The index `SO GL 187.2` refers to Article 187(2) of the System Operation Guideline (SO GL), which mandates the publication of the total amount of FCR capacity required for each synchronous area and the corresponding shares of FCR required for each LFC block.
      suffix: r3
      physical_meaning: |
        The dataset quantifies the target active power reserve capacity in megawatts. It includes two distinct metrics: `TotalCapacity[MW]` (representing the overall requirement for a synchronous area) and `ShareOfFrequencyContainmentReserves[MW]` (representing the specific obligation for a smaller LFC block). The data is further dimensionalized by the reserve flow `Direction` (Up, Down, Symmetric) for a given `Year`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
          Because they are yearly extracts, the files generally follow a standardized naming mask omitting the month: `YYYY_FrequencyContainmentReserveAmountAndShares_SOGL_187.2.csv`.
        time_resolution: |
          As this data defines structural, long-term reserve requirements rather than operational telemetry, the time step (`ResolutionCode`) in the file is strictly one year (`P1Y`).
        required_columns: |
          The file contains columns for the `Year` and local `TimeZone`.
          It defines the geography via the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (SNA, LFB), and the `MapCode`.
          Reserve parameters include the `Direction` (Up, Down, Symmetric).
          The capacity values are split between `TotalCapacity[MW]` and `ShareOfFrequencyContainmentReserves[MW]`.
          Finally, it contains the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          A critical and unique parsing feature of this dataset is the mutually exclusive nature of the capacity columns, which completely depends on the geographic concept (`AreaTypeCode`):
          * For a Synchronous Area (`SNA`), only the `TotalCapacity[MW]` field is populated.
          * For a Load Frequency Control Block (`LFB`), only the `ShareOfFrequencyContainmentReserves[MW]` field is populated.
        parsing_technical_challenges: |
          When querying this dataset via the RESTful API, the query size limit restricts requests to a maximum of a one-year date range per request.
          When building ETL pipelines to process the CSV extracts, engineers must explicitly filter or group by `AreaTypeCode` (either `SNA` or `LFB`) and dynamically map the correct capacity column (`TotalCapacity[MW]` or `ShareOfFrequencyContainmentReserves[MW]`) to avoid ingesting null values or miscalculating aggregations.
        data_quality_issues: |
          Because this dataset represents structural yearly targets, the data is generally highly stable and less prone to the frequent revisions or missing intervals seen in operational real-time telemetry. However, data pipelines must gracefully handle the intentional structural sparsity (empty fields) in the capacity columns.
        anomalies:
          Mutually_Exclusive_Capacity_Columns: |
            The fields `TotalCapacity[MW]` and `ShareOfFrequencyContainmentReserves[MW]` are mutually exclusive optional [0..1] fields. If a data analyst blindly extracts `TotalCapacity[MW]` while querying data for a specific LFC Block (LFB), the query will return completely empty/null values. Pipelines must be context-aware of the `AreaTypeCode` being queried.


    PermanentAllocationLimitations_IFs_4.5_r3:
      title: "Permanent Allocation Limitations to Cross-border Capacity on HVDC Lines
        [IFs 4.5]"
      oneliner: "Information on permanent limitations to cross-border capacity on
        HVDC interconnectors for European balancing processes."
      description: |
        This dataset details the permanent limitations applied to the allocation of cross-border capacity on High Voltage Direct Current (HVDC) lines. It provides transparency on the structural constraints affecting the exchange of balancing energy across borders for specific European balancing processes, such as Automatic Frequency Restoration Reserve (aFRR), Manual Frequency Restoration Reserve (mFRR), and Imbalance Netting (IN).
      compliance: |
        The index `IFs 4.5` refers to the Implementation Frameworks for the European balancing platforms (such as PICASSO for aFRR, MARI for mFRR, and IGCC for IN) in accordance with the Electricity Balancing Guideline (EB GL), which mandate the publication of permanent allocation limitations on HVDC interconnectors.
      suffix: r3
      physical_meaning: |
        The dataset tracks the maximum allowed transfer capacity, quantified as `CrossBorderCapacityLimit[MW]`, over specific physical HVDC interconnectors. It identifies the specific balancing `ProcessType` affected and details the operational cause of the limitation under the `Reason` field (e.g., 'Physical cable or converter restrictions' or 'Constraints in controller systems'). The limitation is bounded by a `StartDateTime(UTC)` and an optional `EndDateTime(UTC)`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
        time_resolution: |
          Unlike standard continuous timeseries, this data is validity-period-based. It does not use a continuous `ResolutionCode` but rather relies on exact timestamp bounds: `StartDateTime(UTC)` and an optional `EndDateTime(UTC)` to define the period during which the permanent limitation is active.
        required_columns: |
          The file contains `InstanceCode`, `StartDateTime(UTC)`, and `EndDateTime(UTC)`.
          It defines the geographical border using the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (strictly BZN), and `OutAreaMapCode`, alongside the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (strictly BZN), and `InAreaMapCode`.
          It specifies the balancing `ProcessType` (aFRR, IN, mFRR).
          Asset-specific details include the optional `InterconnectorCode` and `InterconnectorName`.
          Finally, it includes the `CrossBorderCapacityLimit[MW]`, the `Reason`, an optional `Comment`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          Unlike many operational datasets that duplicate data across multiple geographic concepts (like CTA, LFA, etc.), this dataset relies exclusively on Bidding Zones (`BZN`) for both `OutAreaTypeCode` and `InAreaTypeCode`.
        parsing_technical_challenges: |
          Analytical queries must properly handle the potentially open-ended nature of these constraints. The `EndDateTime(UTC)` is an optional field `[0..1]`, meaning data pipelines must implement logic to treat records with a `null` end date as 'currently active' and ongoing limitations.
        data_quality_issues: |
          Details identifying the specific physical infrastructure (`InterconnectorCode` and `InterconnectorName`) are optional string fields `[0..1]`. Depending on the reporting practices of the TSO, these fields might be empty, forcing analysts to rely purely on the Bidding Zone border definitions to understand where the limitation applies.
        anomalies:
          Sparsity_of_End_Dates: |
            Because the dataset focuses on "permanent" limitations, the `EndDateTime(UTC)` will frequently be left empty. ETL processes that expect strict start and end bounds for interval generation will fail or generate errors if they do not explicitly accommodate `null` values in the end-date column.



    RedispatchingCrossBorder_13.1.A_r3.1:
      title: "Redispatching Cross Border [13.1.A]"
      oneliner: "Information on cross-border redispatching actions applied by Transmission
        System Operators to relieve physical grid congestions."
      description: |
        This dataset details cross-border redispatching actions taken by system operators. Redispatching is a remedial action used in congestion management where operators instruct an increase or decrease in generation or load to relieve physical congestions on the transmission grid. Specifically, this dataset covers actions that have a cross-border impact or involve coordination between different control areas, distinguishing it from internal redispatching actions.
      compliance: |
        The index `13.1.A` refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of redispatching actions used for congestion management.
      suffix: r3.1
      physical_meaning: |
        The dataset tracks the energy volume modified due to the cross-border redispatching action, represented by `CapacityImpact[MWh/MTU]`. It specifies the `ActionType` (Generation or Load), the `ActionDirection` (Increase or Decrease), and the specific time bounds of the physical action via `StartRedispatching(UTC)` and `EndRedispatching(UTC)`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library. Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
        time_resolution: |
          The time step (`ResolutionCode`) in the file depends on the specific event and market rules, and can be 15 minutes (`PT15M`), 30 minutes (`PT30M`), or 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for `InstanceCode`, the overall event bounds `StartRedispatching(UTC)` and `EndRedispatching(UTC)`, the specific series bounds `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`, and the `ResolutionCode`.
          It defines the geography with the outgoing zone `OutAreaCode`, `OutAreaDisplayName`, `OutAreaTypeCode` (CTA), and `OutAreaMapCode`.
          It similarly includes the incoming zone equivalents `InAreaCode`, `InAreaDisplayName`, `InAreaTypeCode` (CTA), and `InAreaMapCode`.
          Asset details include `AffectedAssetCode`, `AffectedAssetName`, `AffectedAssetType` (e.g., AC Link), and `AffectedAssetLocation`.
          It also contains optional fields `ConnectingMarketParticipantCode` and `ConnectingMarketParticipantName`, the `ActionType`, `ActionDirection`, `CapacityImpact[MWh/MTU]`, the operational `Reason` (e.g., Load flow overload), an optional `Comment`, and the `UpdateTime(UTC)`.
        parsing_key_feature: |
          The dataset defines the geographical orientation using a pair of outgoing and incoming zones. The `OutAreaTypeCode` and `InAreaTypeCode` columns primarily use CTA (Control Area) to define these cross-border actions.
        parsing_technical_challenges: |
          When querying this dataset via the REST API, the query size limit is strictly restricted to a maximum of 100 documents per request. This requires careful pagination and narrow search windows when retrieving historical data programmatically.
        data_quality_issues: |
          Cross-border redispatching is an exceptional remedial action activated to solve specific operational security violations. Therefore, data will only be present for intervals when such actions are actually required and activated by TSOs.
        anomalies:
          Sparsity_in_Participant_and_Asset_Data: |
            Fields identifying the connecting market participant (`ConnectingMarketParticipantCode` and `ConnectingMarketParticipantName`) and specific affected assets (`AffectedAssetCode`, `AffectedAssetName`, `AffectedAssetType`, `AffectedAssetLocation`) are optional [0..1] and may frequently be empty. Data ingestion pipelines must be robust enough to handle null values for these string fields.
          Legacy_Data_Transition: |
            Historically, under the older 'r2' schema, this information was published as a unified dataset `Redispatching_13.1.A_r2`. It was subsequently split into two separate data items: `RedispatchingInternal_13.1.A_r3.1` and `RedispatchingCrossBorder_13.1.A_r3.1`. Data engineers compiling long-term historical series must extract older data from the unified legacy archive and stitch it to this newer dataset structure.



    RedispatchingInternal_13.1.A_r3.1:
      title: "Redispatching Internal [13.1.A]"
      oneliner: "Information on internal redispatching actions taken by Transmission
        System Operators to relieve physical congestions."
      description: |
        This dataset details internal redispatching actions activated by Transmission System Operators (TSOs) within their own control areas. Redispatching is a remedial action that involves altering the generation and/or load pattern to change physical flows in the transmission system and relieve physical congestions, thereby ensuring operational security.
      compliance: |
        The index `13.1.A` refers to the relevant article of EU Regulation No 543/2013 on the transparency of electricity markets, which obliges the publication of information relating to redispatching actions.
      suffix: r3.1
      physical_meaning: |
        The dataset quantifies the impact of the internal redispatching action, representing the modified energy volume per market time unit via `CapacityImpact[MWh/MTU]`. It specifies the `ActionType` (whether 'Generation' or 'Load' was modified), the `ActionDirection` ('Increase' or 'Decrease'), and provides the operational `Reason` (e.g., Voltage Level Adjustment). The specific time bounds of the event are defined by `StartRedispatching(UTC)` and `EndRedispatching(UTC)`, while the time series details within the event are bounded by `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as monthly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files encoded in UTF-8.
        time_resolution: |
          The time step (`ResolutionCode`) in the file depends on the specific event and market rules, and can be 15 minutes (`PT15M`), 30 minutes (`PT30M`), or 60 minutes (`PT60M`).
        required_columns: |
          The file contains columns for the event identifier `InstanceCode`, the overall event bounds `StartRedispatching(UTC)` and `EndRedispatching(UTC)`, and the specific series bounds `StartTimeSeries(UTC)` and `EndTimeSeries(UTC)`.
          It includes the time step `ResolutionCode`.
          Geography is defined by the 16-digit EIC code `AreaCode`, `AreaDisplayName`, `AreaTypeCode` (which is strictly CTA for Control Area in this internal dataset), and `MapCode`.
          Asset specifics include optional fields `AffectedAssetCode`, `AffectedAssetName`, `AffectedAssetType`, and `AffectedAssetLocation`.
          Participant details include the optional `ConnectingMarketParticipantCode` and `ConnectingMarketParticipantName`.
          Values include `CapacityImpact[MWh/MTU]`, `ActionType`, `ActionDirection`, `Reason`, an optional `Comment`, and the record `UpdateTime(UTC)`.
        parsing_key_feature: |
          Because this dataset pertains to *internal* redispatching, its geographical orientation is strictly defined within a single control area. Unlike cross-border data which relies on In/Out combinations or multiple Bidding Zones, the `AreaTypeCode` here is exclusively focused on the Control Area (`CTA`).
        parsing_technical_challenges: |
          When querying this dataset via the RESTful API, the query size limit is strictly restricted to a maximum of 100 documents per request. This severe limitation requires careful and narrow search windows when retrieving historical data programmatically. Bulk historical downloads should exclusively rely on the FMS File Library extracts.
        data_quality_issues: |
          Redispatching is an exceptional remedial action rather than a continuous baseline schedule. Therefore, data records will only be present for intervals when such actions are actually activated by TSOs to maintain grid security.
        anomalies:
          Sparsity_in_Asset_and_Participant_Data: |
            Fields identifying the specific affected asset (`AffectedAssetCode`, `AffectedAssetName`, `AffectedAssetType`, `AffectedAssetLocation`) and the connecting market participant (`ConnectingMarketParticipantCode`, `ConnectingMarketParticipantName`) are marked as optional [0..1] and may frequently be empty (null) depending on the respective TSO's reporting practices. Data ingestion pipelines must be robust enough to handle null values for these string fields.




    ResultsOfTheCriteriaApplicationProcess_SOGL_185.4_r3:
      title: "Results of the Criteria Application Process [SO GL 185.4]"
      oneliner: "Yearly data on the results of the criteria application process and
        frequency quality evaluation."
      description: |
        This dataset provides transparency on the evaluation of frequency quality criteria for specific geographical areas. It includes statistical measurements and criteria evaluation results such as the Frequency Restoration Control Error (FRCE) and other system frequency deviation metrics.
      compliance: |
        The index `SO GL 185.4` refers to Article 185(4) of the System Operation Guideline (SO GL), which mandates the publication of the results of the criteria application process regarding frequency quality.
      suffix: r3
      physical_meaning: |
        The dataset reports the evaluated numeric `Value` alongside its `UnitOfMeasurement` and an optional `Descriptor`. It categorizes the data by `Type` (which can be 'Criteria' or 'Measurement') and provides a `ShortDescription` specifying the exact metric being reported (e.g., 'Percentile 10 (P 10)', 'Standard deviation', 'Mean value', or 'FRCE calculation and accuracy descriptor'), along with a detailed `Long Description`.
      technical_specification:
        format_and_frequency_of_extracts: |
          Data is provided as yearly extracts in the File Library.
          Despite the `.csv` extension, the files within the File Library are tab-delimited flat files using UTF-8 encoding.
        time_resolution: |
          Unlike standard continuous timeseries, this dataset aggregates data over larger macro-horizons. The time step (`ResolutionCode`) in the file is typically 1 month (`P1M`) or 3 months (`P3M`).
        required_columns: |
          The file relies on `Year`, `Quarter`, and an optional `Month` rather than exact UTC start and end timestamps. It includes the local `TimeZone` (e.g., CET/CEST) and the time step `ResolutionCode`.
          Geographic information includes the 16-digit EIC code `AreaCode`, `AreaDisplayName`, the geographic zone type `AreaTypeCode` (strictly LFB or SNA), and the `MapCode`.
          Data metric details include `Type`, `ShortDescription`, `Long Description`, `Value`, `UnitOfMeasurement`, and `Descriptor`.
          Finally, it contains the record update time `UpdateTime(UTC)`.
        parsing_key_feature: |
          A distinct feature is its representation of time using `Year`, `Quarter`, and `Month` columns instead of continuous UTC timestamps. Furthermore, geographic reporting is exclusively defined for Load Frequency Control Blocks (`LFB`) and Synchronous Areas (`SNA`), rather than standard Bidding Zones or Control Areas.
        parsing_technical_challenges: |
          Data pipelines must dynamically construct valid date/time intervals manually using the `Year`, `Quarter`, and `Month` integer fields, which depend heavily on whether the `ResolutionCode` is `P1M` or `P3M`. Analysts must pivot or filter heavily on the `ShortDescription` column to extract specific frequency metrics (like FRCE percentiles or standard deviations) for meaningful tabular analysis.
        data_quality_issues: |
          The `Month`, `Value`, `UnitOfMeasurement`, and `Descriptor` columns are marked as optional (`[0..1]`) and may be completely empty depending on the respective metric being evaluated. Pipelines must be robust enough to handle these null values.
        anomalies:
          Legacy_Data_Transition: |
            Historically, under the older 'r2' schema, this information was published as "Values of frequency quality evaluation [185.4] Legacy". Data engineers compiling long-term historical series must extract older data from the `ValuesOfFrequencyQualityEvaluations_SOGL_185.2_r2` archive folder and map its contents to this newer `r3` structure.

