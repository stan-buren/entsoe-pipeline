hosts:
  seaweedfs: "localhost"
  iceberg_catalog: "localhost"
  database: "localhost"

metadata:
  seaweedfs:
    description: |
      The IP address or domain name of the SeaweedFS storage server.
      This endpoint is used by S3-compatible client applications, Spark jobs, and
      data pipelines to upload, read, and write raw binary files and Iceberg table data.
      Set to 'localhost' for local single-machine deployment, or the target server's
      LAN IP address for remote access from other nodes.
    examples:
      - "localhost"  # Use 'localhost' for single-machine local development
      - "192.168.0.93"  # Use host's IP (e.g., 192.168.0.93) to allow remote access on the local network
    default: "localhost"
    type: "string"

  iceberg_catalog:
    description: |
      The IP address or domain name of the Apache Iceberg REST Catalog server.
      Spark sessions connect to this host to perform transactional queries, retrieve
      active table schemas, and commit new data versions to the lakehouse storage.
      Usually matches the seaweedfs host when using its built-in REST catalog.
    examples:
      - "localhost"  # Use 'localhost' for single-machine local development
      - "192.168.0.93"  # Use host's IP (e.g., 192.168.0.93) to allow remote access on the local network
    default: "localhost"
    type: "string"

  database:
    description: |
      The IP address or domain name of the PostgreSQL metadata database server.
      Set to 'localhost' (or '127.0.0.1') for local machines, or 'entsoe_postgres' when running inside container networks.
    examples:
      - "localhost"
      - "entsoe_postgres"
    default: "localhost"
    type: "string"
